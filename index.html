function finishSecretRoom(e){
  bossZones = []; enemyShots = [];
  if (e.homeRoom) e.homeRoom.cleared = true;
  const bonus = 250 * floor;
  score += bonus;
  banner = { text: 'ДВОЙНИК ПОВЕРЖЕН  +' + bonus, t: 3 };
}

function bossPhase(e){
  const ratio = e.hp / e.maxHp;
  return ratio < 0.35 ? 3 : (ratio < 0.7 ? 2 : 1);
}
function updateEnemies(dt){
  const hostP = player;
  if (!hostP) return;
  updateBossZones(dt);
  for (let i = enemyShots.length - 1; i >= 0; i--){
    const s = enemyShots[i];
    s.t = (s.t || 0) + dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.t > s.life || !canMove(s.x, s.y)){ enemyShots.splice(i, 1); continue; }
    if (Math.hypot(hostP.x - s.x, hostP.y - s.y) < hostP.r + s.r){
      damagePlayer(s.dmg, s.vx * 0.01, s.vy * 0.01);
      if (s.slow) hostP.slowT = Math.max(hostP.slowT || 0, s.slow);
      enemyShots.splice(i, 1);
    }
  }
  for (const e of enemies){
    if (e.hp <= 0) continue;
    e._targetRemote=null;
    if(mpConnected&&mpRole==='host'){let best=hostP,bestD=Math.hypot(hostP.x-e.x,hostP.y-e.y);for(const r of Object.values(mpRemotePlayers)){if(!r||r.alive===false||r.downed||!Number.isFinite(r.x)||!Number.isFinite(r.y))continue;const rd=Math.hypot(r.x-e.x,r.y-e.y);if(rd<bestD){bestD=rd;best=r;e._targetRemote=r;}}}
    const p=e._targetRemote?{...e._targetRemote,r:18,hp:e._targetRemote.hp,slowT:0}:hostP;
    if (e.spawnTime > 0){ e.spawnTime -= dt; continue; }
    e.hurtFlash = Math.max(0, e.hurtFlash - dt);
    e.stun = Math.max(0, e.stun - dt);
    e.attackCd = Math.max(0, e.attackCd - dt);
    e.attackLock = Math.max(0, (e.attackLock || 0) - dt);
    e.animPhase += dt * 6;
    if (!e.state) { e.state = 'idle'; e.stateT = 0; e.aimAng = 0; e.windDur = 0; e.tele = null; e.dashT = 0; }
    const dx = p.x - e.x, dy = p.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    const room = e.homeRoom;
    const inRoom = room && (p.x >= room.rect.x && p.x <= room.rect.x + room.rect.w &&
                            p.y >= room.rect.y && p.y <= room.rect.y + room.rect.h);
    if (e.stun > 0 && (e.state === 'windup' || e.state === 'dash')){ e.state = 'idle'; e.tele = null; e.dashT = 0; }
    const isBossType = e.isBoss;
    const ph = isBossType ? bossPhase(e) : 1;
    if (isBossType && (e.phase || 1) !== ph){
      e.phase = ph; e.state = 'idle'; e.tele = null; e.dashT = 0; e.attackCd = 0.5;
      sfx('roar'); shake = Math.max(shake, 14); screenFlash = Math.max(screenFlash, 0.2); flashColor = e.glow;
      showToast(ph === 3 ? 'ЯРОСТЬ!' : 'БОСС УСИЛИЛСЯ!');
    }
    const spd = e.speed * (isBossType ? (1 + (ph - 1) * 0.18) : 1);
    const atkCdEff = isBossType ? e.atkCd * (1 - (ph - 1) * 0.18) : e.atkCd;
    if (e.bossKind) bossTick(e, dt, ph, d);
    if (e.type === 'doppel') doppelTick(e, dt);
    if (e.shieldFlash > 0) e.shieldFlash -= dt;
    if (e.stun <= 0){
      if (e.state === 'idle'){
        if (inRoom || isBossType){
          if (e.type === 'archer'){
            if (d > 280) { const ang = Math.atan2(dy, dx); e.x += Math.cos(ang)*spd*dt; e.y += Math.sin(ang)*spd*dt; }
            else if (d < 150) { const ang = Math.atan2(dy, dx); e.x -= Math.cos(ang)*spd*0.8*dt; e.y -= Math.sin(ang)*spd*0.8*dt; }
            else { const perp = Math.atan2(dy, dx) + Math.PI/2; const dir = Math.sin(elapsed*1.3 + e.wobble) > 0 ? 1 : -1; e.x += Math.cos(perp)*spd*0.4*dt*dir; e.y += Math.sin(perp)*spd*0.4*dt*dir; }
            if (e.attackCd <= 0 && (e.attackLock||0) <= 0 && d < 420 && p.hp > 0) startWindup(e, 'aim', 0.55);
          } else if (e.type === 'bomber'){
            const ang = Math.atan2(dy, dx);
            e.x += Math.cos(ang)*spd*dt; e.y += Math.sin(ang)*spd*dt;
            if (d < 64 && p.hp > 0 && (e.attackLock||0) <= 0) startWindup(e, 'fuse', 0.9);
          } else if (e.type === 'necro'){
            const ang = Math.atan2(dy, dx);
            if (d < 230){ e.x -= Math.cos(ang)*spd*dt; e.y -= Math.sin(ang)*spd*dt; }
            else if (d > 380){ e.x += Math.cos(ang)*spd*0.8*dt; e.y += Math.sin(ang)*spd*0.8*dt; }
            else { const perp = ang + Math.PI/2; const dir = Math.sin(elapsed*0.9 + e.wobble) > 0 ? 1 : -1; e.x += Math.cos(perp)*spd*0.4*dt*dir; e.y += Math.sin(perp)*spd*0.4*dt*dir; }
            if (e.attackCd <= 0 && (e.attackLock||0) <= 0 && p.hp > 0 && bossMinions(e) < 4){
              startWindup(e, 'raise', 0.9); necroRaisePlan(e);
            }
          } else if (e.type === 'doppel'){
            doppelIdle(e, ph, d, dx, dy, spd, dt);
          } else if (isBossType && e.bossKind){
            bossIdle(e, ph, d, dx, dy, spd, dt);
          } else if (isBossType){
            const ang = Math.atan2(dy, dx);
            const stop = e.r + p.r + 30;
            if (d >= stop){ e.x += Math.cos(ang)*spd*dt; e.y += Math.sin(ang)*spd*dt; }
            if (e.attackCd <= 0 && (e.attackLock||0) <= 0 && p.hp > 0){
              if (ph === 1) startWindup(e, 'slam', 0.7);
              else if (ph === 2) startWindup(e, 'charge', 0.55);
              else startWindup(e, 'fan', 0.45);
            }
          } else {
            const wob = Math.sin(elapsed*6 + e.wobble) * 0.25;
            const ang = Math.atan2(dy, dx) + wob;
            if (d >= e.r + p.r + 4){ e.x += Math.cos(ang) * e.speed * dt; e.y += Math.sin(ang) * e.speed * dt; }
            if (e.attackCd <= 0 && (e.attackLock||0) <= 0 && p.hp > 0 && d < e.r + p.r + ((e.type === 'brute' || e.type === 'ogre') ? 66 : 58)){
              if (e.type === 'ogre') startWindup(e, 'smash', 0.85);
              else if (e.type === 'brute') startWindup(e, 'heavy', 0.7);
              else if (e.type === 'runner') startWindup(e, 'lunge', 0.4);
              else startWindup(e, 'cone', 0.45);
            }
          }
        } else if (room) {
          const cx = room.rect.x + room.rect.w/2, cy = room.rect.y + room.rect.h/2;
          const rdx = cx - e.x, rdy = cy - e.y;
          const rd = Math.hypot(rdx, rdy) || 1;
          if (rd > 20){ e.x += (rdx / rd) * (e.speed * 0.4) * dt; e.y += (rdy / rd) * (e.speed * 0.4) * dt; }
        }
      } else if (e.state === 'windup'){
        e.stateT += dt;
        if (e.tele === 'aim' || (e.tele === 'ram' && e.stateT < e.windDur*0.55)) telegraphAngles(e);
        if (e.stateT >= e.windDur){
          if (e.tele !== 'ram') telegraphAngles(e);
          if (e.type === 'doppel' && doppelResolve(e, ph, d)){ /* механика Двойника */ }
          else if (e.bossKind && bossResolve(e, ph, d)){ /* обработано механикой босса */ }
          else if (e.tele === 'cone'){
            sfx('swing');
            if (d < e.r + p.r + 60 && Math.abs(angleDiff(e.aimAng, Math.atan2(dy, dx))) < 0.6) enemyAttackHit(e, e.dmg);
            e.state = 'recover'; e.stateT = 0; e.recDur = 0.35; e.attackCd = e.atkCd;
          } else if (e.tele === 'smash'){
            sfx('ogreSmash'); shake = Math.max(shake, 12);
            for (let k = 0; k < 24; k++){
              const a = k / 24 * TAU;
              particles.push({ x: e.x + Math.cos(a)*e.r, y: e.y + Math.sin(a)*e.r, vx: Math.cos(a)*rand(140, 300), vy: Math.sin(a)*rand(140, 300), life: rand(0.3, 0.6), max: 0.6, size: rand(3, 6), color: '#b8c070', glow: true });
            }
            if (d < e.r + 100) enemyAttackHit(e, Math.round(e.dmg * 1.3));
            e.state = 'recover'; e.stateT = 0; e.recDur = 0.75; e.attackCd = e.atkCd;
          } else if (e.tele === 'raise'){
            sfx('necroRaise');
            for (const sp of (e.raiseSpots || [])) spawnMinion(e.homeRoom, 'skeleton', sp[0], sp[1], e, 1);
            e.state = 'recover'; e.stateT = 0; e.recDur = 0.6; e.attackCd = e.atkCd;
          } else if (e.tele === 'heavy'){
            sfx('heavyHit'); shake = Math.max(shake, 7);
            if (d < e.r + p.r + 80 && Math.abs(angleDiff(e.aimAng, Math.atan2(dy, dx))) < 0.85) enemyAttackHit(e, Math.round(e.dmg * 1.35));
            e.state = 'recover'; e.stateT = 0; e.recDur = 0.5; e.attackCd = e.atkCd;
          } else if (e.tele === 'lunge'){
            sfx('charge'); e.dashAng = e.aimAng; e.dashT = 0.26; e.hitDone = false; e.state = 'dash';
          } else if (e.tele === 'aim'){
            sfx('arrow');
            const sp = 330;
            enemyShots.push({ x: e.x + Math.cos(e.aimAng)*e.r, y: e.y + Math.sin(e.aimAng)*e.r, vx: Math.cos(e.aimAng)*sp, vy: Math.sin(e.aimAng)*sp, r: 6, dmg: e.dmg, life: 1.6, color: '#7bff8a', kind: 'arrow' });
            e.state = 'recover'; e.stateT = 0; e.recDur = 0.35; e.attackCd = e.atkCd;
          } else if (e.tele === 'fuse'){
            sfx('boom'); shake = Math.max(shake, 10);
            for (let k = 0; k < 18; k++){
              const a = rand(0, TAU);
              particles.push({ x: e.x, y: e.y, vx: Math.cos(a)*rand(120, 320), vy: Math.sin(a)*rand(120, 320), life: rand(0.3, 0.6), max: 0.6, size: rand(3, 6), color: '#ffaa00', glow: true });
            }
            if (d < 78) enemyAttackHit(e, e.dmg);
            e.hp = 0;
          } else if (e.tele === 'slam'){
            sfx('slam'); shake = Math.max(shake, 16);
            for (let k = 0; k < 26; k++){
              const a = rand(0, TAU);
              particles.push({ x: e.x, y: e.y, vx: Math.cos(a)*rand(160, 420), vy: Math.sin(a)*rand(160, 420), life: rand(0.35, 0.7), max: 0.7, size: rand(3, 7), color: e.glow, glow: true });
            }
            if (d < 130) enemyAttackHit(e, Math.round(e.dmg * 1.2));
            e.state = 'recover'; e.stateT = 0; e.recDur = 0.5; e.attackCd = e.atkCd;
          } else if (e.tele === 'charge'){
            sfx('charge'); e.dashAng = e.aimAng; e.dashT = 0.38; e.hitDone = false; e.state = 'dash';
          } else if (e.tele === 'fan'){
            sfx('shot');
            const n = ph === 3 ? 7 : 5;
            for (let k = 0; k < n; k++){
              const a = e.aimAng + (k - (n-1)/2) * 0.32;
              const sp = 300;
              enemyShots.push({ x: e.x + Math.cos(a)*e.r, y: e.y + Math.sin(a)*e.r, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, r: 7, dmg: Math.round(e.dmg*0.55), life: 1.8, color: e.glow, kind: 'orb' });
            }
            e.state = 'recover'; e.stateT = 0; e.recDur = 0.4; e.attackCd = e.atkCd;
          }
        }
      } else if (e.state === 'dash'){
        e.dashT -= dt;
        const dsp = e.type === 'doppel' ? 620 : (e.tele === 'ram' ? 640 : (e.tele === 'charge' ? 520 : 400));
        e.x += Math.cos(e.dashAng) * dsp * dt;
        e.y += Math.sin(e.dashAng) * dsp * dt;
        if (!e.hitDone && Math.hypot(p.x - e.x, p.y - e.y) < e.r + p.r + 6){ e.hitDone = true; enemyAttackHit(e, e.dmg); }
        if (e.tele === 'ram' && room && e.state === 'dash'){
          const rc = room.rect, cx2 = Math.cos(e.dashAng), cy2 = Math.sin(e.dashAng);
          if ((e.x <= rc.x + e.r + 4 && cx2 < -0.1) || (e.x >= rc.x + rc.w - e.r - 4 && cx2 > 0.1) || (e.y <= rc.y + e.r + 4 && cy2 < -0.1) || (e.y >= rc.y + rc.h - e.r - 4 && cy2 > 0.1)){
            if (e.bossKind === 'gravedigger') bossWallStun(e); else e.dashT = 0;
          }
        }
        if (e.state === 'dash' && e.dashT <= 0){
          if (e.tele === 'ram' && (e.chain || 0) > 0){ e.chain--; e.state = 'windup'; e.stateT = 0; e.windDur = 0.4; telegraphAngles(e); sfx('telegraph'); }
          else if (e.type === 'doppel' && e.after){ const aft = e.after; e.after = null; startWindup(e, aft, 0.35); }
          else { e.state = 'recover'; e.stateT = 0; e.recDur = 0.45; e.attackCd = atkCdEff; e.tele = null; }
        }
      }
      if (e.state === 'recover'){
        e.stateT += dt;
        if (e.stateT >= (e.recDur || 0.35)){ e.state = 'idle'; e.tele = null; }
      }
    }
    e.x += e.vx * dt; e.y += e.vy * dt;
    const damp = Math.pow(0.0008, dt);
    e.vx *= damp; e.vy *= damp;
    if (room){
      e.x = clamp(e.x, room.rect.x + e.r, room.rect.x + room.rect.w - e.r);
      e.y = clamp(e.y, room.rect.y + e.r, room.rect.y + room.rect.h - e.r);
    }
  }
  // Target selection is now integrated into enemy AI above.
  rebuildSpatialHash();
  for (const arr of spatialHash.values()){
    for (let i = 0; i < arr.length; i++){
      for (let j = i + 1; j < arr.length; j++){
        const a = enemies[arr[i]], b = enemies[arr[j]];
        if (a.hp <= 0 || b.hp <= 0) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy);
        const minD = a.r + b.r;
        if (d < minD && d > 0.01){
          const push = (minD - d) * 0.5;
          const nx = dx/d, ny = dy/d;
          a.x -= nx*push; a.y -= ny*push;
          b.x += nx*push; b.y += ny*push;
        }
      }
    }
  }
}

let emberTimer = 0;
function updateParticles(dt){
  emberTimer -= dt;
  if (emberTimer <= 0 && particles.length < MAX_PARTICLES - 20 && (gameState === 'lobby' || gameState === 'dungeon')){
    emberTimer = 0.18;
    particles.push({ x: cam.x + rand(-50, W + 50), y: cam.y + rand(-30, H + 30), vx: rand(-10, 10), vy: rand(-20, -8), life: rand(2, 4), max: 4, size: rand(1.5, 3), color: '#ff9633', ghost: true });
  }
  for (let i = particles.length-1; i >= 0; i--){
    const pt = particles[i];
    pt.life -= dt;
    if (pt.life <= 0){ particles.splice(i,1); continue; }
    pt.x += pt.vx*dt; pt.y += pt.vy*dt;
    const damp = Math.pow(0.02, dt);
    pt.vx *= damp; pt.vy *= damp;
  }
  if (particles.length > MAX_PARTICLES) particles.splice(0, particles.length - MAX_PARTICLES);
}
function updateSlashes(dt){
  for (let i = slashes.length-1; i >= 0; i--){
    const s = slashes[i]; s.t += dt;
    if (s.t >= s.dur) slashes.splice(i,1);
  }
}
function updateFloaters(dt){
  for (let i = floaters.length-1; i >= 0; i--){
    const f = floaters[i]; f.life -= dt; f.y += f.vy*dt;
    f.vy *= Math.pow(0.1, dt);
    if (f.life <= 0) floaters.splice(i,1);
  }
}
function updateComboRings(dt){
  for (let i = comboRings.length-1; i >= 0; i--){
    const r = comboRings[i]; r.t += dt;
    if (r.t < 0) continue;
    const k = clamp(r.t / r.dur, 0, 1);
    r.r = lerp(18, r.maxR, k);
    if (r.t >= r.dur) comboRings.splice(i,1);
  }
}
function updateProjectiles(dt){
  for (let i = projectiles.length-1; i >= 0; i--){
    const pr = projectiles[i];
    pr.t += dt;
    pr.x += pr.vx * dt;
    pr.y += pr.vy * dt;
    if (pr.t > pr.life){ projectiles.splice(i,1); continue; }
    for (const e of enemies){
      if (e.hp <= 0 || e.spawnTime > 0) continue;
      if (Math.hypot(e.x - pr.x, e.y - pr.y) < e.r + pr.r){
        const ang = Math.atan2(e.y - pr.y, e.x - pr.x);
        hitEnemy(e, pr.dmg, ang, 300, false);
        projectiles.splice(i,1);
        break;
      }
    }
  }
}
function updateGroundItems(dt){
  for (let i = groundItems.length - 1; i >= 0; i--){
    const gi = groundItems[i];
    gi.t += dt;
    gi.x += gi.vx * dt;
    gi.y += gi.vy * dt;
    gi.vx *= Math.pow(0.01, dt);
    gi.vy *= Math.pow(0.01, dt);
    if (gi.pickDelay > 0) gi.pickDelay -= dt;
    else if (player && Math.hypot(player.x - gi.x, player.y - gi.y) < player.r + 25){
      pickupItem(gi);
    }
  }
}
function updateSoulOrbs(dt){
  for (let i = soulOrbs.length - 1; i >= 0; i--){
    const so = soulOrbs[i];
    so.t += dt;
    so.x += so.vx * dt;
    so.y += so.vy * dt;
    const damp = Math.pow(0.05, dt);
    so.vx *= damp; so.vy *= damp;
    if (player){
      const dx = player.x - so.x, dy = player.y - so.y;
      const d = Math.hypot(dx, dy) || 1;
      if (so.t > 0.4 && d < 260){
        const pull = 900 + (260 - d) * 4;
        so.vx += dx / d * pull * dt; so.vy += dy / d * pull * dt;
        const sp = Math.hypot(so.vx, so.vy);
        if (sp > 650){ so.vx *= 650 / sp; so.vy *= 650 / sp; }
      }
      if (d < player.r + 30){
        playerSouls += so.value; sfx('soul');
        floaters.push({ x: so.x, y: so.y, vy: -40, life: 0.8, max: 0.8, text: '+' + so.value + ' Д', color: '#5ad7ff', size: 14 });
        soulOrbs.splice(i, 1);
        continue;
      }
    }
    if (so.t > so.life){ soulOrbs.splice(i, 1); }
  }
}
function updateLobbyLogic(dt){
  const p = player;
  if (!p) return;
  const d = lobby.dummy;
  lobby.t += dt;
  d.flash = Math.max(0, d.flash - dt);
  if (d.lastHit > 0){ d.lastHit -= dt; if (d.lastHit <= 0){ d.hp = d.maxHp; } }
  while (d.hits.length && lobby.t - d.hits[0].t > 3) d.hits.shift();
  if (d.hits.length){
    let sum = 0; for (const h of d.hits) sum += h.d;
    d.dps = sum / Math.max(1.5, Math.min(3, lobby.t - d.hits[0].t));
    if (d.dps > stats.dummyBest){ stats.dummyBest = d.dps; lobby._bestDirty = true; }
  } else {
    d.dps = 0;
    if (lobby._bestDirty){ lobby._bestDirty = false; saveProgress(); }
  }
  lobby.portal.pulse += dt * 3;
  lobby.wardrobe.pulse += dt * 2;
  lobby.merchant.pulse += dt * 2.5;
  lobby.trainer.pulse += dt * 2.5;
  const near = (o, extra) => Math.hypot(p.x - o.x, p.y - o.y) < o.r + extra;
  lobby.nearWardrobe = near(lobby.wardrobe, 44);
  lobby.nearMerchant = near(lobby.merchant, 50);
  lobby.nearTrainer  = near(lobby.trainer, 50);
  lobby.nearPortal   = near(lobby.portal, 44);
  lobby.nearBoard    = near(lobby.board, 50);
  lobby.nearFountain = near(lobby.fountain, 40);
  // пылинки и искры
  const m = lobby.motes;
  while (m.length < 70){ m.push({ x: rand(60, LOBBY.w - 60), y: rand(120, LOBBY.h - 60), vx: rand(-4, 4), vy: rand(-6, -1), a: rand(0.15, 0.4), ph: rand(0, 6), ember: false }); }
  if (Math.random() < dt * 14){
    const tc = LOBBY_TORCHES[(Math.random() * LOBBY_TORCHES.length) | 0];
    m.push({ x: tc.x + rand(-4, 4), y: tc.y - 14, vx: rand(-10, 10), vy: rand(-40, -18), a: 0.9, ph: 0, ember: true, life: rand(0.8, 1.6) });
  }
  for (let i = m.length - 1; i >= 0; i--){
    const q = m[i];
    q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.ember){ q.life -= dt; q.a = Math.max(0, q.life); if (q.life <= 0){ m.splice(i, 1); continue; } }
    else if (q.y < 115 || q.x < 55 || q.x > LOBBY.w - 55){ q.y = rand(600, LOBBY.h - 60); q.x = rand(60, LOBBY.w - 60); }
  }
}
function updateDungeonLogic(dt){
  if (!dungeon) return;
  for (let i = enemies.length - 1; i >= 0; i--){
    if (enemies[i].hp <= 0) enemies.splice(i, 1);
  }
  tryEnterRoomCheck();
  checkRoomWaves();
  if (portalExit) portalExit.pulse += dt * 3;
  if (currentBoss && currentBoss.hp <= 0) currentBoss = null;
}
function updateCamera(dt){
  if (!player) return;
  const b = getAreaBounds();
  const tx = clamp(player.x - W/2, 0, Math.max(0, b.w - W));
  const ty = clamp(player.y - H/2, 0, Math.max(0, b.h - H));
  const k = 1 - Math.pow(0.0015, dt);
  cam.x = lerp(cam.x, tx, k);
  cam.y = lerp(cam.y, ty, k);
}
function update(dt){
  elapsed += dt;
  if (banner.t > 0) banner.t -= dt;
  if (screenFlash > 0) screenFlash -= dt;
  if (toast.t > 0) toast.t -= dt;
  if (lastComboTimer > 0) lastComboTimer -= dt;
  updateConc(dt);
  updatePlayer(dt);
  if (gameState === 'dungeon' && (!mpConnected||mpRole==='host')) updateEnemies(dt);
  updateProjectiles(dt);
  updateGroundItems(dt);
  updateSoulOrbs(dt);
  updateParticles(dt);
  updateSlashes(dt);
  updateFloaters(dt);
  updateComboRings(dt);
  if (gameState === 'lobby') updateLobbyLogic(dt);
  else if (gameState === 'dungeon') updateDungeonLogic(dt);
  updateCamera(dt);
  mpUpdate(dt);
  shake = Math.max(0, shake - dt*45);
}
function updateAmbient(dt){
  elapsed += dt;
  menuTime += dt;
  if (screenFlash > 0) screenFlash -= dt;
  if (toast.t > 0) toast.t -= dt;
  if (lastComboTimer > 0) lastComboTimer -= dt;
  updateParticles(dt);
  updateFloaters(dt);
  updateComboRings(dt);
  if (shake > 0) shake = Math.max(0, shake - dt*45);
}

/* ==================== WEAPON SHAPES (3E) ==================== */
function drawWeaponShape(templateKey, x, y, angle, color, glow, scale){
  scale = scale || 1;
  const len = 40 * scale;
  const w = 4 * scale;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  if (templateKey === 'weapon_greataxe' || templateKey === 'greataxe'){
    ctx.strokeStyle = '#5a3820';
    ctx.lineWidth = 6 * scale;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(8, 0);
    ctx.lineTo(8 + len * 1.15, 0);
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.shadowColor = glow; ctx.shadowBlur = 18;
    ctx.beginPath();
    const bx = 8 + len * 0.9;
    ctx.moveTo(bx, -w * 4);
    ctx.quadraticCurveTo(bx + 30 * scale, -w * 5.5, bx + 36 * scale, 0);
    ctx.quadraticCurveTo(bx + 30 * scale, w * 5.5, bx, w * 4);
    ctx.lineTo(bx - 8 * scale, 0);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5 * scale;
    ctx.stroke();
  } else if (templateKey === 'weapon_greatsword' || templateKey === 'greatsword'){
    ctx.fillStyle = color;
    ctx.shadowColor = glow; ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.moveTo(10, -w * 1.1);
    ctx.lineTo(10 + len * 1.25, -w * 0.7);
    ctx.lineTo(10 + len * 1.4, 0);
    ctx.lineTo(10 + len * 1.25, w * 0.7);
    ctx.lineTo(10, w * 1.1);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5 * scale;
    ctx.stroke();
    ctx.fillStyle = '#d4a64a';
    ctx.fillRect(6, -w * 2.6, 6 * scale, w * 5.2);
    ctx.fillStyle = '#5a3820';
    ctx.fillRect(-10, -w * 0.7, 16 * scale, w * 1.4);
    ctx.fillStyle = '#d4a64a';
    ctx.beginPath();
    ctx.arc(-12, 0, w * 1.6, 0, TAU);
    ctx.fill();
  } else if (templateKey === 'weapon_greathammer' || templateKey === 'greathammer'){
    ctx.strokeStyle = '#5a3820';
    ctx.lineWidth = 6 * scale;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(4, 0);
    ctx.lineTo(4 + len * 1.0, 0);
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.shadowColor = glow; ctx.shadowBlur = 18;
    const hx = 4 + len * 1.0;
    ctx.beginPath();
    ctx.moveTo(hx - 6 * scale, -w * 4.2);
    ctx.lineTo(hx + 24 * scale, -w * 4.2);
    ctx.lineTo(hx + 24 * scale, w * 4.2);
    ctx.lineTo(hx - 6 * scale, w * 4.2);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.8 * scale;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillRect(hx + 2 * scale, -w * 3.8, 4 * scale, w * 7.6);
  } else if (templateKey === 'weapon_hammer' || templateKey === 'hammer'){
    ctx.strokeStyle = '#5a3820';
    ctx.lineWidth = 5 * scale;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(4, 0);
    ctx.lineTo(4 + len * 0.9, 0);
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.shadowColor = glow; ctx.shadowBlur = 14;
    const hx = 4 + len * 0.9;
    ctx.beginPath();
    ctx.moveTo(hx - 4 * scale, -w * 3.2);
    ctx.lineTo(hx + 18 * scale, -w * 3.2);
    ctx.lineTo(hx + 18 * scale, w * 3.2);

function exposedEdges(){

    const edges = [
      { h:true,  c:z.y,        a:z.x, b:z.x + z.w, nx:0,  ny:1 },
      { h:true,  c:z.y + z.h,  a:z.x, b:z.x + z.w, nx:0,  ny:-1 },
      { h:false, c:z.x,        a:z.y, b:z.y + z.h, nx:1,  ny:0 },
      { h:false, c:z.x + z.w,  a:z.y, b:z.y + z.h, nx:-1, ny:0 }
    ];
    for (const e of edges){
      let segs = [[e.a, e.b]];
      for (const o of dungeonZones){
        if (o === z) continue;
        let lo, hi, inside;
        if (e.h){ inside = o.y + E < e.c && e.c < o.y + o.h - E; lo = o.x; hi = o.x + o.w; }
        else { inside = o.x + E < e.c && e.c < o.x + o.w - E; lo = o.y; hi = o.y + o.h; }

          if (hi <= sg[0] || lo >= sg[1]) { nx.push(sg); continue; }
          if (lo > sg[0]) nx.push([sg[0], lo]);
          if (hi < sg[1]) nx.push([hi, sg[1]]);
        }
        segs = nx;
      }
      for (const sg of segs){
        if (sg[1] - sg[0] < 1) continue;
        out.push(e.h ? { x1:sg[0], y1:e.c, x2:sg[1], y2:e.c, nx:e.nx, ny:e.ny } : { x1:e.c, y1:sg[0], x2:e.c, y2:sg[1], nx:e.nx, ny:e.ny });

function placeZoneDecor(g, th, z, R, torchOut){

    { ang: Math.PI/2,  wx: (t) => z.x + t,          wy: () => z.y,          len: z.w },
    { ang: -Math.PI/2, wx: (t) => z.x + t,          wy: () => z.y + z.h,    len: z.w },
    { ang: 0,          wx: () => z.x,               wy: (t) => z.y + t,     len: z.h },
    { ang: Math.PI,    wx: () => z.x + z.w,         wy: (t) => z.y + t,     len: z.h }
  ];
  const free = th.deco;
  for (const sd of sides){
    const ux = Math.cos(sd.ang), uy = Math.sin(sd.ang);
    const isOpen = (t) => {
      for (const dd of [-50, -25, 0, 25, 50]){
        const tt = t + dd; if (tt < 0 || tt > sd.len) continue;
        const px = sd.wx(tt), py = sd.wy(tt);

      }
      return false;

    const step = 125, n = Math.max(1, Math.floor(sd.len / step));

      const t = (i + 0.5) / n * sd.len + (R()-0.5)*40;
      if (t < 40 || t > sd.len - 40 || isOpen(t)) continue;
      const wx = sd.wx(t), wy = sd.wy(t);

    // факелы
    const tn = Math.max(1, Math.floor(sd.len / 330));
    for (let i = 0; i < tn; i++){
      const t = (i + 0.5) / tn * sd.len;
      if (t < 60 || t > sd.len - 60 || isOpen(t)) continue;
      const wx = sd.wx(t), wy = sd.wy(t);
      g.save(); g.translate(wx, wy); g.rotate(sd.ang);
      g.fillStyle = '#16121a'; g.fillRect(-2, -5, 10, 10);

      g.fillStyle = '#2a2430'; g.beginPath(); g.arc(16, 0, 7, 0, TAU); g.fill();

      if (th.web){
        g.save(); g.strokeStyle = 'rgba(230,230,245,0.28)'; g.lineWidth = 1;
        for (let k = 0; k <= 4; k++){ const a = (k/4) * Math.PI/2; g.beginPath(); g.moveTo(px, py); g.lineTo(px + sx*Math.cos(a)*86, py + sy*Math.sin(a)*86); g.stroke(); }
        for (const rad of [28, 52, 78]){ g.beginPath(); for (let k = 0; k <= 4; k++){ const a = (k/4) * Math.PI/2; const x = px + sx*Math.cos(a)*rad, y = py + sy*Math.sin(a)*rad; if (k) g.quadraticCurveTo(px + sx*Math.cos(a - 0.2)*rad*0.8, py + sy*Math.sin(a - 0.2)*rad*0.8, x, y); else g.moveTo(x, y); } g.stroke(); }
        g.restore();
      }
    }
    // россыпь по полу
    const loose = th.deco.filter(k => ['bones','skull','crack','blood','puddle','moss','frost','lavacrack','coals'].indexOf(k) >= 0);
    if (loose.length){
      for (let i = 0; i < 10; i++){

        g.restore();
      }
    }
  }

    ctx.drawImage(aura, t.x - sz/2, t.y - sz/2, sz, sz);
    ctx.fillStyle = th.torch;
    ctx.beginPath(); ctx.arc(t.x, t.y, 5.5 + fl * 2, 0, TAU); ctx.fill();
    ctx.fillStyle = th.core;
    ctx.beginPath(); ctx.arc(t.x, t.y, 2.6 + fl, 0, TAU); ctx.fill();
  }
}
function drawAmbientMotes(){
  const th = curTheme();
  const N = 34;
  for (let i = 0; i < N; i++){
    const fr = ((i * 0.618034) % 1), fr2 = ((i * 0.381966 + 0.2) % 1);
    const sp = 0.5 + fr;
    let x = (fr * (W + 160) + elapsed * th.mdx * sp + Math.sin(elapsed * 0.7 + i) * 14) % (W + 160);
    let y = (fr2 * (H + 160) + elapsed * th.mdy * sp) % (H + 160);
    if (x < 0) x += W + 160; if (y < 0) y += H + 160;
    const a = 0.25 + 0.25 * Math.sin(elapsed * 1.6 + i * 2.1);
    ctx.fillStyle = 'rgba(' + th.mote + ',' + a.toFixed(3) + ')';
    const r = 1 + (i % 3) * 0.7;
    ctx.beginPath(); ctx.arc(cam.x + x - 80, cam.y + y - 80, r, 0, TAU); ctx.fill();
  }
}

function drawRoomGates(){
  if (!playerRoom || !isRoomActive(playerRoom)) return;
  const r = playerRoom.rect;
  const pulse = 0.5 + Math.sin(elapsed * 8) * 0.35;
  for (const z of dungeonZones){
    if (z.type !== 'corr') continue;
    const ox = Math.max(z.x, r.x), oy = Math.max(z.y, r.y);
    const ox2 = Math.min(z.x + z.w, r.x + r.w), oy2 = Math.min(z.y + z.h, r.y + r.h);
    if (ox2 <= ox || oy2 <= oy) continue;
    const w = ox2 - ox, h = oy2 - oy;
    ctx.save();
    ctx.globalAlpha = pulse * 0.7;
    ctx.fillStyle = '#ff2b45';
    ctx.fillRect(ox, oy, w, h);
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    if (w > h){ for (let x = ox; x < ox2; x += 20){ ctx.beginPath(); ctx.moveTo(x, oy); ctx.lineTo(x + 20, oy2); ctx.stroke(); } }
    else { for (let y = oy; y < oy2; y += 20){ ctx.beginPath(); ctx.moveTo(ox, y); ctx.lineTo(ox2, y + 20); ctx.stroke(); } }
    ctx.restore();
  }
}
function drawChests(){
  for (const ch of chests){
    if (ch.x < cam.x - 100 || ch.x > cam.x + W + 100) continue;
    if (ch.y < cam.y - 100 || ch.y > cam.y + H + 100) continue;
    if (ch.opened) continue;
    ctx.save();
    ctx.translate(ch.x, ch.y);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.ellipse(0, ch.r*0.7, ch.r, ch.r*0.35, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = ch.gear ? '#6a2a50' : '#5a3820';
    rr(-ch.r, -ch.r*0.6, ch.r*2, ch.r*1.4, 4); ctx.fill();
    ctx.strokeStyle = '#d4a64a'; ctx.lineWidth = 2;
    rr(-ch.r, -ch.r*0.6, ch.r*2, ch.r*1.4, 4); ctx.stroke();
    ctx.fillStyle = '#d4a64a';
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, TAU); ctx.fill();
    const pulse = 0.4 + Math.sin(elapsed * 3) * 0.2;
    ctx.globalAlpha = pulse * 0.4;
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(0, 0, ch.r * 1.6, 0, TAU); ctx.fill();
    ctx.restore();
    if (player && Math.hypot(player.x - ch.x, player.y - ch.y) < ch.r + player.r + 30){
      ctx.save();
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';

      ctx.fillStyle = '#ffd166';
      ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.lineWidth = 3;
      ctx.strokeText('УДАР — ОТКРЫТЬ', ch.x, ch.y + ch.r + 8);

}

function drawProjectiles(){

function drawPlayer(){
  const p = player;
  if (!p || p.hp <= 0) return;
  const ch = getChar();
  const activeHand = p.currentHand || 'R';
  const wm = getWeaponMultForHand(activeHand);
  const wmOther = getWeaponMultForHand(activeHand === 'R' ? 'L' : 'R');
  const blink = p.invuln > 0 && Math.floor(p.invuln*22) % 2 === 0;
  const concLevel = getConcLevel();
  const concColor = CONC_COLORS[concLevel];

  if (concLevel > 0){
    const spr = auraCache[concColor];
    if (spr){ const auraR = 42 + concLevel * 8; const sz = auraR * 2; ctx.drawImage(spr, p.x - sz/2, p.y - sz/2, sz, sz); }
  }
  if (p.ghostBuff){ ctx.save(); ctx.globalAlpha = 0.3 + Math.sin(elapsed * 15) * 0.2; ctx.fillStyle = '#b04bff'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 8, 0, TAU); ctx.fill(); ctx.restore(); }
  if (p.healTimer > 0){ ctx.save(); ctx.globalAlpha = 0.25 + Math.sin(elapsed * 10) * 0.15; ctx.fillStyle = '#7bff8a'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 6, 0, TAU); ctx.fill(); ctx.restore(); }
  if (p.rageTimer > 0){ ctx.save(); ctx.globalAlpha = 0.2 + Math.sin(elapsed * 12) * 0.15; ctx.fillStyle = '#ff2b45'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 10, 0, TAU); ctx.fill(); ctx.restore(); }
  if (p.parryTime > 0){ ctx.save(); ctx.globalAlpha = 0.7; ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 14, 0, TAU); ctx.stroke(); ctx.restore(); }

  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.ellipse(p.x + 2, p.y + 4, 19, 17, 0, 0, TAU); ctx.fill();

  if (p.blockActive){
    ctx.save(); ctx.globalAlpha = 0.6;
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y, 28, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.3; ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(p.x, p.y, 28, 0, TAU); ctx.fill();
    ctx.restore();
  }

  if (p._lastX === undefined){ p._lastX = p.x; p._lastY = p.y; p.walkT = 0; }
  const moved = Math.hypot(p.x - p._lastX, p.y - p._lastY);
  p._lastX = p.x; p._lastY = p.y;
  p.walkT += moved * 0.13;
  const legSwing = moved > 0.4 ? Math.sin(p.walkT) * 7 : 0;

  const hurtF = blink || p.hurtFlash > 0;
  const fa = p.facing, fcos = Math.cos(fa), fsin = Math.sin(fa);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(fa);
  drawCharCore(5.2, { legs: true, legPhase: legSwing / 7, hurt: hurtF, arms: false, part: 'body' });
  ctx.restore();
  const weaponType = getActiveWeaponType(activeHand);
  let swordAngle = p.facing + 0.9;
  if (p.attackTime > 0){
    const prog = 1 - p.attackTime / p.attackDur;
    const ee = 1 - Math.pow(1 - prog, 2.2);
    const stageCfg = getWeaponStageConfig(weaponType, p.atkCombo);
    const arcHalf = stageCfg.arc / 2;
    swordAngle = p.facing + (-arcHalf + ee * arcHalf * 2);
  }
  const twoH = WEAPON_TYPES[weaponType] && WEAPON_TYPES[weaponType].hands === 2;
  const walkSw = legSwing / 7;
  if (p.attackTime <= 0) swordAngle -= walkSw * 0.18;
  const _arms = drawHumanArms(p.x, p.y, p.facing, swordAngle, walkSw, twoH, ch.cloak, '#e8d0b8', '#3a1a20');
  const handR = _arms.handR, handL = _arms.handL, shL = _arms.shL;
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(fa);
  drawCharCore(5.2, { hurt: hurtF, arms: false, part: 'head' });
  ctx.restore();
  if (!wm.isShield){
    drawWeaponShape(wm.templateKey, handR[0] + Math.cos(swordAngle)*4, handR[1] + Math.sin(swordAngle)*4, swordAngle, wm.glow, wm.glow, 1);
  }
  if (!wmOther.isShield && !twoH && wmOther.templateKey !== 'fists'){
    const wlx = handL[0]-shL[0], wly = handL[1]-shL[1];
    const wla = Math.atan2(wly, wlx);
    drawWeaponShape(wmOther.templateKey, handL[0] + Math.cos(wla)*4, handL[1] + Math.sin(wla)*4, wla, wmOther.glow, wmOther.glow, 0.85);
  }
}

function drawEnemy(e){
  if (e.x < cam.x - 200 || e.x > cam.x + W + 200) return;
  if (e.y < cam.y - 200 || e.y > cam.y + H + 200) return;
  let sc = 1;
  if (e.spawnTime > 0) sc = clamp(1 - e.spawnTime/0.5, 0.05, 1);
  sc *= 1 + Math.sin(elapsed*8 + e.wobble)*0.02;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(e.x, e.y + e.r*0.85, e.r*0.9, e.r*0.4, 0, 0, TAU); ctx.fill();
  const spr = getAura(e.glow);
  if (spr){ const sz = e.r * 4.4; ctx.drawImage(spr, e.x - sz/2, e.y - sz/2, sz, sz); }
  const flash = e.hurtFlash > 0;
  const pAng = Math.atan2(player.y - e.y, player.x - e.x);
  // ==== ТЕЛЕГРАФ ====
  if (e.state === 'windup' && e.tele){
    const pr = clamp(e.stateT / Math.max(0.01, e.windDur), 0, 1);
    const pulse = 0.55 + 0.45 * Math.sin(elapsed * 20);
    const a0 = 0.10 + 0.22 * pr;
    ctx.save();
    if (e.tele === 'cone' || e.tele === 'heavy'){
      const half = e.tele === 'heavy' ? 0.85 : 0.6;
      const range = e.r + (e.tele === 'heavy' ? 80 : 60);
      ctx.fillStyle = hexA('#ff2b45', a0 * pulse);
      ctx.beginPath(); ctx.moveTo(e.x, e.y);
      ctx.arc(e.x, e.y, range, e.aimAng - half, e.aimAng + half); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = hexA('#ff2b45', 0.5 * pulse); ctx.lineWidth = 2; ctx.stroke();
    } else if (e.tele === 'lunge' || e.tele === 'charge'){
      const len = e.tele === 'charge' ? 420 : 210;
      const wHalf = e.tele === 'charge' ? 34 : 16;
      ctx.translate(e.x, e.y); ctx.rotate(e.aimAng);
      ctx.fillStyle = hexA(e.tele === 'charge' ? '#ff0033' : '#b04bff', a0 * pulse);
      ctx.fillRect(0, -wHalf, len, wHalf*2);
      ctx.strokeStyle = hexA('#ffffff', 0.4*pulse); ctx.lineWidth = 2;
      ctx.strokeRect(0, -wHalf, len, wHalf*2);
    } else if (e.tele === 'aim'){
      ctx.translate(e.x, e.y); ctx.rotate(e.aimAng);
      ctx.strokeStyle = hexA('#7bff8a', 0.25 + 0.3*pr); ctx.lineWidth = 2.5; ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.moveTo(e.r, 0); ctx.lineTo(e.r + 460, 0); ctx.stroke();
      ctx.setLineDash([]);
    } else if (e.tele === 'fuse' || e.tele === 'slam'){
      const R = e.tele === 'slam' ? 130 : 78;
      const rr2 = e.tele === 'slam' ? R * (0.4 + 0.6*pr) : R * pr;
      ctx.fillStyle = hexA('#ff2b45', (0.10 + 0.2*pr) * pulse);
      ctx.beginPath(); ctx.arc(e.x, e.y, rr2, 0, TAU); ctx.fill();
      ctx.strokeStyle = hexA(e.tele === 'slam' ? e.glow : '#ff2b45', 0.6*pulse); ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(e.x, e.y, R, 0, TAU); ctx.stroke();
    } else if (e.tele === 'fan'){
      ctx.translate(e.x, e.y); ctx.rotate(e.aimAng);
      ctx.fillStyle = hexA(e.glow, 0.1*pulse);
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.arc(0, 0, 420, -0.75, 0.75); ctx.closePath(); ctx.fill();
    } else if (e.tele === 'smash'){
      const R = e.r + 100;
      ctx.fillStyle = hexA('#ff4b2b', (0.10 + 0.22*pr) * pulse);
      ctx.beginPath(); ctx.arc(e.x, e.y, R * (0.35 + 0.65*pr), 0, TAU); ctx.fill();
      ctx.strokeStyle = hexA('#ffb070', 0.6*pulse); ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(e.x, e.y, R, 0, TAU); ctx.stroke();
    } else if (e.tele === 'raise'){
      ctx.strokeStyle = hexA('#7bff8a', 0.35 + 0.4*pr); ctx.lineWidth = 2.5; ctx.setLineDash([5, 5]);
      for (const sp of (e.raiseSpots || [])){ ctx.beginPath(); ctx.arc(sp[0], sp[1], 14 + 6*pr, 0, TAU); ctx.stroke(); }
      ctx.setLineDash([]);
      ctx.strokeStyle = hexA('#b04bff', 0.3 + 0.4*pr); ctx.beginPath(); ctx.arc(e.x, e.y, e.r*(1.4 + pr*0.8), 0, TAU); ctx.stroke();
    } else if (e.tele === 'dslash'){
      ctx.fillStyle = hexA('#9ffcff', a0 * pulse);
      ctx.beginPath(); ctx.moveTo(e.x, e.y);
      ctx.arc(e.x, e.y, e.r + 66, e.aimAng - 0.75, e.aimAng + 0.75); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = hexA('#ffffff', 0.5 * pulse); ctx.lineWidth = 2; ctx.stroke();
    } else if (e.tele === 'dstrike'){
      ctx.translate(e.x, e.y); ctx.rotate(e.aimAng);
      ctx.fillStyle = hexA('#9ffcff', a0 * pulse); ctx.fillRect(0, -24, 300, 48);
      ctx.strokeStyle = hexA('#ffffff', 0.4 * pulse); ctx.lineWidth = 2; ctx.strokeRect(0, -24, 300, 48);
    } else if (e.tele === 'whirl'){
      const R = 118;
      ctx.fillStyle = hexA('#9ffcff', (0.10 + 0.2*pr) * pulse);
      ctx.beginPath(); ctx.arc(e.x, e.y, R * (0.3 + 0.7*pr), 0, TAU); ctx.fill();
      ctx.strokeStyle = hexA('#ffffff', 0.55 * pulse); ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(e.x, e.y, R, 0, TAU); ctx.stroke();
    } else if (e.bossKind){ bossTelegraph(e, pr, pulse); }
    ctx.restore();
  }
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.scale(sc, sc);
  if (e.stun > 0.1){
    ctx.save(); ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#7bff8a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, e.r * 1.3, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  if (e.type === 'doppel'){
    drawDoppel(e, flash);
  } else if (e.isElite || e.isBoss){
    const ph = e.phase || 1;
    const glowInt = ph === 3 ? 1 : ph === 2 ? 0.6 : 0.25;
    ctx.fillStyle = flash ? '#fff' : '#2a0510';
    for (let i = 0; i < 4; i++){
      const side = i < 2 ? -1 : 1;
      const step = Math.sin(e.animPhase * 1.2 + i * 1.6) * e.r * 0.28;
      const lx = (i % 2 === 0 ? -0.7 : 0.7) * e.r;
      const ly = side * e.r * 0.95;
      ctx.beginPath(); ctx.ellipse(lx + step, ly, e.r*0.22, e.r*0.14, 0, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = flash ? '#fff' : (e.isElite ? '#2a1004' : '#1a0008');
    const spikes = e.isElite ? 12 : 8;
    for (let i = 0; i < spikes; i++){
      const a = i/spikes * TAU + e.animPhase*0.1;
      const bx = Math.cos(a) * e.r * 0.9, by = Math.sin(a) * e.r * 0.9;
      const tx = Math.cos(a) * e.r * 1.7, ty = Math.sin(a) * e.r * 1.7;
      const pa = a + Math.PI/2;
      ctx.beginPath();
      ctx.moveTo(bx + Math.cos(pa)*10, by + Math.sin(pa)*10);
      ctx.lineTo(tx, ty);
      ctx.lineTo(bx - Math.cos(pa)*10, by - Math.sin(pa)*10);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = flash ? '#fff' : e.color;
    ctx.beginPath();
    for (let i = 0; i < 8; i++){
      const a = i/8*TAU + TAU/16;
      const rr3 = e.r * (i % 2 === 0 ? 1.02 : 0.88);
      const px2 = Math.cos(a)*rr3, py2 = Math.sin(a)*rr3;
      if (i === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#10000a'; ctx.lineWidth = 4; ctx.stroke();
    ctx.fillStyle = flash ? '#fff' : (e.isElite ? '#3a2008' : '#26030d');
    ctx.beginPath(); ctx.ellipse(0, -e.r*0.45, e.r*0.62, e.r*0.28, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, e.r*0.45, e.r*0.62, e.r*0.28, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = hexA(e.glow, 0.2 + 0.4*glowInt + Math.sin(elapsed*6)*0.1);
    ctx.lineWidth = 2 + ph;
    ctx.beginPath(); ctx.arc(0, 0, e.r*0.72, 0, TAU); ctx.stroke();
    if (e.bossKind) drawBossDecor(e, ph, flash);
    ctx.save(); ctx.rotate(pAng);
    ctx.fillStyle = flash ? '#fff' : '#1a0008';
    ctx.beginPath(); ctx.arc(e.r*0.72, 0, e.r*0.4, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = e.isElite ? '#ffd166' : '#5a0a18';
    ctx.beginPath(); ctx.moveTo(e.r*0.95, -e.r*0.25); ctx.quadraticCurveTo(e.r*1.5, -e.r*0.55, e.r*1.35, -e.r*0.05); ctx.lineTo(e.r*1.0, -e.r*0.08); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(e.r*0.95, e.r*0.25); ctx.quadraticCurveTo(e.r*1.5, e.r*0.55, e.r*1.35, e.r*0.05); ctx.lineTo(e.r*1.0, e.r*0.08); ctx.closePath(); ctx.fill();
    ctx.fillStyle = e.isElite ? '#ffd166' : '#ff2b45';
    ctx.beginPath();
    ctx.arc(e.r*0.92, -e.r*0.13, e.r*0.09 + 2, 0, TAU);
    ctx.arc(e.r*0.92, e.r*0.13, e.r*0.09 + 2, 0, TAU);
    ctx.fill();
    if (ph === 3){ ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(e.r*0.92, -e.r*0.13, 1.6, 0, TAU); ctx.arc(e.r*0.92, e.r*0.13, 1.6, 0, TAU); ctx.fill(); }
    ctx.restore();
  } else if (e.type === 'ogre'){
    const pr = e.state === 'windup' ? clamp(e.stateT / Math.max(0.01, e.windDur), 0, 1) : 0;
    ctx.fillStyle = flash ? '#fff' : '#20240f';
    for (const sd of [-1, 1]){
      const st = Math.sin(e.animPhase * 0.8 + (sd > 0 ? 0 : Math.PI)) * 9;
      ctx.beginPath(); ctx.ellipse(st, sd * e.r * 0.55, 12, 8.5, 0, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = flash ? '#fff' : e.color;
    ctx.beginPath(); ctx.ellipse(0, 0, e.r * 0.98, e.r * 1.1, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#0e1207'; ctx.lineWidth = 3.5; ctx.stroke();
    ctx.fillStyle = flash ? '#fff' : '#5c616b';
    ctx.beginPath(); ctx.ellipse(-e.r * 0.18, 0, e.r * 0.62, e.r * 0.86, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#1c1f26'; ctx.lineWidth = 2.2; ctx.stroke();

function drawSlashes(){
  for (const s of slashes){
    const t = clamp(s.t / s.dur, 0, 1);
    const alpha = 1 - t;
    const color = s.weaponColor || '#ff2b45';
    if (s.combo === -2){
      const len = s.lineLength || 320, wid = s.lineWidth || 40, col = s.lineColor || color;
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.a);
      ctx.globalAlpha = alpha * 0.3; ctx.fillStyle = col;
      const widNow = wid * (1 - t * 0.7);
      ctx.fillRect(0, -widNow, len, widNow * 2);
      ctx.globalAlpha = alpha * 0.95;
      if (!s._grad){
        s._grad = ctx.createLinearGradient(0, 0, len, 0);
        s._grad.addColorStop(0, hexA(col, 0.85));
        s._grad.addColorStop(0.5, hexA(col, 0.5));
        s._grad.addColorStop(1, hexA(col, 0));
      }
      const grad = s._grad;
      ctx.fillStyle = grad;
      ctx.fillRect(0, -widNow/2, len, widNow);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fillRect(0, -3, len, 6);
      ctx.restore();
      continue;
    }
    if (s.combo === -1){
      const radius = 40 + t*60;
      ctx.save(); ctx.translate(s.x, s.y);
      ctx.globalAlpha = alpha * 0.3;
      ctx.strokeStyle = color; ctx.lineWidth = 22 * (1 - t*0.5);
      ctx.beginPath(); ctx.arc(0, 0, radius, 0, TAU); ctx.stroke();
      ctx.globalAlpha = alpha; ctx.lineWidth = 9 * (1 - t*0.5);
      ctx.beginPath(); ctx.arc(0, 0, radius, 0, TAU); ctx.stroke();
      ctx.restore();
      continue;
    }
    const radius = (62 + 12) * (0.72 + t*0.34);
    const arcHalf = 1.0;
    const a0 = -arcHalf + t * arcHalf * 0.6;
    const a1 =  arcHalf - t * arcHalf * 0.18;
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.a);
    ctx.lineCap = 'round';
    ctx.globalAlpha = alpha * 0.35;
    ctx.strokeStyle = color; ctx.lineWidth = 22 * (1 - t*0.6);
    ctx.beginPath(); ctx.arc(0, 0, radius, a0, a1); ctx.stroke();
    ctx.globalAlpha = alpha * 0.95;
    ctx.strokeStyle = s.combo === 2 ? color : '#ffffff';
    ctx.lineWidth = 11 * (1 - t*0.6);
    ctx.beginPath(); ctx.arc(0, 0, radius, a0, a1); ctx.stroke();
    ctx.restore();
  }
}

function drawComboRings(){
  for (const r of comboRings){
    if (r.t < 0) continue;
    const k = clamp(r.t / r.dur, 0, 1);
    ctx.save();
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = r.width * (1 - k*0.7);
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = (1 - k) * 0.3;
    ctx.lineWidth = r.width * (1 - k*0.7) * 2.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
    ctx.restore();
  }
}

function drawParticles(){
  const cx0 = cam.x - PARTICLE_CULL, cy0 = cam.y - PARTICLE_CULL;
  const cx1 = cam.x + W + PARTICLE_CULL, cy1 = cam.y + H + PARTICLE_CULL;
  for (let i = 0; i < particles.length; i++){
    const pt = particles[i];
    if (pt.x < cx0 || pt.x > cx1) continue;
    if (pt.y < cy0 || pt.y > cy1) continue;
    const a = clamp(pt.life / pt.max, 0, 1);
    ctx.globalAlpha = a * (pt.ghost ? 0.35 : 1);
    const spr = getDotSprite(pt.color);
    const sz = pt.size * (pt.ghost ? (0.6 + a*0.6) : a*0.8 + 0.3) * 2.2;
    ctx.drawImage(spr, pt.x - sz/2, pt.y - sz/2, sz, sz);
  }
  ctx.globalAlpha = 1;
}

function drawFloaters(){
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const cx0 = cam.x - 100, cy0 = cam.y - 100;
  const cx1 = cam.x + W + 100, cy1 = cam.y + H + 100;
  for (const f of floaters){
    if (f.x < cx0 || f.x > cx1) continue;
    if (f.y < cy0 || f.y > cy1) continue;
    const a = clamp(f.life / f.max, 0, 1);

function drawMinimap(){

  const mapH = minimapCanvas.height;
  const mx = W - mapW - 20;
  const my = 62;
  const worldW = dungeonWorldW();
  const scale = Math.min(140 / worldW, 110 / dungeonWorldH());
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  rr(mx - 6, my - 20, mapW + 12, mapH + 26, 6); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = 'bold 9px system-ui';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('ЭТАЖ ' + floor, mx, my - 16);
  ctx.drawImage(minimapCanvas, mx, my);
  for (const e of enemies){
    if (e.hp <= 0) continue;
    e._targetRemote=null;
    if(mpConnected&&mpRole==='host'){let best=hostP,bestD=Math.hypot(hostP.x-e.x,hostP.y-e.y);for(const r of Object.values(mpRemotePlayers)){if(!r||r.alive===false||r.downed||!Number.isFinite(r.x)||!Number.isFinite(r.y))continue;const rd=Math.hypot(r.x-e.x,r.y-e.y);if(rd<bestD){bestD=rd;best=r;e._targetRemote=r;}}}
    const p=e._targetRemote?{...e._targetRemote,r:18,hp:e._targetRemote.hp,slowT:0}:hostP;
    const ex = mx + e.x * scale;
    const ey = my + e.y * scale;
    ctx.fillStyle = e.isElite ? '#ffd166' : (e.isBoss ? '#ff0033' : 'rgba(255,80,100,0.85)');
    ctx.beginPath();
    ctx.arc(ex, ey, e.isBoss ? 4 : 2, 0, TAU);
    ctx.fill();
  }
  if (player){
    const px = mx + player.x * scale;
    const py = my + player.y * scale;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(px, py, 3.5, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#c04bff'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(px, py, 5, 0, TAU); ctx.stroke();
  }
}

function getInvLayout(){
  const S = clamp(Math.min(W/1100, H/700), 0.55, 1.0) * UI_SCALE_VALUES[uiScaleLevel];
  const pad = 12 * S, headH = 44 * S, gap = 6 * S, cols = 6, rows = 4;
  const L = { S, pad, headH, gap, cols, rows };
  L.close = [W - 40*S, 8*S, 32*S, 32*S];
  const bodyH = H - headH - pad;
  const descWmin = 210*S, descWmax = 320*S, figW = 112*S;
  const wCell = (W - pad*4 - (24*S + 50*S + figW) - descWmin - gap*(cols-1)) / cols;
  const hCell = (bodyH - 28*S - 6*S - gap*(rows-1) - 24*S) / (rows + 0.85);
  let cell = Math.min(wCell, hCell, 70*S);
  L.wide = cell >= 36*S;
  if (L.wide){
    L.cell = cell;
    const qs = Math.min(cell*0.85, 56*S);
    const eqSize = Math.min(58*S, cell*0.92);
    const leftW = 24*S + eqSize + figW;
    const gridW = cols*cell + (cols-1)*gap, gridH = rows*cell + (rows-1)*gap;
    const gridBlockH = 34*S + gridH + 24*S + qs;
    const eqBlockH = 24*S + 5*(eqSize + 18*S) + 28*S;
    const Hc = Math.min(bodyH, Math.max(gridBlockH, eqBlockH));
    const descW = clamp(W - (pad*4 + leftW + gridW), descWmin, descWmax);
    const ox = Math.max(0, (W - (pad*4 + leftW + gridW + descW)) / 2);
    const lx = pad + ox, ly = headH;
    L.charPanel = [lx, ly, leftW, Hc];
    const pitch = (Hc - 24*S - 28*S) / 5;
    const eqS = Math.min(eqSize, pitch - 14*S);
    L.eq = {};
    INV_EQ_ORDER.forEach((k, i) => { L.eq[k] = { x: lx + 8*S, y: ly + 24*S + i*pitch + 2*S, size: eqS }; });
    const fx = lx + 8*S + eqS + 8*S, fw = leftW - (fx - lx) - 8*S;
    const fy = ly + 24*S, fh = Hc - 24*S - 28*S;
    const figH = Math.min(fh - 16*S, fw*0.82);
    L.figure = { cx: fx + fw/2, cy: fy + fh/2 + figH/2 - 4*S, h: figH };
    L.charRect = [fx, fy, fw, fh];
    L.defPos = { x: lx + leftW/2, y: ly + Hc - 14*S };
    L.gridX = lx + leftW + pad;
    L.sort = [L.gridX, headH, 76*S, 28*S];
    L.countPos = { x: L.gridX + gridW, y: headH + 14*S };
    L.gridY = headH + 34*S;
    L.gridW = gridW;
    L.qs = { size: qs, gap: 6*S, x0: L.gridX, y: L.gridY + gridH + 26*S, labelY: L.gridY + gridH + 12*S };
    const dx = L.gridX + gridW + pad;
    L.desc = { x: dx, y: headH, w: descW, h: Hc };
  } else {
    cell = Math.max(34*S, Math.min(48*S, (W - pad*2 - gap*(cols-1)) / cols));
    L.cell = cell;
    const eqSize = Math.min(48*S, (W - pad*2 - gap*4) / 5);
    L.eq = {};
    INV_EQ_ORDER.forEach((k, i) => { L.eq[k] = { x: pad + i*(eqSize+gap), y: headH, size: eqSize }; });
    const rowY = headH + eqSize + 14*S;
    L.defPos = { x: pad, y: rowY + 12*S, left: true };
    L.wardBtn = [W - pad - 120*S, rowY, 120*S, 24*S];
    L.charRect = L.wardBtn;
    L.sort = [pad, rowY + 30*S, 70*S, 26*S];
    L.gridW = cols*cell + (cols-1)*gap;
    L.countPos = { x: pad + L.gridW, y: rowY + 30*S + 13*S };
    L.gridX = pad;
    L.gridY = rowY + 30*S + 26*S + 4*S;
    const gridH = rows*cell + (rows-1)*gap;
    const qs = Math.min(36*S, cell);
    L.qs = { size: qs, gap: 6*S, x0: pad, y: L.gridY + gridH + 20*S, labelY: L.gridY + gridH + 6*S };
    const dy = L.qs.y + qs + 8*S;
    L.desc = { x: pad, y: dy, w: W - pad*2, h: Math.max(110*S, H - dy - pad) };
  }
  return L;
}

function wrapText(text, maxW, fontS){
  ctx.font = `bold ${Math.round(fontS)}px system-ui`;
  const words = String(text).split(' ');
  const lines = [];
  let cur = '';
  for (const w of words){
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; }
    else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;

  playerInventory.equipment[slot] = null;
  if (playerInventory.items.length < INV_MAX){
    playerInventory.items.push(it);
  } else {
    dropItemAt(player.x, player.y, it, 1.5);
  }
  saveProgress();
}
function sellValue(it){
  let base = 8;
  const st = SHOP_STOCK.find(x => x.templateKey === it.templateKey);
  if (st) base = st.price;
  else if (it.type === 'armor') base = 10 + (it.defense || 0) * 2;
  else if (it.type === 'weapon') base = 40;
  const r = RARITIES[it.rarity] || RARITIES.common;
  base += (it.upg || 0) * 25;
  return Math.max(1, Math.round(base * 0.4 * r.mult)) * (it.quantity || 1);
}
function sortInventory(){
  mergeStacks();
  const rank = t => t === 'weapon' ? 0 : (t === 'armor' ? 1 : 2);
  const rr2 = r => ({ common:0, rare:1, epic:2, legendary:3 })[r] || 0;
  playerInventory.items.sort((a,b) => {
    const d = rank(a.type) - rank(b.type);
    if (d) return d;
    const d2 = rr2(a.rarity) - rr2(b.rarity);
    if (d2) return d2;
    return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0);
  });
  showToast('Инвентарь отсортирован');
  saveProgress();
}
function getSelectedItem(){
  if (playerInventory.selectedSlot){
    const it = playerInventory.equipment[playerInventory.selectedSlot];
    if (it) return { kind:'slot', slot:playerInventory.selectedSlot, item:it };
    playerInventory.selectedSlot = null;
  }
  if (playerInventory.selectedItem) return { kind:'item', item:playerInventory.selectedItem };
  return null;
}
let _invButtons = [];
function getInvButtons(sel){
  _invButtons = [];
  if (!sel || !sel.item) return _invButtons;
  const it = sel.item;
  const eq = playerInventory.equipment;
  if (sel.kind === 'slot'){
    _invButtons.push({ act:'unequip', label:'СНЯТЬ', color:'#8a3a3a' });
    return _invButtons;
  }
  if (it.type === 'armor'){
    _invButtons.push({ act:'equip', hand:'R', label:'НАДЕТЬ', color:'#3a7a4a' });
  } else if (it.type === 'weapon'){
    const wt = it.weaponType || mapTemplateToWeaponType(it.templateKey);
    if (WEAPON_TYPES[wt] && WEAPON_TYPES[wt].hands === 2){
      _invButtons.push({ act:'equip', hand:'R', label:'НАДЕТЬ (2 РУКИ)', color:'#3a7a4a' });
    } else {
      _invButtons.push({ act:'equip', hand:'R', label:'НАДЕТЬ (ПРАВАЯ)', color:'#3a7a4a' });
      if (!eq.handL) _invButtons.push({ act:'equip', hand:'L', label:'В ЛЕВУЮ РУКУ', color:'#3a5a7a' });
    }
  } else if (it.type === 'consumable'){
    _invButtons.push({ act:'use', label:'ИСПОЛЬЗОВАТЬ', color:'#3a7a4a' });
    _invButtons.push({ act:'quick', label:'В БЫСТРЫЙ СЛОТ', color:'#3a5a7a' });
    if ((it.quantity || 1) >= 2) _invButtons.push({ act:'split', label:'РАЗДЕЛИТЬ СТАК', color:'#4a4a6a' });
  }
  if (gameState === 'lobby') _invButtons.push({ act:'sell', label:'ПРОДАТЬ +' + sellValue(it) + ' 🪙', color:'#8a6a1a' });
  _invButtons.push({ act:'drop', label:'ВЫБРОСИТЬ', color:'#8a3a3a' });
  return _invButtons;
}
function doInvAction(act, sel, btn){
  if (!sel) return;
  if (act === 'unequip'){
    unequipSlot(sel.slot);
  } else if (act === 'equip'){
    equipItemTo(sel.item, (btn && btn.hand) || 'R');
  } else if (act === 'use'){
    useConsumable(sel.item);
  } else if (act === 'quick'){
    assignToQuickSlot(sel.item);
  } else if (act === 'split'){
    splitStack(sel.item);
  } else if (act === 'sell'){
    const v = sellValue(sel.item);
    const arr = playerInventory.items;
    const idx = arr.indexOf(sel.item);
    if (idx >= 0) arr.splice(idx, 1);
    playerGold += v;
    playerInventory.selectedItem = null;
    showToast('Продано: +' + v + ' 🪙');
  } else if (act === 'drop'){
    const arr = playerInventory.items;
    const idx = arr.indexOf(sel.item);
    if (idx >= 0) arr.splice(idx, 1);
    playerInventory.quickSlots = playerInventory.quickSlots.map(q => q === sel.item ? null : q);
    dropItemAt(player.x, player.y, sel.item, 1.5);
    playerInventory.selectedItem = null;
  }
  sfx('click');
  saveProgress();
}

/* ==================== INVENTORY INPUT ==================== */
function handleInventoryTap(x, y){
  const L = getInvLayout();
  const S = L.S;
  const inR = (r) => x >= r[0] && x <= r[0]+r[2] && y >= r[1] && y <= r[1]+r[3];
  if (inR(L.close)){ inventoryOpen = false; sfx('click'); return; }
  if (L.charRect && inR(L.charRect)){
    wardrobeOpen = true; wardrobeReturnState = 'lobby';
    sfx('click');
    return;
  }
  if (inR(L.sort)){ sfx('click'); sortInventory(); return; }
  for (const key of INV_EQ_ORDER){
    const e = L.eq[key];
    if (x >= e.x && x <= e.x+e.size && y >= e.y && y <= e.y+e.size){
      playerInventory.selectedSlot = key;
      playerInventory.selectedItem = null;
      sfx('click'); return;
    }
  }
  const items = playerInventory.items;
  for (let r = 0; r < L.rows; r++){
    for (let c = 0; c < L.cols; c++){
      const idx = r*L.cols + c;
      const xx = L.gridX + c*(L.cell + L.gap);
      const yy = L.gridY + r*(L.cell + L.gap);
      if (x >= xx && x <= xx+L.cell && y >= yy && y <= yy+L.cell){
        playerInventory.selectedItem = idx < items.length ? items[idx] : null;
        playerInventory.selectedSlot = null;
        sfx('click'); return;
      }
    }
  }
  for (let i = 0; i < 4; i++){
    const xx = L.qs.x0 + i*(L.qs.size + L.qs.gap);
    if (x >= xx && x <= xx+L.qs.size && y >= L.qs.y && y <= L.qs.y+L.qs.size){
      const sel = getSelectedItem();
      if (sel && sel.kind === 'item' && sel.item.type === 'consumable'){
        const prev = playerInventory.quickSlots[i];
        const ix = playerInventory.items.indexOf(sel.item);
        if (ix >= 0) playerInventory.items.splice(ix, 1);
        for (let k = 0; k < 4; k++) if (k !== i && playerInventory.quickSlots[k] === sel.item) playerInventory.quickSlots[k] = null;
        if (prev && prev !== sel.item && prev.templateKey === sel.item.templateKey && prev.quantity + sel.item.quantity <= 99){
          prev.quantity += sel.item.quantity;
        } else {
          playerInventory.quickSlots[i] = sel.item;
          if (prev && prev !== sel.item) playerInventory.items.push(prev);
        }
        playerInventory.selectedItem = null;
      } else if (playerInventory.quickSlots[i]){
        removeFromQuickSlot(i);
      }
      sfx('click'); saveProgress(); return;
    }
  }
  const sel = getSelectedItem();
  if (sel){
    for (const b of _invButtons){
      const rct = b.rect;
      if (rct && inR(rct)){
        doInvAction(b.act, sel, b);
        return;
      }
    }
  }
  // тап по панели описания не сбрасывает выбор
  if (inR([L.desc.x, L.desc.y, L.desc.w, L.desc.h])) return;
  playerInventory.selectedItem = null;
  playerInventory.selectedSlot = null;
}

function equipItemTo(item, hand){
  const idx = playerInventory.items.indexOf(item);
  if (idx < 0) return;
  sfx('equip');
  let slot;
  if (item.type === 'weapon') slot = hand === 'L' ? 'handL' : 'weapon';
  else slot = item.slot;
  if (!slot) return;
  if (item.type === 'weapon'){
    const wmType = item.weaponType || mapTemplateToWeaponType(item.templateKey);
    if (wmType && WEAPON_TYPES[wmType] && WEAPON_TYPES[wmType].hands === 2){
      if (playerInventory.equipment.weapon) playerInventory.items.push(playerInventory.equipment.weapon);
      if (playerInventory.equipment.handL) playerInventory.items.push(playerInventory.equipment.handL);
      playerInventory.equipment.weapon = item;
      playerInventory.equipment.handL = null;
      playerInventory.items.splice(idx, 1);
      showToast(item.name + ' (2Р, обе руки)');
      playerInventory.selectedSlot = null;
      saveProgress();
      return;
    }
  }
  if (item.type === 'weapon' && isTwoHandedWeapon('R')){
    playerInventory.items.push(playerInventory.equipment.weapon);
    playerInventory.equipment.weapon = null;
  }
  const old = playerInventory.equipment[slot];
  if (old) playerInventory.items.push(old);
  playerInventory.equipment[slot] = item;
  playerInventory.items.splice(idx, 1);
  showToast(item.name + ' → ' + (hand === 'L' ? 'левая' : 'правая'));
  playerInventory.selectedSlot = null;
  saveProgress();
}
function equipItem(item){ equipItemTo(item, 'R'); }
function removeFromQuickSlot(idx){
  const item = playerInventory.quickSlots[idx];
  if (!item) return;
  if (playerInventory.items.length >= INV_MAX){
    showToast('ИНВЕНТАРЬ ПОЛОН');
    return;
  }
  playerInventory.items.push(item);
  playerInventory.quickSlots[idx] = null;
  showToast('Убрано из слота');
  playerInventory.selectedSlot = null;
  saveProgress();
}
function useConsumable(item){
  if (!item || item.quantity <= 0) return;
  if (item.effect === 'heal'){
    player.hp = Math.min(player.maxHp, player.hp + item.value);
    showToast('+' + item.value + ' HP');
  } else if (item.effect === 'dmg'){
    player.dmgBuff = item.value;
    player.dmgBuffTimer = item.duration;
    showToast('+' + Math.round(item.value*100) + '% урона');
  } else if (item.effect === 'def'){
    player.defBuff = item.value;
    player.defBuffTimer = item.duration;
    showToast('+' + Math.round(item.value*100) + '% защиты');
  } else if (item.effect === 'throwKnife' || item.effect === 'throwAxe'){
    showToast('ПОЛОЖИ В БЫСТРЫЙ СЛОТ');
    return;
  }
  item.quantity--;
  if (item.quantity <= 0){
    const itemIdx = playerInventory.items.indexOf(item);
    if (itemIdx >= 0) playerInventory.items.splice(itemIdx, 1);
    for (let i = 0; i < 4; i++){
      if (playerInventory.quickSlots[i] === item){ playerInventory.quickSlots[i] = null; break; }
    }
    playerInventory.selectedSlot = null;
  }
  saveProgress();
}
function assignToQuickSlot(item){
  const emptyIdx = playerInventory.quickSlots.findIndex(s => s === null);
  if (emptyIdx >= 0){
    playerInventory.quickSlots[emptyIdx] = item;
    const idx = playerInventory.items.indexOf(item);
    if (idx >= 0) playerInventory.items.splice(idx, 1);
    showToast('В слот ' + (emptyIdx + 1));
    playerInventory.selectedSlot = null;
    saveProgress();
  } else {
    showToast('Все быстрые слоты заняты');
  }
}
function splitStack(item){
  if (!item || !item.stackable || item.quantity < 2) return;
  const half = Math.floor(item.quantity / 2);
  const other = item.quantity - half;
  const newItem = JSON.parse(JSON.stringify(item));
  newItem.id = item.id + '_split_' + Date.now();
  newItem.quantity = half;
  if (playerInventory.items.length >= INV_MAX){
    showToast('ИНВЕНТАРЬ ПОЛОН');
    return;
  }
  item.quantity = other;
  playerInventory.items.push(newItem);
  showToast('Разделено: ' + other + ' / ' + half);
  saveProgress();
}
function useQuickSlot(idx){
  const item = playerInventory.quickSlots[idx];
  if (!item || item.quantity <= 0) return;
  if (player.quickCd[idx] > 0) return;
  sfx('potion');
  if (item.effect === 'heal'){
    player.hp = Math.min(player.maxHp, player.hp + item.value);
    showToast('+' + item.value + ' HP');
    player.quickCd[idx] = 5;
  } else if (item.effect === 'dmg'){
    player.dmgBuff = item.value;
    player.dmgBuffTimer = item.duration;
    showToast('+' + Math.round(item.value*100) + '% урона');
    player.quickCd[idx] = 5;
  } else if (item.effect === 'def'){
    player.defBuff = item.value;
    player.defBuffTimer = item.duration;
    showToast('+' + Math.round(item.value*100) + '% защиты');
    player.quickCd[idx] = 5;
  } else if (item.effect === 'throwKnife'){
    projectiles.push({
      x: player.x + Math.cos(player.facing) * 20,
      y: player.y + Math.sin(player.facing) * 20,
      vx: Math.cos(player.facing) * 700,
      vy: Math.sin(player.facing) * 700,
      t: 0, life: 0.6, r: 6, dmg: item.value, color: '#dce5ee'
    });
    player.quickCd[idx] = 0.5;
  } else if (item.effect === 'throwAxe'){
    projectiles.push({
      x: player.x + Math.cos(player.facing) * 20,
      y: player.y + Math.sin(player.facing) * 20,
      vx: Math.cos(player.facing) * 500,
      vy: Math.sin(player.facing) * 500,
      t: 0, life: 0.8, r: 10, dmg: item.value, color: '#b88a4a'
    });
    player.quickCd[idx] = 1.0;
  }
  item.quantity--;
  if (item.quantity <= 0){
    playerInventory.quickSlots[idx] = null;
    const ii = playerInventory.items.indexOf(item);
    if (ii >= 0) playerInventory.items.splice(ii, 1);
  }
  saveProgress();
}

/* ==================== SHOP ==================== */
function getShopLayout(){
  const S = clamp(Math.min(W / 1100, H / 700), 0.55, 1.0);
  const padX = 20 * S;
  const headerH = 70 * S;
  const footerH = 60 * S;
  const viewportTop = headerH;
  const viewportH = H - headerH - footerH;
  const rowH = 68 * S;
  return { S, padX, headerH, footerH, viewportTop, viewportH, rowH };
}
function curStock(){ return shopStockOverride || SHOP_STOCK; }
function renderShop(){
  const L = getShopLayout();
  const S = L.S;
  ctx.fillStyle = 'rgba(6,3,12,0.97)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.font = `bold ${Math.round(22*S)}px Georgia, serif`;
  ctx.fillStyle = '#ffd166';
  ctx.fillText(shopTitle, W/2, 12*S);
  drawSpecialIcon('coin', W/2 - 50*S, 50*S, 20*S);
  ctx.textAlign = 'left';
  ctx.font = `bold ${Math.round(16*S)}px system-ui`;
  ctx.fillStyle = '#ffd166';
  ctx.fillText(String(playerGold), W/2 - 35*S, 50*S - 8*S);
  const totalContentH = curStock().length * L.rowH;
  shopMaxScroll = Math.max(0, totalContentH - L.viewportH);
  shopScrollY = clamp(shopScrollY, 0, shopMaxScroll);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, L.viewportTop, W, L.viewportH);
  ctx.clip();
  const _stk = curStock();
  for (let i = 0; i < _stk.length; i++){
    const stock = _stk[i];
    const ry = L.viewportTop + i * L.rowH - shopScrollY;
    const rowX = L.padX;
    const rowW = W - L.padX * 2;
    const rowH = L.rowH - 6 * S;
    const tpl = ITEM_TEMPLATES[stock.templateKey];
    const rar = RARITIES[stock.rarity];
    ctx.fillStyle = 'rgba(20,10,25,0.85)';
    rr(rowX, ry, rowW, rowH, 6*S); ctx.fill();
    ctx.strokeStyle = hexA(rar.color, 0.5);
    ctx.lineWidth = 1.5;
    rr(rowX, ry, rowW, rowH, 6*S); ctx.stroke();
    drawItemIcon({ templateKey: stock.templateKey }, rowX + 30*S, ry + rowH/2, 34*S);
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = `bold ${Math.round(13*S)}px Georgia, serif`;
    ctx.fillStyle = rar.color;
    ctx.fillText(tpl.name, rowX + 60*S, ry + rowH * 0.35);
    ctx.font = `bold ${Math.round(9*S)}px system-ui`;
    ctx.fillStyle = hexA(rar.color, 0.7);
    ctx.fillText((stock.left ? 'ОСТАЛОСЬ ' + stock.left + ' · ' : '') + (tpl.type === 'consumable' ? tpl.desc : rar.name), rowX + 60*S, ry + rowH * 0.62);
    ctx.textAlign = 'right';
    ctx.font = `bold ${Math.round(13*S)}px system-ui`;
    ctx.fillStyle = playerGold >= stock.price ? '#ffd166' : '#8a1515';
    ctx.fillText(stock.price + ' 🪙', rowX + rowW - 100*S, ry + rowH/2);
    const btnW = 70*S, btnH = 32*S;
    const btnX = rowX + rowW - btnW - 8*S;
    const btnY = ry + (rowH - btnH) / 2;
    const canAfford = playerGold >= stock.price;
    ctx.fillStyle = canAfford ? '#2a8a3a' : '#333344';
    rr(btnX, btnY, btnW, btnH, 5*S); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.5;
    rr(btnX, btnY, btnW, btnH, 5*S); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.round(11*S)}px system-ui`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('КУПИТЬ', btnX + btnW/2, btnY + btnH/2);
  }
  ctx.restore();
  if (shopMaxScroll > 0){
    const trackX = W - 8;
    const trackY = L.viewportTop + 8;
    const trackH = L.viewportH - 16;
    const thumbH = Math.max(30, trackH * (L.viewportH / (L.viewportH + shopMaxScroll)));
    const thumbY = trackY + (trackH - thumbH) * (shopScrollY / shopMaxScroll);
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    rr(trackX, trackY, 4, trackH, 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,80,110,0.85)';
    rr(trackX, thumbY, 4, thumbH, 2); ctx.fill();
  }
  const cb = { x: W/2 - 60*S, y: H - 50*S, w: 120*S, h: 36*S };
  ctx.fillStyle = '#c9302c';
  rr(cb.x, cb.y, cb.w, cb.h, 8*S); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 2;
  rr(cb.x, cb.y, cb.w, cb.h, 8*S); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.round(14*S)}px system-ui`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('ЗАКРЫТЬ', cb.x + cb.w/2, cb.y + cb.h/2);
}
function handleShopTap(x, y){
  const L = getShopLayout();
  const cb = { x: W/2 - 60*L.S, y: H - 50*L.S, w: 120*L.S, h: 36*L.S };
  if (x >= cb.x && x <= cb.x + cb.w && y >= cb.y && y <= cb.y + cb.h){
    shopOpen = false;
    shopDrag = null;
    resetInput();
    return;
  }
  if (y < L.viewportTop || y > L.viewportTop + L.viewportH) return;
  const _stk = curStock();
  for (let i = 0; i < _stk.length; i++){
    const stock = _stk[i];
    const ry = L.viewportTop + i * L.rowH - shopScrollY;
    const rowX = L.padX;
    const rowW = W - L.padX * 2;
    const rowH = L.rowH - 6 * L.S;
    const btnW = 70*L.S, btnH = 32*L.S;
    const btnX = rowX + rowW - btnW - 8*L.S;
    const btnY = ry + (rowH - btnH) / 2;
    if (x >= btnX && x <= btnX + btnW && y >= btnY && y <= btnY + btnH){
      if (playerGold >= stock.price){
        const item = makeItem(stock.templateKey, stock.rarity);
        if (!addToInventory(item)){ showToast('ИНВЕНТАРЬ ПОЛОН'); return; }
        playerGold -= stock.price;
        showToast('Куплено: ' + item.name);
        sfx('buy');
        if (stock.left !== undefined){ stock.left--; if (stock.left <= 0) _stk.splice(i, 1); }
        saveProgress();
      } else {
        showToast('НЕДОСТАТОЧНО ЗОЛОТА');
      }
      return;
    }
  }
}

/* ==================== WARDROBE ==================== */
function drawCharCore(u, opt){
  /* Вид сверху. Локальная система: +x — «вперёд» (направление взгляда), +y — правая сторона персонажа.
     Вызывающий поворачивает контекст на нужный угол. */
  const ch = getChar();
  const eq = playerInventory.equipment;
  opt = opt || {};
  const hurt = !!opt.hurt;
  const I = opt.inv ? invHex : (c => c);
  const armorCol = I(eq.chest ? (eq.chest.templateKey.indexOf('demon')>=0 ? '#6a1a1a' : (eq.chest.templateKey.indexOf('iron')>=0 ? '#8a8a95' : '#6a4a2a')) : null);
  const bootCol = I(eq.boots ? (eq.boots.templateKey.indexOf('iron')>=0 ? '#7a7a85' : (eq.boots.templateKey.indexOf('swift')>=0 ? '#3a6a8a' : '#5a3820')) : '#3a2010');
  const helmCol = I(eq.head ? (eq.head.templateKey.indexOf('demon')>=0 ? '#6a1a1a' : (eq.head.templateKey.indexOf('iron')>=0 ? '#8a8a95' : '#6a4a2a')) : null);
  const cloakC = hurt ? '#ffffff' : I(ch.cloak);
  const torsoCol = hurt ? '#ffffff' : (armorCol || I(ch.color));
  const skin = hurt ? '#ffffff' : I('#e8d0b8');
  const hairC = hurt ? '#ffdddd' : I('#3a2a18');
  const line = hurt ? '#ffdddd' : (opt.inv ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,0,0.6)');
  const lw = Math.max(1, 0.11*u);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const doBody = opt.part !== 'head', doHead = opt.part !== 'body';
  if (doBody){
  // --- плащ / роба позади ---
  let tl = 0, tw = 0;
  if (ch.bodyStyle === 'cloak'){ tl = 3.3; tw = 1.9; }
  else if (ch.bodyStyle === 'robes'){ tl = 3.7; tw = 2.7; }
  else if (ch.bodyStyle === 'light'){ tl = 2.3; tw = 1.5; }
  if (tl){
    ctx.fillStyle = cloakC;
    ctx.beginPath();
    ctx.moveTo(-0.2*u,-2.0*u);
    ctx.quadraticCurveTo(-tl*0.65*u,-tw*1.35*u,-tl*u,-tw*0.65*u);
    ctx.quadraticCurveTo(-tl*1.1*u,0,-tl*u,tw*0.65*u);
    ctx.quadraticCurveTo(-tl*0.65*u,tw*1.35*u,-0.2*u,2.0*u);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = line; ctx.lineWidth = lw; ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.moveTo(-0.6*u,0); ctx.lineTo(-(tl-0.3)*u,0); ctx.stroke();
  }
  // --- ступни (выглядывают из-под тела) ---
  const sw = opt.legs ? clamp(opt.legPhase || 0, -1, 1) : 0;
  ctx.fillStyle = hurt ? '#ffdddd' : bootCol;
  ctx.strokeStyle = line; ctx.lineWidth = lw;
  for (const sd of [-1, 1]){
    ctx.beginPath(); ctx.ellipse(0.55*u + sd*sw*1.3*u, sd*0.85*u, 1.0*u, 0.55*u, 0, 0, TAU); ctx.fill(); ctx.stroke();
  }
  // --- руки в стойке (для превью; в игре руки рисуются отдельно) ---
  const sleeve = armorCol ? torsoCol : cloakC;
  if (opt.arms){
    for (const sd of [-1, 1]){
      ctx.strokeStyle = line; ctx.lineWidth = 0.95*u;
      ctx.beginPath(); ctx.moveTo(0, sd*2.0*u); ctx.lineTo(0.4*u, sd*2.95*u); ctx.stroke();
      ctx.strokeStyle = sleeve; ctx.lineWidth = 0.78*u;
      ctx.beginPath(); ctx.moveTo(0, sd*2.0*u); ctx.lineTo(0.4*u, sd*2.95*u); ctx.stroke();
      ctx.fillStyle = skin; ctx.strokeStyle = line; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.arc(0.55*u, sd*3.15*u, 0.46*u, 0, TAU); ctx.fill(); ctx.stroke();
    }
  }
  // --- торс ---
  ctx.fillStyle = torsoCol;
  ctx.beginPath(); ctx.ellipse(0, 0, 1.25*u, 2.25*u, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = line; ctx.lineWidth = lw; ctx.stroke();
  if (armorCol){
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.beginPath(); ctx.ellipse(0.1*u, 0, 0.75*u, 1.5*u, 0, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(-1.05*u,0); ctx.lineTo(0.2*u,0); ctx.stroke();
  // --- плечи ---
  for (const sd of [-1, 1]){
    ctx.fillStyle = hurt ? '#ffffff' : (armorCol || cloakC);
    ctx.beginPath(); ctx.arc(0, sd*2.05*u, 0.85*u, 0, TAU); ctx.fill();
    ctx.strokeStyle = line; ctx.lineWidth = lw; ctx.stroke();
    if (armorCol){ ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.beginPath(); ctx.arc(0.1*u, sd*2.0*u, 0.4*u, 0, TAU); ctx.fill(); }
  }
  }
  if (doHead){
  // --- голова ---
  const hr = 1.25*u;
  ctx.save();
  ctx.translate(0.2*u, 0);
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0.0, -hr, 0.3*u, 0, TAU); ctx.arc(0.0, hr, 0.3*u, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, hr, 0, TAU); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, hr, 0, TAU); ctx.clip();
  ctx.fillStyle = hairC;
  ctx.beginPath(); ctx.arc(-0.4*hr, 0, hr, 0, TAU); ctx.fill();
  if (!helmCol && ch.headStyle === 'mask'){
    ctx.fillStyle = I('#2a1530'); ctx.fillRect(0.3*hr, -hr, hr, 2*hr);
  }
  ctx.restore();
  ctx.strokeStyle = line; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.arc(0, 0, hr, 0, TAU); ctx.stroke();
  if (helmCol){
    ctx.fillStyle = helmCol;
    ctx.beginPath(); ctx.arc(0, 0, hr*1.12, 0, TAU); ctx.fill();
    ctx.strokeStyle = line; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 0.3*u;
    ctx.beginPath(); ctx.moveTo(-hr*0.95,0); ctx.lineTo(hr*0.7,0); ctx.stroke();
    ctx.strokeStyle = I('#1a1a1a'); ctx.lineWidth = 0.24*u;
    ctx.beginPath(); ctx.arc(0, 0, hr*0.92, -0.5, 0.5); ctx.stroke();
  } else if (ch.headStyle === 'horns'){
    ctx.strokeStyle = I('#d4c8a8'); ctx.lineWidth = 0.36*u;
    for (const sd of [-1, 1]){
      ctx.beginPath(); ctx.moveTo(-0.1*hr, sd*hr*0.8); ctx.quadraticCurveTo(0.1*hr, sd*hr*1.9, hr*1.0, sd*hr*1.95); ctx.stroke();
    }
  } else if (ch.headStyle === 'mask'){
    ctx.fillStyle = '#ff2b45';
    ctx.beginPath(); ctx.arc(hr*0.62, -0.4*hr, 0.13*u, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(hr*0.62, 0.4*hr, 0.13*u, 0, TAU); ctx.fill();
  } else if (ch.headStyle === 'crown'){
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 0.3*u;
    ctx.beginPath(); ctx.arc(0, 0, hr*0.95, 0, TAU); ctx.stroke();
    ctx.fillStyle = '#ffd166';
    for (let k = 0; k < 6; k++){
      const a = k*TAU/6;
      ctx.beginPath(); ctx.arc(Math.cos(a)*hr*0.95, Math.sin(a)*hr*0.95, 0.27*u, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
  }
}
function drawCharFigure(cx, cy, h, noItems){
  /* cy — «нижняя» точка (как раньше), фигура центрируется по вертикали в [cy-h, cy] */
  const eq = playerInventory.equipment;
  const u = h/7.6;
  ctx.save();
  ctx.translate(cx, cy - h/2);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(0.3*u, 0.5*u, 3.5*u, 3.1*u, 0, 0, TAU); ctx.fill();
  ctx.save();
  ctx.rotate(-Math.PI/2);
  drawCharCore(u, { arms: true });
  ctx.restore();
  if (!noItems){
    if (eq.weapon){
      if (anyTwoHandedEquipped()) drawItemIcon(eq.weapon, 4.0*u, -0.9*u, 3.2*u);
      else drawItemIcon(eq.weapon, 3.9*u, -0.6*u, 2.6*u);
    }
    if (eq.handL) drawItemIcon(eq.handL, -3.9*u, -0.6*u, 2.6*u);
  }
  ctx.restore();
}

function renderWardrobe(){

  const tabs = [['head','ГОЛОВА'],['body','ТЕЛО'],['palette','ЦВЕТ'],['weapon','ОРУЖИЕ']];
  const tabW = Math.min(150*S, (W - L.pad*2)/4 - 6*S);
  const totalW = tabW*4 + 18*S;
  const startX = (W - totalW)/2;
  for (let i = 0; i < 4; i++){
    const tx = startX + i*(tabW + 6*S);
    const sel = wardrobeTab === tabs[i][0];
    ctx.fillStyle = sel ? '#5a3a8a' : '#1a1a2a';

const HUD_NAMES = { attack:'КНОПКА УДАРА', alt:'ЛЕВАЯ РУКА', ability:'УМЕНИЕ', joy:'ДЖОЙСТИК', quick:'БЫСТРЫЕ СЛОТЫ', pause:'ПАУЗА', inv:'ИНВЕНТАРЬ' };
const hudCfg = { opacity: 1, joyMode: 'float', items: {} };
function HUDOP(){ return hudCfg.opacity; }
function hudItemCfg(id){ return hudCfg.items[id] || (hudCfg.items[id] = { fx: null, fy: null, s: 1 }); }
function hudDefaults(){
  const ar = clamp(H * 0.14, 46, 62), mr = ar * 0.72;
  const attackX = W - ar - 20, attackY = H - ar - 48;
  return {
    attack: { x: attackX, y: attackY, r: ar },
    alt: { x: attackX, y: Math.max(mr + 20, attackY - ar - mr - 12), r: mr },
    ability: { x: Math.max(mr + 20, attackX - ar - mr - 12), y: attackY, r: mr },
    joy: { x: 100, y: H - 100, r: 60 },
    pause: { x: W - 30, y: 26, r: 14 },
    inv: { x: W - 62, y: 26, r: 14 },
    quick: { x: 16, y: 106, size: 38, gap: 6 }
  };
}
function hudGeo(id){
  const d = hudDefaults()[id], c = hudItemCfg(id);
  if (id === 'quick'){
    const size = d.size * c.s, gap = d.gap * c.s, w = 4 * size + 3 * gap;
    let x = c.fx == null ? d.x : c.fx * W, y = c.fy == null ? d.y : c.fy * H;
    x = clamp(x, 0, Math.max(0, W - w)); y = clamp(y, 0, Math.max(0, H - size));
    return { x, y, size, gap, w, h: size, s: c.s };
  }
  const r = d.r * c.s;
  let x = c.fx == null ? d.x : c.fx * W, y = c.fy == null ? d.y : c.fy * H;
  x = clamp(x, r, Math.max(r, W - r)); y = clamp(y, r, Math.max(r, H - r));
  return { x, y, r, s: c.s };
}
function startJoy(x, y, e){
  const g = hudGeo('joy'), j = input.joy;
  if (hudCfg.joyMode === 'fixed'){
    if (Math.hypot(x - g.x, y - g.y) > g.r * 2.1) return;
    j.ox = g.x; j.oy = g.y;
  } else { j.ox = x; j.oy = y; }
  j.active = true; j.id = e.pointerId; j.dx = 0; j.dy = 0; j.k = g.s;
  if (hudCfg.joyMode === 'fixed'){
    const dx = x - j.ox, dy = y - j.oy, d = Math.hypot(dx, dy) || 1, R = 64 * j.k, k = Math.min(d, R) / R;
    j.dx = dx / d * k; j.dy = dy / d * k;
  }
}

function hudHit(x, y){
  for (const id of ['pause', 'inv', 'ability', 'alt', 'attack', 'quick', 'joy']){
    const g = hudGeo(id);
    if (id === 'quick'){ if (x >= g.x - 4 && x <= g.x + g.w + 4 && y >= g.y - 4 && y <= g.y + g.h + 4) return id; }
    else if (Math.hypot(x - g.x, y - g.y) <= Math.max(g.r * 1.1, 18)) return id;
  }

}
function hudSliderSet(which, x){
  const L = hudPanelLayout();
  if (which === 'size' && hudSel){ const r = L.size; hudItemCfg(hudSel).s = clamp(0.6 + clamp((x - r.x) / r.w, 0, 1) * 1.2, 0.6, 1.8); }
  if (which === 'op'){ const r = L.op; hudCfg.opacity = clamp(0.3 + clamp((x - r.x) / r.w, 0, 1) * 0.7, 0.3, 1); }
}
function handleHudEditDown(e){
  const x = e.clientX, y = e.clientY, L = hudPanelLayout();
  for (const b of L.btns){
    if (inRect(x, y, b)){
      if (b.id === 'done') exitHudEdit();
      else if (b.id === 'reset' && hudSel){ hudCfg.items[hudSel] = { fx: null, fy: null, s: 1 }; }
      else if (b.id === 'resetAll'){ hudCfg.items = {}; hudCfg.opacity = 1; hudCfg.joyMode = 'float'; hudSel = null; }
      else if (b.id === 'joy'){ hudCfg.joyMode = hudCfg.joyMode === 'fixed' ? 'float' : 'fixed'; }
      sfx('click'); return;
    }
  }
  const pad = 12;
  for (const [which, r] of [['size', L.size], ['op', L.op]]){
    if (x >= r.x - pad && x <= r.x + r.w + pad && y >= r.y - 4 && y <= r.y + r.h + 4){
      if (which === 'size' && !hudSel) return;
      hudSliderDrag = { which, id: e.pointerId }; hudSliderSet(which, x);
      try { canvas.setPointerCapture(e.pointerId); } catch(_){}
      return;
    }
  }
  if (inRect(x, y, L.panel)) return;
  const id = hudHit(x, y);
  if (id){
    hudSel = id; const g = hudGeo(id);
    hudDrag = { id, pid: e.pointerId, ox: x - g.x, oy: y - g.y };
    try { canvas.setPointerCapture(e.pointerId); } catch(_){}
  } else hudSel = null;
}
function handleHudEditMove(e){
  if (hudSliderDrag && hudSliderDrag.id === e.pointerId){ hudSliderSet(hudSliderDrag.which, e.clientX); return true; }
  if (hudDrag && hudDrag.pid === e.pointerId){
    const c = hudItemCfg(hudDrag.id);
    c.fx = (e.clientX - hudDrag.ox) / W; c.fy = (e.clientY - hudDrag.oy) / H;
    return true;
  }
  return false;
}
function handleHudEditUp(e){
  let changed = false;
  if (hudSliderDrag && hudSliderDrag.id === e.pointerId){ hudSliderDrag = null; changed = true; }
  if (hudDrag && hudDrag.pid === e.pointerId){ hudDrag = null; changed = true; }
  if (changed) saveProgress();
}

/* ==================== ABILITY SELECT ==================== */
function getAbilitySelectLayout(){
  const cols = 4;
  const keys = Object.keys(ABILITY_TYPES);
  const rows = Math.ceil(keys.length / cols);
  const cardW = Math.min(180, (W - 80) / cols);
  const cardH = Math.min(150, (H - 200) / rows);
  const gap = 12;
  const totalW = cols * cardW + (cols - 1) * gap;
  const startX = (W - totalW) / 2;
  const startY = 100;
  return { cols, rows, keys, cardW, cardH, gap, startX, startY };
}
function abilityUpgradeBtn(cx, cy, cardW, cardH){
  return { x: cx + cardW - 64, y: cy + cardH - 26, w: 54, h: 20 };
}
function renderAbilitySelect(){
  ctx.fillStyle = 'rgba(6,3,12,0.97)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.font = 'bold 24px Georgia, serif';
  ctx.fillStyle = '#ffd166';

  for (let i = 0; i < L.keys.length; i++){
    const key = L.keys[i];
    const def = ABILITY_TYPES[key];
