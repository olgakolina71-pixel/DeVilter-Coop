<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07050b">
<title>DeVilter</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#07050b;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    touch-action:none;overscroll-behavior:none;
  }
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  #coopTrade{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(2,1,7,.78);backdrop-filter:blur(9px);font-family:system-ui,sans-serif;color:#f5f1ff;}
  #coopTrade.open{display:flex;}#coopTrade .panel{width:min(440px,100%);max-height:88vh;overflow:auto;border:1px solid rgba(255,209,102,.55);border-radius:20px;background:linear-gradient(160deg,#24182d,#0d0a15 72%);box-shadow:0 18px 70px #000a;padding:18px;}
  #coopTrade h2{font-size:19px;letter-spacing:.04em;color:#ffd166;margin:0 0 5px;}#coopTrade .sub{font-size:12px;color:#bcb2ce;margin-bottom:14px;}
  #coopTrade label{display:block;font-size:11px;color:#cfc5dc;margin:10px 0 5px;}#coopTrade select,#coopTrade input{width:100%;padding:11px;border-radius:11px;border:1px solid #51405e;background:#100b1a;color:white;font-size:14px;outline:none;touch-action:auto;}
  #coopTrade .offerCard{border:1px solid #493951;background:#170f22;border-radius:13px;padding:12px;margin:10px 0;display:flex;gap:10px;align-items:center;}#coopTrade .icon{font-size:26px;width:40px;height:40px;border-radius:10px;background:#2c1e35;display:grid;place-items:center;}#coopTrade .buttons{display:flex;gap:9px;margin-top:15px;}#coopTrade button{flex:1;border:0;border-radius:12px;padding:12px 8px;font-weight:800;color:#130c18;background:#ffd166;touch-action:manipulation;}#coopTrade button.cancel{background:#42344e;color:#eee;}#coopTrade button.danger{background:#d85c71;color:#fff;}

</style>

<body>
<canvas id="game"></canvas>
<div id="coopTrade" aria-modal="true" role="dialog"><div class="panel" id="coopTradePanel"></div></div>
<script>
(() => {
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const IS_ANDROID = /Android/i.test(navigator.userAgent);
const MAX_DPR = Math.min(window.devicePixelRatio || 1, 2);
let currentDPR = IS_ANDROID ? Math.min(MAX_DPR, 1.25) : MAX_DPR;
let W = 1, H = 1, vignette = null;
let frameEMA = 16, lastDprChange = 0;

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = Math.floor(W * currentDPR);
  canvas.height = Math.floor(H * currentDPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(currentDPR, 0, 0, currentDPR, 0, 0);
  const g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.28, W/2, H/2, Math.max(W,H)*0.85);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.55, 'rgba(8,0,14,0.30)');
  g.addColorStop(1, 'rgba(0,0,0,0.94)');
  vignette = g;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

const TAU = Math.PI * 2;
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
const lerp  = (a,b,t) => a + (b-a) * t;
const rand  = (a,b) => a + Math.random() * (b-a);
function angleDiff(a,b){
  let d = (a - b) % TAU;
  if (d >  Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}
function rr(x,y,w,h,r){
  if (w <= 0.5 || h <= 0.5) return;
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}
function hash2(x, y){
  let h = (x * 73856093) ^ (y * 19349663);
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) & 0x7fffffff) / 0x7fffffff;
}
function isLandscape(){ return W >= H; }
function hexA(hex, a){
  if (typeof hex !== 'string' || hex[0] !== '#' || hex.length < 7) return `rgba(255,60,80,${a})`;
  const h = hex.slice(1, 7);
  const r = parseInt(h.substr(0,2), 16);
  const g = parseInt(h.substr(2,2), 16);
  const b = parseInt(h.substr(4,2), 16);
  if (isNaN(r) || isNaN(g) || isNaN(b)) return `rgba(255,60,80,${a})`;
  return `rgba(${r},${g},${b},${a})`;
}
function makeSeededRandom(seed){
  let s = seed | 0;
  if (s === 0) s = 1;
  return function(){
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    return s / 0x7fffffff;
  };
}

/* ==================== АУДИО: ДВИЖОК, ЗВУКИ, МУЗЫКА ==================== */
let soundOn = true, musicVol = 0.7, sfxVol = 0.9;
let audioCtx = null, masterG = null, musicBus = null, sfxBus = null, revIn = null;
let _noiseBuf = null, _activeVoices = 0;
function makeImpulse(sec, decay){
  const sr = audioCtx.sampleRate, n = Math.floor(sr * sec), b = audioCtx.createBuffer(2, n, sr);
  for (let c = 0; c < 2; c++){ const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, decay); }
  return b;
}
function ensureAudio(){
  if (audioCtx) return true;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    audioCtx = new AC();
    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
    masterG = audioCtx.createGain(); masterG.gain.value = 0.85;
    masterG.connect(comp); comp.connect(audioCtx.destination);
    musicBus = audioCtx.createGain(); sfxBus = audioCtx.createGain();
    musicBus.connect(masterG); sfxBus.connect(masterG);
    const conv = audioCtx.createConvolver(); conv.buffer = makeImpulse(2.4, 2.8);
    revIn = audioCtx.createGain(); const revOut = audioCtx.createGain(); revOut.gain.value = 0.55;
    revIn.connect(conv); conv.connect(revOut); revOut.connect(masterG);
    _noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
    const nd = _noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random()*2-1;
    applyVolumes();
    return true;
  } catch(e){ audioCtx = null; return false; }
}
function applyVolumes(){
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  musicBus.gain.setTargetAtTime(soundOn ? musicVol * 0.6 : 0, t, 0.05);
  sfxBus.gain.setTargetAtTime(soundOn ? sfxVol : 0, t, 0.05);
}
/* один голос: осциллятор(ы) → фильтр → огибающая → шина (+ реверберация) */
function voice(o){
  const ac = audioCtx, t = ac.currentTime + 0.004 + (o.t || 0);
  const dur = o.dur || 0.2, a = o.a || 0.004, vol = o.vol || 0.08;
  const bus = o.bus || sfxBus;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + a);
  if (o.hold) g.gain.setValueAtTime(vol, t + Math.min(o.hold, dur * 0.9));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let head = g;
  if (o.pan && ac.createStereoPanner){ const p = ac.createStereoPanner(); p.pan.value = o.pan; g.connect(p); head = p; }
  head.connect(bus);
  if (o.rev && revIn){ const rg = ac.createGain(); rg.gain.value = o.rev; head.connect(rg); rg.connect(revIn); }
  let into = g;
  if (o.lp || o.hp || o.bp){
    const f = ac.createBiquadFilter();
    f.type = o.bp ? 'bandpass' : (o.hp ? 'highpass' : 'lowpass');
    const f0 = o.bp || o.hp || o.lp, f1 = o.lp2 || o.hp2 || o.bp2 || f0;
    f.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    f.Q.value = o.q || 0.8;
    f.connect(g); into = f;
  }
  const n = o.voices || 1;
  let first = null;
  for (let i = 0; i < n; i++){
    const os = ac.createOscillator();
    os.type = o.type || 'sine';
    const f0 = Math.max(20, o.f || 440);
    os.frequency.setValueAtTime(f0, t);
    if (o.f2) os.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t + (o.slide || dur));
    if (n > 1) os.detune.value = (i - (n-1)/2) * (o.det || 12);
    if (o.vibD){
      const lf = ac.createOscillator(), lg = ac.createGain();
      lf.frequency.value = o.vibR || 6; lg.gain.value = o.vibD;
      lf.connect(lg); lg.connect(os.frequency); lf.start(t); lf.stop(t + dur + 0.05);
    }
    os.connect(into);
    os.start(t); os.stop(t + dur + 0.05);
    if (!first) first = os;
  }
  _activeVoices++;
  first.onended = () => { _activeVoices--; };
}
function noiz(o){
  const ac = audioCtx, t = ac.currentTime + 0.004 + (o.t || 0);
  const dur = o.dur || 0.15, a = o.a || 0.003, vol = o.vol || 0.06;
  const s = ac.createBufferSource(); s.buffer = _noiseBuf; s.loop = true;
  const f = ac.createBiquadFilter(); f.type = o.type || 'bandpass';
  const f0 = o.f || 1000, f1 = o.f2 || f0;
  f.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  f.Q.value = o.q || 1;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g);
  const bus = o.bus || sfxBus;
  g.connect(bus);
  if (o.rev && revIn){ const rg = ac.createGain(); rg.gain.value = o.rev; g.connect(rg); rg.connect(revIn); }
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  _activeVoices++;
  s.onended = () => { _activeVoices--; };
}
const rv = (x, k) => x * (1 + (Math.random() - 0.5) * (k || 0.08));
const SFX = {
  /* ---- интерфейс ---- */
  click(){ voice({type:'square', f:rv(1300), f2:900, dur:0.04, vol:0.03}); },
  tab(){ voice({type:'triangle', f:rv(700), f2:1000, dur:0.06, vol:0.05}); },
  open(){ voice({type:'sine', f:300, f2:620, dur:0.2, vol:0.06, rev:0.3}); noiz({f:1200, f2:3200, dur:0.2, vol:0.03}); },
  close(){ voice({type:'sine', f:620, f2:280, dur:0.15, vol:0.05}); },
  equip(){ noiz({f:2600, dur:0.06, vol:0.06, q:3}); voice({type:'triangle', f:rv(520), f2:260, dur:0.1, vol:0.07}); voice({type:'square', t:0.05, f:1200, f2:900, dur:0.05, vol:0.025}); },
  unequip(){ noiz({f:1800, dur:0.07, vol:0.05, q:2}); voice({type:'triangle', f:rv(380), f2:520, dur:0.1, vol:0.05}); },
  deny(){ voice({type:'sawtooth', f:200, f2:130, dur:0.16, vol:0.05, lp:900}); voice({type:'sawtooth', t:0.09, f:170, f2:100, dur:0.18, vol:0.05, lp:800}); },
  buy(){ SFX.coin(); voice({type:'triangle', t:0.12, f:1200, f2:1800, dur:0.12, vol:0.04}); },
  coin(){ voice({type:'square', f:rv(1568), dur:0.05, vol:0.035}); voice({type:'square', t:0.05, f:rv(2093), dur:0.22, vol:0.035, rev:0.25}); },
  soul(){ voice({type:'sine', f:rv(740), f2:1480, dur:0.4, vol:0.05, rev:0.7, vibD:8, vibR:7}); voice({type:'sine', t:0.05, f:1110, f2:2220, dur:0.35, vol:0.025, rev:0.7}); },
  pickup(){ voice({type:'triangle', f:660, f2:990, dur:0.1, vol:0.06}); voice({type:'triangle', t:0.07, f:990, f2:1320, dur:0.14, vol:0.05, rev:0.2}); },
  potion(){ for (let i = 0; i < 3; i++) voice({type:'sine', t:i*0.1, f:rv(320 + i*60), f2:520 + i*80, dur:0.09, vol:0.07}); noiz({type:'lowpass', f:900, dur:0.35, vol:0.03}); },
  levelup(){ [523, 659, 784, 1047].forEach((f, i) => voice({type:'triangle', t:i*0.075, f, dur:0.3, vol:0.06, rev:0.4})); },
  toast(){ voice({type:'sine', f:880, dur:0.1, vol:0.03}); },
  /* ---- оружие игрока ---- */
  swing(){ SFX.swing_sword(); },
  swing_sword(){ noiz({f:1500, f2:4500, dur:0.14, vol:0.05, q:1.5}); voice({type:'sine', f:rv(300), f2:180, dur:0.1, vol:0.02}); },
  swing_axe(){ noiz({f:700, f2:2600, dur:0.2, vol:0.07, q:1.2}); voice({type:'sine', f:140, f2:70, dur:0.18, vol:0.05}); },
  swing_knife(){ noiz({type:'highpass', f:3000, f2:7500, dur:0.08, vol:0.05, q:0.8}); },
  swing_hammer(){ noiz({f:300, f2:1300, dur:0.28, vol:0.08, q:0.8}); voice({type:'sine', t:0.12, f:90, f2:45, dur:0.2, vol:0.07}); },
  swing_whip(){ noiz({f:1500, f2:5200, dur:0.1, vol:0.05, q:2}); noiz({t:0.09, type:'highpass', f:4200, dur:0.05, vol:0.11}); },
  swing_claws(){ noiz({f:2600, f2:3800, dur:0.07, vol:0.05, q:3}); noiz({t:0.06, f:2400, f2:3600, dur:0.07, vol:0.05, q:3}); },
  /* ---- попадания и смерти ---- */
  hit(){ voice({type:'sine', f:rv(170), f2:60, dur:0.1, vol:0.1}); noiz({type:'lowpass', f:1100, dur:0.07, vol:0.07}); },
  hitBone(){ for (let i = 0; i < 2; i++) voice({type:'triangle', t:i*0.035, f:rv(900 - i*250), f2:500, dur:0.05, vol:0.06}); noiz({type:'highpass', f:2400, dur:0.05, vol:0.05}); },
  hitArmor(){ voice({type:'square', f:rv(420), f2:300, dur:0.12, vol:0.045, voices:2, det:35, bp:900, q:3}); noiz({f:3200, dur:0.06, vol:0.05, q:3}); voice({type:'sine', f:110, f2:55, dur:0.12, vol:0.08}); },
  heavyHit(){ voice({type:'sine', f:130, f2:38, dur:0.22, vol:0.14}); noiz({type:'lowpass', f:500, dur:0.14, vol:0.08}); },
  kill(){ voice({type:'sawtooth', f:rv(300), f2:50, dur:0.2, vol:0.06, lp:1200}); noiz({type:'lowpass', f:900, dur:0.16, vol:0.07}); },
  killBone(){ for (let i = 0; i < 6; i++) voice({type:'triangle', t:i*0.03 + Math.random()*0.02, f:rv(500 + Math.random()*700), f2:300, dur:0.05, vol:0.045}); noiz({type:'highpass', f:2500, dur:0.18, vol:0.035}); },
  killOgre(){ voice({type:'sawtooth', f:100, f2:48, dur:0.7, vol:0.09, lp:420, vibD:6, vibR:9}); voice({type:'sine', t:0.1, f:70, f2:30, dur:0.35, vol:0.12}); noiz({type:'lowpass', f:300, dur:0.3, vol:0.08}); },
  killNecro(){ voice({type:'sine', f:700, f2:180, dur:0.7, vol:0.07, rev:0.8, vibD:20, vibR:11}); voice({type:'sawtooth', f:260, f2:90, dur:0.5, vol:0.03, lp:900, rev:0.5}); },
  killBoss(){ SFX.boom(); voice({type:'sawtooth', t:0.1, f:70, f2:30, dur:1.1, vol:0.1, lp:500, rev:0.6}); [392, 494, 587].forEach((f, i) => voice({type:'triangle', t:0.45 + i*0.1, f, dur:1.0, vol:0.05, rev:0.8})); },
  hurt(){ voice({type:'sawtooth', f:rv(230), f2:110, dur:0.2, vol:0.07, lp:1400}); noiz({type:'lowpass', f:700, dur:0.12, vol:0.06}); },
  death(){ voice({type:'sawtooth', f:260, f2:30, dur:1.2, vol:0.09, lp:900, rev:0.5}); [330, 262, 196, 147].forEach((f, i) => voice({type:'sine', t:0.2 + i*0.22, f, dur:0.9, vol:0.05, rev:0.9})); },
  /* ---- защита и умения ---- */
  block(){ voice({type:'square', f:rv(380), f2:260, dur:0.1, vol:0.05, bp:1200, q:2}); noiz({f:2000, dur:0.07, vol:0.06, q:2}); voice({type:'sine', f:100, f2:60, dur:0.1, vol:0.07}); },
  parry(){ voice({type:'triangle', f:1500, f2:2200, dur:0.18, vol:0.07, rev:0.4}); voice({type:'sine', t:0.02, f:2400, dur:0.3, vol:0.04, rev:0.6}); noiz({type:'highpass', f:4000, dur:0.1, vol:0.06}); },
  dash(){ noiz({f:600, f2:2800, dur:0.2, vol:0.06, q:1}); voice({type:'triangle', f:420, f2:140, dur:0.16, vol:0.03}); },
  stomp(){ voice({type:'sine', f:120, f2:35, dur:0.3, vol:0.13}); noiz({type:'lowpass', f:260, dur:0.25, vol:0.09}); },
  hook(){ for (let i = 0; i < 4; i++) voice({type:'square', t:i*0.04, f:rv(1800), f2:1200, dur:0.03, vol:0.025}); noiz({f:900, f2:3500, dur:0.22, vol:0.05, q:1.2}); },
  heal(){ [392, 494, 587, 784].forEach((f, i) => voice({type:'sine', t:i*0.09, f, dur:0.6, vol:0.055, rev:0.7})); },
  rage(){ voice({type:'sawtooth', f:70, f2:150, dur:0.5, vol:0.09, lp:600, vibD:8, vibR:14}); voice({type:'sawtooth', f:140, f2:300, dur:0.45, vol:0.04, lp:1500}); },
  ghost(){ noiz({f:1200, f2:400, dur:0.5, vol:0.05, q:3, rev:0.6}); voice({type:'sine', f:300, f2:900, dur:0.5, vol:0.04, rev:0.8, vibD:15, vibR:8}); },
  ability(){ voice({type:'triangle', f:300, f2:700, dur:0.14, vol:0.06}); },
  combo(){ voice({type:'sawtooth', f:200, f2:600, dur:0.2, vol:0.05, lp:2000}); noiz({f:1800, f2:5000, dur:0.2, vol:0.05, q:1.5}); },
  /* ---- враги ---- */
  telegraph(){ voice({type:'sine', f:170, f2:260, dur:0.22, vol:0.04}); },
  charge(){ voice({type:'sawtooth', f:85, f2:230, dur:0.32, vol:0.06, lp:700}); noiz({type:'lowpass', f:500, f2:1500, dur:0.3, vol:0.04}); },
  slam(){ voice({type:'sine', f:95, f2:28, dur:0.36, vol:0.13}); noiz({type:'lowpass', f:200, dur:0.32, vol:0.1, rev:0.3}); },
  ogreSmash(){ SFX.slam(); voice({type:'sawtooth', t:0.02, f:60, f2:35, dur:0.4, vol:0.06, lp:300}); noiz({t:0.05, type:'bandpass', f:140, dur:0.4, vol:0.07}); },
  roar(){ voice({type:'sawtooth', f:115, f2:55, dur:0.65, vol:0.09, lp:700, vibD:5, vibR:11}); noiz({f:240, dur:0.5, vol:0.06, q:0.5}); },
  boom(){ voice({type:'sine', f:105, f2:24, dur:0.5, vol:0.14}); noiz({type:'lowpass', f:260, dur:0.45, vol:0.11, rev:0.4}); },
  shot(){ voice({type:'sawtooth', f:rv(720), f2:200, dur:0.13, vol:0.045, lp:2500}); },
  bolt(){ voice({type:'sine', f:rv(500), f2:1100, dur:0.22, vol:0.05, rev:0.5, vibD:30, vibR:25}); },
  bowDraw(){ noiz({f:600, f2:1300, dur:0.3, vol:0.025, q:4}); },
  arrow(){ voice({type:'triangle', f:rv(200), f2:90, dur:0.12, vol:0.08}); noiz({type:'highpass', f:3500, dur:0.07, vol:0.05}); },
  fuse(){ noiz({type:'highpass', f:3500, dur:0.18, vol:0.03, q:1}); },
  spawn(){ voice({type:'sine', f:140, f2:420, dur:0.35, vol:0.04, rev:0.5}); noiz({f:700, f2:200, dur:0.3, vol:0.03, q:2}); },
  necroRaise(){ voice({type:'sine', f:150, f2:420, dur:0.8, vol:0.06, rev:0.8, vibD:12, vibR:8}); for (let i = 0; i < 6; i++) voice({type:'triangle', t:0.2 + i*0.07, f:rv(600), f2:350, dur:0.05, vol:0.04}); noiz({f:900, f2:2500, dur:0.7, vol:0.03, q:3, rev:0.5}); },
  necroShield(){ voice({type:'square', f:420, f2:380, dur:0.16, vol:0.03, voices:3, det:25, bp:1300, q:4, rev:0.5}); },

  for (let b = 0; b < d.prog.length; b++){
    const bar = new Array(16).fill(null);
    const chordRoot = d.prog[b];
    for (let s = 0; s < 16; s += 2){
      const strong = s % 4 === 0;
      if (rnd() > (strong ? dens * 2.2 : dens * 1.1)) continue;
      if (strong && rnd() < 0.6) idx = chordRoot + 7 + [0, 2, 4][Math.floor(rnd() * 3)];
      else idx += Math.floor(rnd() * 3) - 1 + (rnd() < 0.15 ? (rnd() < 0.5 ? -2 : 2) : 0);
      idx = clamp(idx, 5, 16);
      bar[s] = idx;
      if (rnd() < 0.2 && s < 15) bar[s + 1] = idx;
    }
    bars.push(bar);
  }
  return bars;
}

const dotCache = {};
function getDotSprite(color){

const auraCache = {};
function makeAuraSprite(color, size){
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const cx = c.getContext('2d');
  const g = cx.createRadialGradient(size/2, size/2, 2, size/2, size/2, size/2);
  g.addColorStop(0, hexA(color, 0.5));
  g.addColorStop(0.55, hexA(color, 0.15));
  g.addColorStop(1, hexA(color, 0));
  cx.fillStyle = g;
  cx.fillRect(0, 0, size, size);
  return c;
}
function initAuraSprites(){

    g.fillStyle = '#5ad7ff';
    g.beginPath(); g.arc(s*0.2, s*0.28, s*0.04, 0, TAU); g.fill();
  }

    g.fillStyle = '#7bff8a';
    g.fillRect(-s*0.08, -s*0.25, s*0.16, s*0.5);

    g.strokeStyle = '#7bff8a'; g.lineWidth = s*0.03;
    g.beginPath(); g.arc(0, 0, s*0.32, 0, TAU); g.stroke();

    g.strokeStyle = '#ffd166'; g.lineWidth = s*0.04;

  }

    g.beginPath(); g.arc(0, -s*0.05, s*0.25, Math.PI, 0);

    g.fillStyle = '#1a0a2a';
    g.beginPath();
    g.arc(-s*0.08, -s*0.05, s*0.04, 0, TAU);

  }

  g.globalCompositeOperation = 'source-atop';
  const shine = g.createLinearGradient(-s/2, -s/2, s/2, s/2);

  shine.addColorStop(0.45, 'rgba(255,255,255,0.16)');
  shine.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = shine;
  g.fillRect(-s/2, -s/2, s, s);
  g.globalCompositeOperation = 'source-over';
  return c;
}

let floorPattern = null;
function initFloorPattern(){
  const T = 110;
  const c = document.createElement('canvas');
  c.width = T; c.height = T;
  const cx = c.getContext('2d');
  cx.fillStyle = '#150815';
  cx.fillRect(0, 0, T, T);
  cx.strokeStyle = 'rgba(0,0,0,0.25)';
  cx.lineWidth = 1;
  cx.beginPath();
  cx.moveTo(0, T/2); cx.lineTo(T, T/2);
  cx.moveTo(T/2, 0); cx.lineTo(T/2, T);
  cx.stroke();
  cx.strokeStyle = 'rgba(255,255,255,0.04)';
  cx.beginPath();
  cx.moveTo(0, T/2 + 1.5); cx.lineTo(T, T/2 + 1.5);
  cx.moveTo(T/2 + 1.5, 0); cx.lineTo(T/2 + 1.5, T);
  cx.stroke();
  cx.strokeStyle = 'rgba(0,0,0,0.28)';
  cx.lineWidth = 1.5;
  cx.beginPath();
  cx.moveTo(T * 0.2, T * 0.3);
  cx.lineTo(T * 0.5, T * 0.55);
  cx.lineTo(T * 0.45, T * 0.8);
  cx.stroke();
  cx.beginPath();
  cx.moveTo(T * 0.72, T * 0.15);
  cx.lineTo(T * 0.8, T * 0.38);
  cx.lineTo(T * 0.68, T * 0.6);
  cx.stroke();
  for (let i = 0; i < 14; i++){
    const px = (i * 37 + 13) % T, py = (i * 53 + 29) % T;
    cx.fillStyle = i % 3 === 0 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.22)';
    cx.fillRect(px, py, 2, 2);
  }
  cx.strokeStyle = 'rgba(70,25,50,0.15)';
  cx.lineWidth = 1;
  cx.strokeRect(1, 1, T - 2, T - 2);
  floorPattern = ctx.createPattern(c, 'repeat');
}

function makeItem(templateKey, rarity){
  const t = ITEM_TEMPLATES[templateKey];
  if (!t) return null;
  if (t.type === 'consumable') rarity = 'common';
  const r = RARITIES[rarity] || RARITIES.common;
  const item = {
    id: templateKey + '_' + Date.now().toString(36) + '_' + Math.floor(Math.random()*1e6).toString(36),
    templateKey, type: t.type, slot: t.slot,
    name: t.name, desc: t.desc, rarity,
    stackable: !!t.stackable, quantity: 1
  };
  if (t.type === 'armor') item.defense = Math.round(t.baseDef * r.mult);
  else if (t.type === 'weapon'){
    item.dmgMult = t.dmgMult * (1 + (r.mult - 1) * 0.3);
    item.rangeMult = t.rangeMult;
    item.speedMult = t.speedMult;
  } else if (t.type === 'consumable'){
    item.effect = t.effect; item.value = t.value; item.duration = t.duration;
  }
  return item;
}

function rollRarity(tier){
  const r = Math.random();
  if (tier === 'common') return r < 0.7 ? 'common' : (r < 0.95 ? 'rare' : 'epic');
  if (tier === 'chest')  return r < 0.4 ? 'common' : (r < 0.8 ? 'rare' : (r < 0.98 ? 'epic' : 'legendary'));
  if (tier === 'boss')   return r < 0.3 ? 'rare' : (r < 0.85 ? 'epic' : 'legendary');
  if (tier === 'elite')  return r < 0.6 ? 'epic' : 'legendary';
  return 'common';
}

const GEAR_KEYS = Object.keys(ITEM_TEMPLATES).filter(k => ITEM_TEMPLATES[k].type !== 'consumable');
const CONSUMABLE_POOL = [['healPotion', 45], ['dmgPotion', 15], ['defPotion', 15], ['throwKnife', 15], ['throwAxe', 10]];
function rollGear(rarity){
  const k = GEAR_KEYS[Math.floor(Math.random() * GEAR_KEYS.length)];
  return makeItem(k, rarity);
}
function rollConsumable(){
  let r = Math.random() * 100;
  for (const [k, w] of CONSUMABLE_POOL){ if (r < w) return makeItem(k, 'common'); r -= w; }
  return makeItem('healPotion', 'common');
}
function rollItem(rarity){ return rollGear(rarity); }
function addToInventory(item){
  if (item.stackable){
    const same = o => o && o.stackable && o.templateKey === item.templateKey && o.rarity === item.rarity && o.quantity + item.quantity <= 99;
    const qs = playerInventory.quickSlots.find(same);
    if (qs){ qs.quantity += item.quantity; return true; }
    const st = playerInventory.items.find(same);
    if (st){ st.quantity += item.quantity; return true; }
  }
  if (playerInventory.items.length >= INV_MAX) return false;
  playerInventory.items.push(item);
  return true;
}
function mergeStacks(){
  const out = [];
  for (const it of playerInventory.items){
    if (!it.stackable || playerInventory.quickSlots.includes(it)){ out.push(it); continue; }
    let q = it.quantity || 1;
    while (q > 0){
      const tgt = out.find(o => o.stackable && o !== it && o.templateKey === it.templateKey && o.rarity === it.rarity && o.quantity < 99 && !playerInventory.quickSlots.includes(o));
      if (tgt){ const take = Math.min(99 - tgt.quantity, q); tgt.quantity += take; q -= take; }
      else { it.quantity = q; out.push(it); q = 0; }
    }
  }
  playerInventory.items = out;
  if (playerInventory.selectedItem && !out.includes(playerInventory.selectedItem)) playerInventory.selectedItem = null;
}

        if (!it || typeof it !== 'object' || !ITEM_TEMPLATES[it.templateKey]) return false;
        if (typeof it.quantity !== 'number' || it.quantity < 1) it.quantity = 1;
        if (!RARITIES[it.rarity]) it.rarity = 'common';
        if (ITEM_TEMPLATES[it.templateKey].type === 'consumable') it.rarity = 'common';

const loading = {
  active: false, timer: 0, duration: 0.55,
  subtext: '', targetState: 'dungeon',
  genPending: false, onGen: null, levelHint: 0
};
function startLoading(subtext, onGen, targetState, levelHint){
  sfx('portal');
  loading.active = true; loading.timer = 0;
  loading.subtext = subtext || '';
  loading.targetState = targetState || 'dungeon';
  loading.genPending = true; loading.onGen = onGen;
  loading.levelHint = levelHint || 0;
  gameState = 'loading';
}
function updateLoading(dt){
  loading.timer += dt;
  if (loading.genPending && loading.timer >= 0.033){
    loading.genPending = false;
    if (loading.onGen) loading.onGen();
  }
  if (loading.timer >= loading.duration && !loading.genPending){
    loading.active = false;
    gameState = loading.targetState;
  }
}
function renderLoading(){
  ctx.fillStyle = '#05030a';
  ctx.fillRect(0, 0, W, H);
  const t = loading.timer;
  const cx = W / 2, cy = H / 2;
  const progress = clamp(t / loading.duration, 0, 1);
  const pulse = 0.7 + Math.sin(t * 6) * 0.3;
  const runeR = Math.min(W, H) * 0.13;
  ctx.save();
  ctx.translate(cx, cy - runeR * 1.4);
  ctx.rotate(t * 1.2);
  ctx.globalAlpha = 0.35 + pulse * 0.35;
  ctx.strokeStyle = '#ff2b45';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, runeR, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, runeR * 0.55, 0, TAU); ctx.stroke();
  ctx.restore();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (loading.levelHint > 0){
    ctx.font = 'bold 36px Georgia, serif';
    ctx.fillStyle = '#ff2b45';
    ctx.fillText('ЭТАЖ ' + loading.levelHint, cx, cy + runeR * 0.15);
  }
  ctx.font = 'bold 13px system-ui';
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText(loading.subtext || 'ПОГРУЖЕНИЕ...', cx, cy + runeR * 0.9);
  const barW = Math.min(W * 0.4, 280);
  const barX = cx - barW / 2;
  const barY = cy + runeR * 1.9;
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  rr(barX, barY, barW, 4, 2); ctx.fill();
  ctx.fillStyle = '#ff2b45';
  rr(barX, barY, barW * progress, 4, 2); ctx.fill();
}

let conc = 0, concDecayDelay = 0, maxConcLevelReached = 0;
function getConcLevel(){
  if (conc >= 85) return 3;
  if (conc >= 55) return 2;
  if (conc >= 25) return 1;
  return 0;
}
function addConc(v){
  conc = Math.min(CONC_MAX, conc + v);
  concDecayDelay = 2.0;
  const lvl = getConcLevel();
  if (lvl > maxConcLevelReached) maxConcLevelReached = lvl;
}
function resetConc(){ conc = 0; concDecayDelay = 0; }
function payConcLevels(n){
  for (let i = 0; i < n; i++){
    const lvl = getConcLevel();
    if (lvl === 3) conc = 84;
    else if (lvl === 2) conc = 54;
    else if (lvl === 1) conc = 0;
    else break;
  }
  concDecayDelay = 2.0;
}
function canCombo(combo){
  if (!combo.concCost) return true;
  return getConcLevel() >= combo.concCost;
}
function updateConc(dt){
  if (concDecayDelay > 0) concDecayDelay -= dt;
  else if (conc > 0) conc = Math.max(0, conc - 4 * dt);
}

const SPATIAL_CELL = 60;
const spatialHash = new Map();
function spatialKey(x, y){ return ((x / SPATIAL_CELL)|0) + ',' + ((y / SPATIAL_CELL)|0); }
function rebuildSpatialHash(){
  spatialHash.clear();
  for (let i = 0; i < enemies.length; i++){
    const e = enemies[i];
    if (e.hp <= 0 || e.spawnTime > 0) continue;
    const k = spatialKey(e.x, e.y);
    let arr = spatialHash.get(k);
    if (!arr){ arr = []; spatialHash.set(k, arr); }
    arr.push(i);
  }
}

/* ==================== ROOM TYPES / INTERACTIVES ==================== */
const ROOM_NAMES = { merchant:'СТРАНСТВУЮЩИЙ ТОРГОВЕЦ', forge:'КУЗНИЦА', altar:'АЛТАРЬ СДЕЛКИ', cursed:'ПРОКЛЯТЫЙ СУНДУК', shade:'ЗАЛ ЗЕРКАЛ' };
const ROOM_SYM = { merchant:'$', forge:'К', altar:'✦', cursed:'☠', shade:'?' };
const ROOM_COL = { merchant:'#ffd166', forge:'#ff7b1a', altar:'#b04bff', cursed:'#ff2b45', shade:'#9ffcff' };
const FORGE_MAX = 5;
function uiS(){ return clamp(Math.min(W / 1000, H / 560), 0.75, 1.3); }
function shuffled(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function roomDegree(c, cells){
  let n = 0;
  for (const d of [[1,0],[-1,0],[0,1],[0,-1]]){
    if (cells.some(o => o.exists && o.gx === c.gx + d[0] && o.gy === c.gy + d[1])) n++;
  }
  return n;
}
function assignRoomTypes(cells){
  const cand = cells.filter(c => c.exists && !c.isStart && !c.isBoss);
  if (cand.length < 2) return;
  const types = ['merchant', 'forge'];
  if (floor >= 2) types.push('altar', 'cursed');
  const order = shuffled(types);
  let want = (floor <= 1 ? 1 : 2) + (Math.random() < 0.5 ? 1 : 0);
  want = Math.min(want, order.length, Math.max(1, Math.floor(cand.length * 0.5)));
  const keyed = cand.map(c => ({ c, k: roomDegree(c, cells) + Math.random() * 0.9 })).sort((a, b) => a.k - b.k);
  for (let i = 0; i < want; i++){
    const c = keyed[i].c;
    c.type = order[i]; c.spawned = true; c.cleared = true;
  }
  // секретная комната с Двойником: редко и только с 5 этажа
  if (floor >= 5 && Math.random() < 0.12 && keyed.length > want){
    const c = keyed[want].c;
    c.type = 'shade'; c.spawned = true; c.cleared = true;
  }
}
function makeWandererStock(){
  const ids = shuffled(['healPotion', 'dmgPotion', 'defPotion', 'throwKnife', 'throwAxe']).slice(0, 4);
  if (!ids.includes('healPotion')) ids[3] = 'healPotion';
  return ids.map(k => {
    const base = SHOP_STOCK.find(x => x.templateKey === k);
    return { templateKey: k, rarity: 'common', price: Math.round(base.price * 1.25), left: k === 'healPotion' ? 3 : 2 };
  });
}
const ALTAR_DEALS = [

function buildInteracts(){
  interacts = [];
  if (!dungeon) return;
  for (const c of dungeon.cells){
    if (!c.exists || !c.type || c.type === 'combat') continue;
    const it = { kind: c.type, x: c.rect.x + c.rect.w / 2, y: c.rect.y + c.rect.h / 2, r: 34, room: c, used: false, pulse: Math.random() * TAU };
    if (c.type === 'merchant') it.stock = makeWandererStock();
    if (c.type === 'altar') it.deals = shuffled(ALTAR_DEALS.map(d => d.id)).slice(0, 3);
    interacts.push(it);
  }
}

/* ----- forge ----- */
function forgeCost(it){ const r = RARITIES[it.rarity] || RARITIES.common; return Math.round((35 + (it.upg || 0) * 30) * r.mult); }
function forgeNextDef(it){ return (it.defense || 0) + Math.max(2, Math.round((it.defense || 0) * 0.12)); }
function forgeUpgrade(it){
  if (!it.baseName) it.baseName = it.name;
  it.upg = (it.upg || 0) + 1;
  if (it.type === 'armor') it.defense = forgeNextDef(it);
  else if (it.type === 'weapon') it.dmgMult = (it.dmgMult || 1) * 1.08;
  it.name = it.baseName + ' +' + it.upg;
}
function getForgeLayout(){
  const s = uiS();
  const rowH = 52 * s, gap = 6 * s;
  const rowW = Math.min(W - 32 * s, 700 * s);
  return { s, rowH, gap, rowW, x: (W - rowW) / 2, y0: 62 * s, close: { x: W/2 - 80*s, y: H - 44*s, w: 160*s, h: 34*s } };
}
function forgeBtnRect(L, i){
  const y = L.y0 + i * (L.rowH + L.gap), bw = 116 * L.s, bh = 30 * L.s;

}

    }

    ctx.fillText(it.name, L.x + 58 * s, y + L.rowH * 0.34);

    let stat;
    if (it.type === 'armor') stat = 'ЗАЩИТА ' + (it.defense || 0) + (lv < FORGE_MAX ? ' → ' + forgeNextDef(it) : '');
    else stat = 'УРОН ×' + (it.dmgMult || 1).toFixed(2) + (lv < FORGE_MAX ? ' → ×' + ((it.dmgMult || 1) * 1.08).toFixed(2) : '');
    ctx.fillText(INV_EQ_LABEL[key] + ' · ' + stat, L.x + 58 * s, y + L.rowH * 0.7);
    const b = forgeBtnRect(L, i);

      ctx.fillStyle = k < lv ? '#ff7b1a' : 'rgba(255,255,255,0.15)';

function handleForgeTap(x, y){
  const L = getForgeLayout();

  for (let i = 0; i < 5; i++){
    const it = playerInventory.equipment[INV_EQ_ORDER[i]];
    if (!it) continue;
    if (!inRect(x, y, forgeBtnRect(L, i))) continue;
    if ((it.upg || 0) >= FORGE_MAX){ showToast('МАКСИМАЛЬНЫЙ УРОВЕНЬ'); sfx('deny'); return; }
    const cost = forgeCost(it);
    if (playerGold < cost){ showToast('НЕДОСТАТОЧНО ЗОЛОТА'); sfx('deny'); return; }
    playerGold -= cost;
    forgeUpgrade(it);
    sfx('levelup'); showToast(it.name);

  }

/* ----- altar ----- */
function getAltarLayout(){
  const s = uiS();
  const n = altarObj ? altarObj.deals.length : 3;
  const gap = 12 * s;
  const cardW = Math.min(250 * s, (W - 40 * s - gap * (n - 1)) / n);
  const cardH = Math.min(230 * s, H - 150 * s);
  const totalW = n * cardW + (n - 1) * gap;
  return { s, n, gap, cardW, cardH, x0: (W - totalW) / 2, y0: 70 * s, leave: { x: W/2 - 90*s, y: H - 46*s, w: 180*s, h: 34*s } };
}
function drawWrapped(text, x, y, maxW, fs, lh, color){
  const lines = wrapText(text, maxW, fs);
  ctx.font = 'bold ' + Math.round(fs) + 'px system-ui';
  ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  for (const ln of lines){ ctx.fillText(ln, x, y); y += lh; }

}

function handleAltarTap(x, y){

/* ==================== MINIMAP ==================== */
let minimapCanvas = null;
let minimapStateHash = '';

function updateMinimapIfNeeded(){
  if (!dungeon) return;
  let hash = floor + '|';
  for (const c of dungeon.cells){
    if (!c.exists) continue;
    hash += (c.visited ? '1' : '0') + (c.cleared ? '1' : '0') + (c.waveIndex || 0);
  }
  if (hash === minimapStateHash && minimapCanvas) return;
  minimapStateHash = hash;
  const worldW = dungeonWorldW();
  const worldH = dungeonWorldH();
  const scale = Math.min(140 / worldW, 110 / worldH);
  const mapW = Math.ceil(worldW * scale);
  const mapH = Math.ceil(worldH * scale);
  if (!minimapCanvas) minimapCanvas = document.createElement('canvas');
  if (minimapCanvas.width !== mapW) minimapCanvas.width = mapW;
  if (minimapCanvas.height !== mapH) minimapCanvas.height = mapH;
  const mctx = minimapCanvas.getContext('2d');
  mctx.clearRect(0, 0, mapW, mapH);
  for (const z of dungeonZones){
    const zx = z.x * scale, zy = z.y * scale, zw = z.w * scale, zh = z.h * scale;
    let fill = 'rgba(60, 40, 80, 0.5)';
    let stroke = 'rgba(160,120,220,0.3)';
    if (z.type === 'room'){
      const room = z.room;
      if (room.visited){
        if (room.cleared){ fill = 'rgba(100, 60, 160, 0.55)'; stroke = 'rgba(160,120,220,0.7)'; }
        else { fill = 'rgba(138, 26, 42, 0.65)'; stroke = 'rgba(255,85,102,0.7)'; }
      } else { fill = 'rgba(40, 30, 50, 0.5)'; stroke = 'rgba(255,255,255,0.1)'; }
      if (room.isElite){ fill = 'rgba(200, 130, 20, 0.8)'; stroke = 'rgba(255,209,102,0.9)'; }
      else if (room.isBoss && !room.cleared){ fill = 'rgba(180, 20, 40, 0.75)'; stroke = 'rgba(255,60,80,0.9)'; }
    }
    mctx.fillStyle = fill;
    mctx.fillRect(zx, zy, zw, zh);
    mctx.strokeStyle = stroke;
    mctx.lineWidth = 0.8;
    mctx.strokeRect(zx, zy, zw, zh);
  }
  for (const c of dungeon.cells){
    if (!c.exists) continue;
    const bx = (c.rect.x + c.rect.w/2) * scale;
    const by = (c.rect.y + c.rect.h/2) * scale;
    mctx.font = 'bold 11px system-ui';
    mctx.textAlign = 'center'; mctx.textBaseline = 'middle';
    if (c.isElite){ mctx.fillStyle = c.cleared ? 'rgba(255,209,102,0.5)' : '#ffd166'; mctx.fillText('★', bx, by + 0.5); }
    else if (c.isBoss){ mctx.fillStyle = c.cleared ? 'rgba(255,209,102,0.5)' : '#ff2b45'; mctx.fillText('♛', bx, by + 0.5); }
    else if (c.type && c.type !== 'combat' && c.visited){ mctx.fillStyle = ROOM_COL[c.type]; mctx.fillText(ROOM_SYM[c.type], bx, by + 0.5); }
  }
}

/* ==================== DUNGEON ==================== */
function generateDungeon(){
  const cells = [];
  for (let gy = 0; gy < DUNGEON.grid; gy++){
    for (let gx = 0; gx < DUNGEON.grid; gx++){
      const isStart = gx === 0 && gy === Math.floor(DUNGEON.grid/2);
      const isBoss  = gx === DUNGEON.grid-1 && gy === Math.floor(DUNGEON.grid/2);
      const isElite = isBoss && floor > 0 && floor % 10 === 0;
      const exists  = isStart || isBoss || Math.random() < 0.65;
      const rx = gx * (DUNGEON.roomW + DUNGEON.corridorW);
      const ry = gy * (DUNGEON.roomH + DUNGEON.corridorW);
      cells.push({
        gx, gy, exists, isStart, isBoss, isElite, visited: isStart,
        rect: { x: rx, y: ry, w: DUNGEON.roomW, h: DUNGEON.roomH },
        spawned: isStart, cleared: isStart, waveIndex: 0, waveCount: 0, type: 'combat'
      });
    }
  }
  const start = cells.find(c => c.isStart);
  const boss  = cells.find(c => c.isBoss);
  const path = bfsPath(start, boss, cells);
  if (!path){
    for (let gx = 0; gx < DUNGEON.grid; gx++){
      const c = cells.find(cc => cc.gx === gx && cc.gy === Math.floor(DUNGEON.grid/2));
      if (c) c.exists = true;
    }
  }
  assignRoomTypes(cells);
  const zones = [];
  for (const c of cells){
    if (!c.exists) continue;
    zones.push({ type:'room', x:c.rect.x, y:c.rect.y, w:c.rect.w, h:c.rect.h, room:c });
  }
  const ov = DUNGEON.overlap;
  for (const c of cells){
    if (!c.exists) continue;
    const right = cells.find(cc => cc.gx === c.gx+1 && cc.gy === c.gy && cc.exists);
    if (right){
      zones.push({ type:'corr', x: c.rect.x + c.rect.w - ov, y: c.rect.y + c.rect.h/2 - DUNGEON.corridorW/2, w: DUNGEON.corridorW + ov*2, h: DUNGEON.corridorW });
    }
    const down = cells.find(cc => cc.gx === c.gx && cc.gy === c.gy+1 && cc.exists);
    if (down){
      zones.push({ type:'corr', x: c.rect.x + c.rect.w/2 - DUNGEON.corridorW/2, y: c.rect.y + c.rect.h - ov, w: DUNGEON.corridorW, h: DUNGEON.corridorW + ov*2 });
    }
  }
  return { cells, zones };
}

function bfsPath(from, to, cells){
  const key = (gx, gy) => gx + ',' + gy;
  const get = (gx, gy) => {
    if (gx < 0 || gy < 0 || gx >= DUNGEON.grid || gy >= DUNGEON.grid) return null;
    const c = cells.find(cc => cc.gx === gx && cc.gy === gy);
    return c && c.exists ? c : null;
  };
  const queue = [from];
  const came = new Map();
  came.set(key(from.gx, from.gy), null);
  while (queue.length > 0){
    const cur = queue.shift();
    if (cur === to){
      const path = [];
      let c = cur;
      while (c){ path.unshift(c); c = came.get(key(c.gx, c.gy)); }
      return path;
    }
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const n = get(cur.gx + dx, cur.gy + dy);
      if (!n) continue;
      const k = key(n.gx, n.gy);
      if (came.has(k)) continue;
      came.set(k, cur);
      queue.push(n);
    }
  }
  return null;
}

function isInsideAnyZone(x, y){
  for (let i = 0; i < dungeonZones.length; i++){
    const z = dungeonZones[i];
    if (x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h) return true;
  }
  return false;
}
function isRoomActive(room){ return room && room.spawned && !room.cleared; }
function findCurrentRoom(){
  if (!dungeon) return null;
  for (const c of dungeon.cells){
    if (!c.exists) continue;
    if (player.x >= c.rect.x && player.x <= c.rect.x + c.rect.w &&
        player.y >= c.rect.y && player.y <= c.rect.y + c.rect.h) return c;
  }
  return null;
}

function tryEnterRoomCheck(){
  const room = findCurrentRoom();
  if (room && room !== playerRoom){
    playerRoom = room; room.visited = true;
    if (room.type && room.type !== 'combat' && !room._announced){ room._announced = true; showToast(ROOM_NAMES[room.type]); }
    currentRoomIndex = dungeon.cells.indexOf(room);
    if (!room.spawned && !room.isStart){
      room.spawned = true;
      if (room.isElite){ room.waveCount = 1; room.waveIndex = 0; spawnElite(room); }
      else if (room.isBoss){ room.waveCount = 1; room.waveIndex = 0; spawnBoss(room); }
      else { room.waveCount = getWavesForFloor(); room.waveIndex = 0; spawnRoomWave(room); }
    }
  }
}

function pickEnemyType(sr, st){
  st = st || {};
  const roll = sr(), r2 = sr();
  if (floor >= 3 && r2 > 0.93 && !st.necro){ st.necro = true; return 'necro'; }
  if (floor >= 2 && r2 < 0.08 && !st.ogre){ st.ogre = true; return 'ogre'; }
  if (floor >= 4 && roll > 0.86) return 'bomber';
  if (floor >= 2 && roll > 0.70) return 'archer';
  if (roll > 0.45) return 'runner';
  return 'grunt';
}

function spawnRoomWave(room){
  const waveIdx = room.waveIndex || 0;
  const mult = getFloorMult();
  const sr = makeSeededRandom(room.gx * 37 + room.gy * 71 + floor * 1000 + waveIdx * 7919 + 1337);
  const baseCount = 2 + waveIdx + Math.floor((floor - 1) * 0.7) + Math.floor(sr() * 2);
  const count = Math.max(2, baseCount) + (room.type === 'cursed' ? 2 : 0);
  const _pst = {};
  for (let i = 0; i < count; i++){
    const type = pickEnemyType(sr, _pst);
    const base = ENEMY_TYPES[type];
    let ex, ey, tries = 0;
    do {
      ex = room.rect.x + 100 + sr() * (room.rect.w - 200);
      ey = room.rect.y + 100 + sr() * (room.rect.h - 200);
      tries++;
    } while (Math.hypot(ex - player.x, ey - player.y) < 140 && tries < 20);
    const hp = base.hp * mult.hp * (room.type === 'cursed' ? 1.2 : 1);
    enemies.push({
      type, x: ex, y: ey, vx:0, vy:0, r:base.r, hp, maxHp: hp,
      speed: base.speed * mult.speed, dmg: Math.round(base.dmg * mult.dmg),
      atkCd: base.atkCd, attackCd: 0.4 + sr() * 0.6,
      score: Math.round(base.score * mult.score),
      color: base.color, glow: base.glow,
      hurtFlash:0, stun:0, attackLock: 0, spawnTime: 0.3 + i * 0.08,
      wobble: sr() * TAU, animPhase: sr() * TAU, homeRoom: room
    });
  }
  if (_pst.necro) showToast('ПРИЗЫВАТЕЛЬ: убей всех, кроме его слуг');
  if (waveIdx === 0) sfx('gate');
}

function spawnBoss(room){ spawnBossOfKind(room, false); }
function spawnElite(room){ spawnBossOfKind(room, true); }
function spawnBossOfKind(room, elite){
  const mult = getFloorMult();
  const base = elite ? ENEMY_TYPES.elite : ENEMY_TYPES.boss;
  const key = pickBossKind(elite), K = BOSS_KINDS[key];
  const hp = base.hp * mult.hp * K.hp;
  const e = {
    type: elite ? 'elite' : 'boss', bossKind: key, bossName: (elite ? 'ЭЛИТА · ' : '') + K.name,
    x: room.rect.x + room.rect.w/2, y: room.rect.y + room.rect.h * 0.4,
    vx:0, vy:0, r: elite ? base.r : K.r, hp, maxHp: hp,
    speed: base.speed * mult.speed * K.spd, dmg: Math.round(base.dmg * mult.dmg * K.dmg),
    atkCd: base.atkCd, attackCd: 1.5, score: Math.round(base.score * mult.score),
    color: K.color, glow: K.glow, isBoss: true,
    hurtFlash:0, stun:0, attackLock: 0, spawnTime: 1.0, wobble: 0, animPhase: 0, homeRoom: room
  };
  if (elite) e.isElite = true;
  enemies.push(e);
  currentBoss = e;
  showToast(K.name + ' — ' + K.hint); sfx('bossIntro');
}

function spawnChestInRoom(room){
  chests.push({ x: room.rect.x + room.rect.w/2, y: room.rect.y + room.rect.h/2, r: 26, room, opened: false });
}

function checkRoomWaves(){
  const room = playerRoom;
  if (!room || !room.spawned || room.cleared || room.isBoss || room.type === 'shade') return;
  let alive = 0;
  for (const e of enemies) if (e.hp > 0 && e.homeRoom === room) alive++;
  if (alive > 0) return;
  if (room.waveIndex < room.waveCount - 1){
    room.waveIndex++;
    spawnRoomWave(room);
    showToast('ВОЛНА ' + (room.waveIndex + 1) + ' / ' + room.waveCount); sfx('wave');
  } else {
    room.cleared = true;
    showToast('КОМНАТА ЗАЧИЩЕНА'); sfx('roomClear');
    if (room.type === 'cursed') spawnCursedReward(room); else spawnChestInRoom(room);
  }
}

/* ==================== STAGE / CHAIN ==================== */
function doStage(hand){
  const p = player;
  if (!p || p.hp <= 0) return;
  if (isTwoHandedWeapon('R') && hand !== 'R') return;
  if (isTwoHandedWeapon('L') && hand !== 'L') return;
  chain.stage = Math.min(CHAIN_MAX_STAGE, chain.stage + 1);
  chain.lastHand = hand;
  chain.timer = CHAIN_TIMEOUT;
}

function updateChain(dt){
  if (chain.timer > 0){
    chain.timer -= dt;
    if (chain.timer <= 0) resetChain();
  }
  if (abilityCd > 0) abilityCd = Math.max(0, abilityCd - dt);
  if (abilityActiveTime > 0) abilityActiveTime = Math.max(0, abilityActiveTime - dt);
}

function doWeaponStage(weaponType, stage, hand){
  const p = player;
  if (!p || p.hp <= 0) return false;
  if (p.attackTime > p.attackDur * 0.32) return false;
  const wm = getWeaponMultForHand(hand);
  if (wm.isShield) return false;
  stage = Math.min(chain.stage, 2);
  p.atkCombo = stage;
  const baseCfg = getWeaponStageConfig(weaponType, stage);
  const cfg = {
    dmg: baseCfg.dmg * wm.dmgMult,
    range: baseCfg.range * wm.rangeMult,
    arc: baseCfg.arc,
    knock: baseCfg.knock,
    dur: baseCfg.dur / wm.speedMult,
    lunge: baseCfg.lunge,
    type: baseCfg.type,
    stun: baseCfg.stun,
    lock: baseCfg.lock
  };
  p.attackDur = cfg.dur;
  p.attackTime = cfg.dur;
  p.comboTimer = cfg.dur + 0.55;
  p.hitSet.clear();
  p.currentHand = hand;
  const target = nearestEnemy(p.x, p.y, 155);
  if (target) p.facing = Math.atan2(target.y - p.y, target.x - p.x);
  const nx = p.x + Math.cos(p.facing) * cfg.lunge;
  const ny = p.y + Math.sin(p.facing) * cfg.lunge;
  if (canMove(nx, p.y)) p.x = nx;
  if (canMove(p.x, ny)) p.y = ny;
  slashes.push({ x:p.x, y:p.y, a:p.facing, t:0, dur:cfg.dur*0.95, combo:Math.min(stage, 2), weaponColor: wm.glow, hand });
  sfxSwing(weaponType);
  doStage(hand);
  if (chain.stage >= CHAIN_MAX_STAGE) resetChain();
  return true;
}

/* ==================== ABILITIES ==================== */
function activateAbility(){
  const p = player;
  if (!p || p.hp <= 0) return;
  if (abilityCd > 0) return;
  if (p.blockActive) return;
  if (p.altTime > 0) return;
  const def = ABILITY_TYPES[currentAbility];
  if (!def) return;
  abilityCd = getAbilityCd(currentAbility);
  sfx(({dash:'dash',stomp:'stomp',hook:'hook',heal:'heal',rage:'rage',parry:'parry',ghost:'ghost'})[currentAbility] || 'ability');
  switch (currentAbility){
    case 'dash':  doAbilityDash();  break;
    case 'stomp': doAbilityStomp(); break;
    case 'hook':  doAbilityHook();  break;
    case 'heal':  doAbilityHeal();  break;
    case 'rage':  doAbilityRage();  break;
    case 'parry': doAbilityParry(); break;
    case 'ghost': doAbilityGhost(); break;
  }
}

function doAbilityDash(){
  const p = player;
  let dx = input.joy.dx, dy = input.joy.dy;
  let m = Math.hypot(dx, dy);
  if (m < 0.25){ dx = Math.cos(p.facing); dy = Math.sin(p.facing); m = 1; }
  dx /= m; dy /= m;
  p.dashTime = 0.16;
  p.dashVX = dx * 950; p.dashVY = dy * 950;
  p.invuln = Math.max(p.invuln, 0.30);
  p.facing = Math.atan2(dy, dx);
  shake = Math.max(shake, 3);
  recordComboInput('dash');
}

function doAbilityStomp(){
  const p = player;
  const wm = getWeaponMult();
  const dmg = 25 * (wm.dmgMult || 1);
  const radius = 110 * (wm.rangeMult || 1);
  p.altTime = 0.35;
  p.attackTime = 0; p.atkCombo = 0; p.comboTimer = 0;
  slashes.push({ x:p.x, y:p.y, a:0, t:0, dur:0.35, combo:-1, weaponColor: wm.glow });
  for (const e of enemies){
    if (e.hp <= 0 || e.spawnTime > 0) continue;
    const d = Math.hypot(e.x - p.x, e.y - p.y);
    if (d < radius + e.r){
      const ang = Math.atan2(e.y - p.y, e.x - p.x);
      hitEnemy(e, Math.round(dmg * (1 + p.dmgBuff + (p.relicDmg || 0))), ang, 500, true);
    }
  }
  if (gameState === 'lobby'){
    const d = lobby.dummy;
    if (Math.hypot(d.x - p.x, d.y - p.y) < radius + d.r){
      hitDummy(Math.round(dmg * (1 + p.dmgBuff + (p.relicDmg || 0))), 0, 0);
    }
  }
  for (let i = 0; i < 20; i++){
    const a = i/20 * TAU;
    particles.push({ x:p.x+Math.cos(a)*25, y:p.y+Math.sin(a)*25, vx:Math.cos(a)*320, vy:Math.sin(a)*320, life:0.4, max:0.4, size:4, color:wm.glow, glow:true });
  }
  comboRings.push({ x:p.x, y:p.y, r:20, maxR:radius+10, t:0, dur:0.32, color:wm.glow, width:5 });
  shake = Math.max(shake, 8);
}

function doAbilityHook(){
  const p = player;
  const target = nearestEnemy(p.x, p.y, 350);
  if (!target){
    const dx = Math.cos(p.facing), dy = Math.sin(p.facing);
    p.dashTime = 0.14;
    p.dashVX = dx * 700; p.dashVY = dy * 700;
    p.invuln = Math.max(p.invuln, 0.10);
    return;
  }
  const dx = target.x - p.x, dy = target.y - p.y;
  const d = Math.hypot(dx, dy) || 1;
  const stopDist = target.r + p.r + 8;
  const tx = target.x - (dx/d) * stopDist;
  const ty = target.y - (dy/d) * stopDist;
  p.dashTime = 0.18;
  p.dashVX = (tx - p.x) / 0.18;
  p.dashVY = (ty - p.y) / 0.18;
  p.invuln = Math.max(p.invuln, 0.25);
  p.facing = Math.atan2(dy, dx);
  for (let i = 0; i < 15; i++){
    const a = rand(0, TAU), s = rand(100, 300);
    particles.push({ x:p.x, y:p.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(0.2,0.5), max:0.5, size:rand(2,5), color:'#5ad7ff', glow:true });
  }
  shake = Math.max(shake, 5);
}

/* ==================== ATTACK ==================== */
function handleAttackPress(){
  const p = player;
  if (!p || p.hp <= 0 || p.blockActive) return;
  if (gameState === 'lobby'){
    const wb = lobby.wardrobe;
    if (Math.hypot(p.x - wb.x, p.y - wb.y) < wb.r + 44){
      wardrobeOpen = true; wardrobeTab = 'head'; wardrobeReturnState = 'lobby';
      resetInput();
      return;
    }
    const mt = lobby.merchant;
    if (Math.hypot(p.x - mt.x, p.y - mt.y) < mt.r + 50){
      shopOpen = true; shopReturnState = 'lobby'; shopScrollY = 0; shopStockOverride = null; shopTitle = 'ТОРГОВЕЦ';
      resetInput();
      return;
    }
    const tr = lobby.trainer;
    if (Math.hypot(p.x - tr.x, p.y - tr.y) < tr.r + 50){
      abilitySelectOpen = true;
      resetInput();
      return;
    }
    const bd = lobby.board;
    if (Math.hypot(p.x - bd.x, p.y - bd.y) < bd.r + 50){
      chronicleOpen = true; resetInput();
      return;
    }
    const fo = lobby.fountain;
    if (Math.hypot(p.x - fo.x, p.y - fo.y) < fo.r + 40){
      if (playerGold < 5){ showToast('НУЖНО 5 ЗОЛОТА'); sfx('deny'); return; }
      playerGold -= 5; sfx('coin');
      const wishes = ['ВОДА ШЕПЧЕТ: «НЕ ДОВЕРЯЙ ЗЕРКАЛАМ»','ВОДА ШЕПЧЕТ: «ОГР БОИТСЯ ОГНЯ»','ВОДА ШЕПЧЕТ: «ТОРГОВЕЦ ЛЮБИТ ДУШИ»','ВОДА ШЕПЧЕТ: «ЧЕМ ГЛУБЖЕ, ТЕМ СЛАЩЕ НАГРАДА»','ВОДА МОЛЧИТ…'];
      if (Math.random() < 0.15){ playerSouls += 3; sfx('soul'); showToast('ИСТОЧНИК ОТВЕТИЛ: +3 ДУШИ'); }
      else showToast(wishes[(Math.random() * wishes.length) | 0]);
      for (let i = 0; i < 14; i++){ const a = rand(0, TAU); particles.push({ x:fo.x, y:fo.y, vx:Math.cos(a)*rand(30,120), vy:Math.sin(a)*rand(30,120) - 40, life:rand(0.4,0.9), max:0.9, size:rand(2,4), color:'#8aeaff', glow:true }); }
      saveProgress();
      return;
    }
    const pt = lobby.portal;
    if (Math.hypot(p.x - pt.x, p.y - pt.y) < pt.r + 44){
      if(mpConnected&&mpRole!=='host'){mpNotice='Ждём, пока хост начнёт этаж';return;} mpSeed=(Math.random()*2147483646|0)+1; mpSend('sync',{payload:{kind:'floorStart',seed:mpSeed,floor:1}}); startLoading('ПОГРУЖЕНИЕ В ПОДЗЕМЕЛЬЕ', () => {enterDungeon();}, 'dungeon', 1);
      return;
    }
  } else if (gameState === 'dungeon'){
    if (portalExit && Math.hypot(p.x - portalExit.x, p.y - portalExit.y) < portalExit.r + 30){
      if(mpConnected&&mpRole!=='host'){mpNotice='Ждём перехода хоста';return;} mpSeed=(Math.random()*2147483646|0)+1; mpSend('sync',{payload:{kind:'floorStart',seed:mpSeed,floor:floor+1}}); startLoading('СПУСК ГЛУБЖЕ', () => nextFloor(), 'dungeon', floor + 1);
      return;
    }
    for (const it of interacts){
      if ((it.kind === 'cursed' || it.kind === 'shade') && it.used) continue;
      if (Math.hypot(p.x - it.x, p.y - it.y) < it.r + p.r + 30){ if (useInteract(it)) return; }
    }
    for (const ch of chests){
      if (!ch.opened && Math.hypot(p.x - ch.x, p.y - ch.y) < ch.r + p.r + 20){
        ch.opened = true;
        const goldGained = 4 + floor * 2 + Math.floor(Math.random() * 6);
        playerGold += goldGained;
        sfx('chest');
        floaters.push({ x: ch.x, y: ch.y - 30, vy: -50, life: 1.2, max: 1.2, text: '+' + goldGained + ' 🪙', color: '#ffd166', size: 16 });
        if (ch.gear){
          const n = ch.tier === 'secret' ? 3 : (ch.tier === 'elite' ? 2 : 1);
          for (let k = 0; k < n; k++){
            dropItemAt(ch.x + (k - (n - 1) / 2) * 34, ch.y - 20, rollGear(rollRarity((ch.tier === 'elite' || ch.tier === 'secret') ? 'elite' : 'boss')));
          }
        } else {
          dropItemAt(ch.x - 14, ch.y - 20, rollConsumable());
          if (Math.random() < 0.5) dropItemAt(ch.x + 14, ch.y - 20, rollConsumable());
        }
        showToast('СУНДУК ОТКРЫТ');
        saveProgress();
        return;
      }
    }
  }
  doAttack();
}

function doAttack(){
  const p = player;
  if (!p || p.hp <= 0 || p.altTime > 0) return;
  if (p.attackTime > p.attackDur * 0.32) return;
  if (isTwoHandedWeapon('L')) return;
  const wm = getWeaponMultForHand('R');
  if (wm.isShield) return;
  const weaponR = getActiveWeaponType('R');
  if (doWeaponStage(weaponR, 0, 'R')) recordComboInput('attack');
}

function doAltAttack(){
  const p = player;
  if (!p || p.hp <= 0 || p.altCd > 0 || p.altTime > 0 || p.blockActive) return;
  if (p.attackTime > p.attackDur * 0.40) return;
  if (isTwoHandedWeapon('R')) return;
  const wm = getWeaponMultForHand('L');
  if (wm.isShield) return;
  const weaponL = getActiveWeaponType('L');
  if (doWeaponStage(weaponL, 0, 'L')) recordComboInput('alt');
}

function doDodge(){
  const p = player;
  if (!p || p.hp <= 0 || p.dashCd > 0) return;
  let dx = input.joy.dx, dy = input.joy.dy;
  let m = Math.hypot(dx, dy);
  if (m < 0.25){ dx = Math.cos(p.facing); dy = Math.sin(p.facing); m = 1; }
  dx /= m; dy /= m;
  p.dashTime = 0.16;
  p.dashVX = dx * 950; p.dashVY = dy * 950;
  p.dashCd = 0.50; p.invuln = Math.max(p.invuln, 0.30);
  p.facing = Math.atan2(dy, dx);
  shake = Math.max(shake, 3);
  recordComboInput('dash');
  sfx('dash');
}

function canMove(x, y){
  if (gameState === 'lobby'){
    if (x < LB.x0 + player.r || x > LB.x1 - player.r || y < LB.y0 + player.r || y > LB.y1 - player.r) return false;
    for (let i = 0; i < LOBBY_SOLIDS.length; i++){ const o = LOBBY_SOLIDS[i]; if (Math.hypot(x - o.x, y - o.y) < o.r + player.r * 0.8) return false; }
    return true;
  }
  if (gameState === 'dungeon'){
    if (playerRoom && isRoomActive(playerRoom)){
      const r = playerRoom.rect;
      if (x < r.x || x > r.x + r.w || y < r.y || y > r.y + r.h) return false;
    }
    return isInsideAnyZone(x, y);
  }
  return true;
}

/* ==================== DAMAGE ==================== */
function hitEnemy(e, dmg, ang, knock, noConc, stunDur, lockDur){
  if(mpConnected&&mpRole!=='host'&&e._mpId){e.hurtFlash=Math.max(e.hurtFlash||0,.12);floaters.push({x:e.x,y:e.y-e.r-10,vy:-45,life:.35,max:.35,text:'УДАР',color:'#ffe7a0',size:11});mpSend('sync',{payload:{kind:'hit',enemyId:e._mpId,playerId:mpClientId,damage:Math.round(dmg),angle:ang,px:player.x,py:player.y,attackTime:player.attackTime||0}});return;}
  if (e.bossKind) dmg = bossDamageMod(e, dmg);
  if (e.type === 'necro' && necroShielded(e)){
    e.shieldFlash = 0.25;
    if (!e._shMsg || elapsed - e._shMsg > 0.8){
      e._shMsg = elapsed; sfx('necroShield');
      floaters.push({ x:e.x, y:e.y-e.r-14, vy:-50, life:0.9, max:0.9, text:'НЕУЯЗВИМ', color:'#d8a0ff', size:13 });
    }
    return;
  }
  if (e.type === 'ogre') dmg *= 0.65;
  if (e.type === 'doppel' && (e.guard || 0) > 0){
    dmg *= 0.15; e.riposte = true; sfx('doppelGuard');
    floaters.push({ x:e.x, y:e.y-e.r-30, vy:-50, life:0.8, max:0.8, text:'БЛОК', color:'#9ffcff', size:13 });
  }
  e.hp -= dmg;
  e.hurtFlash = 0.13;
  const tank = e.isBoss || e.type === 'ogre';
  const baseStun = tank ? 0 : 0.18;
  e.stun = Math.max(e.stun || 0, baseStun + (stunDur || 0) * (tank ? 0.3 : 1));
  if (e.type === 'ogre') knock *= 0.2; else if (e.isBoss) knock *= 0.3;
  if (lockDur && lockDur > 0){
    e.attackLock = Math.max(e.attackLock || 0, lockDur);
  }
  e.vx += Math.cos(ang)*knock; e.vy += Math.sin(ang)*knock;
  for (let i = 0; i < 7; i++){
    const a = ang + rand(-1.0, 1.0);
    particles.push({ x:e.x, y:e.y, vx:Math.cos(a)*rand(70,280), vy:Math.sin(a)*rand(70,280), life:rand(0.18,0.42), max:0.42, size:rand(2,5), color:'#ff4d6d', glow:true });
  }
  if (stunDur) floaters.push({ x:e.x+rand(-6,6), y:e.y-e.r-24, vy:-55, life:0.8, max:0.8, text:'СТАН', color:'#7bff8a', size:13 });
  if (lockDur) floaters.push({ x:e.x+rand(-6,6), y:e.y-e.r-24, vy:-55, life:0.8, max:0.8, text:'LOCK', color:'#b04bff', size:13 });
  floaters.push({ x:e.x+rand(-6,6), y:e.y-e.r-6, vy:-55, life:0.65, max:0.65, text:Math.round(dmg), color:'#ffffff', size:15 });
  hitStop = Math.max(hitStop, 0.045);
  shake = Math.max(shake, 5);
  sfxHitFor(e);
  if (!noConc) addConc(e.isBoss ? 4 : 2);
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e){
  e.hp = 0;
  stats.kills++; if (e.type === 'doppel') stats.secrets++; else if (e.isBoss) stats.bosses++;
  const level = getConcLevel();
  const gain = Math.round(e.score * (1 + level * 0.15));
  score += gain;
  floaters.push({ x:e.x, y:e.y-e.r-18, vy:-70, life:1.0, max:1.0, text:'+'+gain, color:'#ffd166', size:e.isBoss ? 24 : 17 });
  for (let i = 0; i < (e.isBoss ? 50 : 20); i++){
    const a = rand(0, TAU), s = rand(70, e.isBoss ? 600 : 400);
    particles.push({ x:e.x, y:e.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(0.30,0.9), max:0.9, size:rand(2,e.isBoss ? 10 : 6), color: Math.random() < 0.5 ? '#ff2b45' : '#ffd166', glow:true });
  }
  shake = Math.max(shake, e.isBoss ? 20 : 9);
  hitStop = Math.max(hitStop, e.isBoss ? 0.2 : 0.07);
  sfxKillFor(e);
  addConc(e.isBoss ? 30 : 6);
  if (e.type === 'necro'){
    for (const m of enemies) if (m.owner === e && m.hp > 0){ m.hp = 0; for (let k = 0; k < 8; k++){ const a = rand(0, TAU); particles.push({ x:m.x, y:m.y, vx:Math.cos(a)*rand(40,200), vy:Math.sin(a)*rand(40,200), life:rand(0.3,0.6), max:0.6, size:rand(2,5), color:'#d8d0b8', glow:true }); } }
  }
  let soulGain = 0;
  if (e.secret) soulGain = 50 + Math.floor(Math.random() * 30);
  else if (e.isElite) soulGain = 40 + Math.floor(Math.random() * 40);
  else if (e.isBoss) soulGain = 15 + Math.floor(Math.random() * 15);
  else if (e.type === 'brute' || e.type === 'ogre' || e.type === 'necro') soulGain = 3 + Math.floor(Math.random() * 3);
  else soulGain = 1 + Math.floor(Math.random() * 2);
  if (e.noLoot) soulGain = 0;
  if (soulGain > 0){
    soulOrbs.push({
      x: e.x, y: e.y, vx: rand(-50, 50), vy: -100 - Math.random()*80,
      value: soulGain, t: 0, life: 14
    });
  }
  if (e.secret){
    spawnBossChest(e.homeRoom, 'secret');
    const goldDrop = 60 + floor * 8 + Math.floor(Math.random() * 20);
    playerGold += goldDrop;
    sfx('coin');
    floaters.push({ x: e.x, y: e.y - 30, vy: -80, life: 1.4, max: 1.4, text: '+' + goldDrop + ' 🪙', color: '#ffd166', size: 18 });
    finishSecretRoom(e);
  } else if (e.isElite){
    spawnBossChest(e.homeRoom, 'elite');
    const goldDrop = 40 + floor * 5 + Math.floor(Math.random() * 15);
    playerGold += goldDrop;
    sfx('coin');
    floaters.push({ x: e.x, y: e.y - 30, vy: -80, life: 1.4, max: 1.4, text: '+' + goldDrop + ' 🪙', color: '#ffd166', size: 18 });
    finishBossRoom(e);
  } else if (e.isBoss){
    spawnBossChest(e.homeRoom, 'boss');
    const goldDrop = 15 + floor * 4 + Math.floor(Math.random() * 8);
    playerGold += goldDrop;
    sfx('coin');
    floaters.push({ x: e.x, y: e.y - 30, vy: -80, life: 1.4, max: 1.4, text: '+' + goldDrop + ' 🪙', color: '#ffd166', size: 18 });
    finishBossRoom(e);
  } else if (!e.noLoot){
    if (Math.random() < ((e.type === 'ogre' || e.type === 'necro') ? 0.35 : 0.12)) dropItemAt(e.x, e.y, rollConsumable());
    if (Math.random() < 0.30){
      const gg = 1 + Math.floor(Math.random() * 2);
      playerGold += gg;
      floaters.push({ x: e.x, y: e.y - 8, vy: -60, life: 0.9, max: 0.9, text: '+' + gg + ' 🪙', color: '#ffd166', size: 13 });
    }
  }
  saveProgress();
}

function damagePlayer(dmg, nx, ny){
  const p = player;
  if (p.hp <= 0) return;
  if (p.parryTime > 0){
    p.parryTime = 0;
    p.invuln = Math.max(p.invuln, 0.5);
    for (const e of enemies){
      if (e.hp <= 0 || e.spawnTime > 0) continue;
      const d = Math.hypot(e.x - p.x, e.y - p.y);
      if (d < 140){
        const ang = Math.atan2(e.y - p.y, e.x - p.x);
        hitEnemy(e, Math.round(dmg * 2), ang, 600, true);
      }
    }
    showToast('ПАРИРОВАНИЕ!'); sfx('parry');
    screenFlash = Math.max(screenFlash, 0.25);
    flashColor = '#ffd166';
    shake = Math.max(shake, 12);
    hitStop = Math.max(hitStop, 0.08);
    return;
  }
  if (p.invuln > 0) return;
  const def = getTotalDefense();
  let finalDmg = dmg * (100 / (100 + def));
  const shield = getShieldStats();
  if (p.blockActive && shield && p.blockCd <= 0){
    finalDmg *= (1 - shield.block);
    p.blockCd = 1.2;
    showToast('БЛОК'); sfx('block');
    screenFlash = Math.max(screenFlash, 0.1);
    flashColor = '#ffd166';
  }
  finalDmg = Math.max(1, Math.round(finalDmg));
  p.hp = Math.max(0, p.hp - finalDmg);
  p.invuln = 0.75; p.hurtFlash = 0.25;
  sfx('hurt');
  const nxp = p.x + nx*12, nyp = p.y + ny*12;
  if (canMove(nxp, p.y)) p.x = nxp;
  if (canMove(p.x, nyp)) p.y = nyp;
  resetConc();
  comboBuffer.length = 0;
  shake = Math.max(shake, 11); hitStop = Math.max(hitStop, 0.06);
  floaters.push({ x:p.x, y:p.y-20, vy:-50, life:0.8, max:0.8, text:'-' + finalDmg, color:'#ff2b45', size:14 });
  if (p.hp <= 0){
    if(mpConnected){p.hp=0;mpDowned=true;mpDownedTimer=25;gameState='downed';showToast('ПОВАЛЕН — союзник может воскресить');mpSend('sync',{payload:{kind:'player',player:mpPlayerSnapshot()}});return;}
    gameState = 'gameover'; gameOverTimer = 0; shake = 22; stats.deaths++;
    sfx('death');
    gameOverGoldGained = 0;
    saveProgress();
    for (let i = 0; i < 45; i++){
      const a = rand(0, TAU), s = rand(90, 520);
      particles.push({ x:p.x, y:p.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(0.4,1.1), max:1.1, size:rand(2,7), color:'#ff2b45', glow:true });
    }
  }
}

/* ==================== COMBO ==================== */
function recordComboInput(type){
  if (!player || player.hp <= 0) return;
  if (elapsed - lastInputTime > COMBO_TRIM){ comboBuffer.length = 0; }
  lastInputTime = elapsed;
  comboBuffer.push({ type, t: elapsed });
  if (comboBuffer.length > 20) comboBuffer.shift();
  checkComboMatch();
}

function checkComboMatch(){
  const sorted = [...COMBO_LIST].sort((a, b) => b.seq.length - a.seq.length);
  for (const combo of sorted){
    if (!canCombo(combo)) continue;
    const n = combo.seq.length;
    if (comboBuffer.length < n) continue;
    const start = comboBuffer.length - n;
    let ok = true;
    for (let i = 0; i < n; i++){
      const step = combo.seq[i];
      const inp = comboBuffer[start + i];
      if (inp.type !== step.type){ ok = false; break; }
      if (i > 0){
        const gap = inp.t - comboBuffer[start + i - 1].t;
        if (step.maxDelay && gap > step.maxDelay){ ok = false; break; }
        if (step.minDelay && gap < step.minDelay){ ok = false; break; }
      }
    }
    if (ok){
      comboBuffer.splice(start, n);
      if (combo.concSpend === 'all') resetConc();
      else if (combo.concSpend > 0) payConcLevels(combo.concSpend);
      triggerCombo(combo);
      break;
    }
  }
}

function triggerCombo(combo){

  const effects = combo.effects || [];
  const hasVisual = effects.length > 0 || (combo.bonusDamage || 0) > 0;
  for (const effect of effects) applyComboEffect(effect, combo, mult, !combo.concGain);
  if (hasVisual){
    const color = combo.color;
    const maxR = effects.reduce((mx, e) => Math.max(mx, (e.radius || e.range || e.length || 140) * (wm.rangeMult || 1)), 140);

      if (effect.type === 'line') slashes.push({ x:p.x, y:p.y, a:p.facing, t:0, dur:0.45, combo:-2, lineLength: (effect.length||320)*(wm.rangeMult||1), lineWidth: effect.width||40, lineColor: color });

    floaters.push({ x:p.x + rand(-10,10), y:p.y - 52, vy:-40, life:1.2, max:1.2, text:combo.name, color:combo.color, size:17 });
  }
}

function applyComboEffect(effect, combo, mult, noConc){
  const p = player;
  const wm = getWeaponMult();
  const dmg = Math.round(combo.bonusDamage * mult);
  if (effect.type === 'cone'){
    const arc = effect.arc || 2.0, range = (effect.range || 140) * (wm.rangeMult || 1);
    for (const e of enemies){
      if (e.hp <= 0 || e.spawnTime > 0) continue;
      const dx = e.x - p.x, dy = e.y - p.y;
      const d = Math.hypot(dx, dy) || 1;
      if (d > range + e.r) continue;
      const a = Math.atan2(dy, dx);
      if (Math.abs(angleDiff(a, p.facing)) > arc/2) continue;
      hitEnemy(e, dmg, a, effect.knock || 500, noConc);
    }
    if (gameState === 'lobby'){
      const d = lobby.dummy;
      const dx = d.x - p.x, dy = d.y - p.y;
      const dist = Math.hypot(dx, dy) || 1;
      if (dist < range + d.r){
        const a = Math.atan2(dy, dx);
        if (Math.abs(angleDiff(a, p.facing)) <= arc/2) hitDummy(dmg, a, effect.knock || 500);
      }
    }
  } else if (effect.type === 'aoe'){
    const radius = (effect.radius || 140) * (wm.rangeMult || 1);
    for (const e of enemies){
      if (e.hp <= 0 || e.spawnTime > 0) continue;
      if (Math.hypot(e.x - p.x, e.y - p.y) < radius + e.r){
        const ang = Math.atan2(e.y - p.y, e.x - p.x);
        hitEnemy(e, dmg, ang, effect.knock || 500, noConc);
      }
    }
    if (gameState === 'lobby'){
      const d = lobby.dummy;
      if (Math.hypot(d.x - p.x, d.y - p.y) < radius + d.r) hitDummy(dmg, 0, 0);
    }
  } else if (effect.type === 'line'){
    const length = (effect.length || 320) * (wm.rangeMult || 1), width = effect.width || 40;
    const dirX = Math.cos(p.facing), dirY = Math.sin(p.facing);
    for (const e of enemies){
      if (e.hp <= 0 || e.spawnTime > 0) continue;
      const dx = e.x - p.x, dy = e.y - p.y;
      const proj = dx * dirX + dy * dirY;
      if (proj < 0 || proj > length) continue;
      const perp = Math.abs(-dx * dirY + dy * dirX);
      if (perp > width + e.r) continue;
      hitEnemy(e, dmg, p.facing, effect.knock || 700, noConc);
    }
    if (gameState === 'lobby'){
      const d = lobby.dummy;
      const dx = d.x - p.x, dy = d.y - p.y;
      const proj = dx * dirX + dy * dirY;
      const perp = Math.abs(-dx * dirY + dy * dirX);
      if (proj >= 0 && proj <= length && perp <= width + d.r) hitDummy(dmg, p.facing, effect.knock || 700);
    }
  }
}

function nearestEnemy(x, y, maxD){
  let best = null, bd = maxD;
  for (const e of enemies){
    if (e.hp <= 0 || e.spawnTime > 0) continue;
    const d = Math.hypot(e.x-x, e.y-y);
    if (d < bd){ bd = d; best = e; }
  }
  return best;
}

function updatePlayer(dt){
  const p = player;
  if (!p || p.hp <= 0) return;
  p.altCd = Math.max(0, p.altCd - dt);
  p.altTime = Math.max(0, p.altTime - dt);
  p.blockCd = Math.max(0, p.blockCd - dt);
  if (p.dmgBuffTimer > 0){ p.dmgBuffTimer -= dt; if (p.dmgBuffTimer <= 0) p.dmgBuff = 0; }
  if (p.defBuffTimer > 0){ p.defBuffTimer -= dt; if (p.defBuffTimer <= 0) p.defBuff = 0; }
  for (let i = 0; i < 4; i++) p.quickCd[i] = Math.max(0, p.quickCd[i] - dt);

  if (p.healTimer > 0){
    p.healTimer -= dt;
    p.hp = Math.min(p.maxHp, p.hp + p.healRate * dt);
    if (p.healTimer <= 0) p.healRate = 0;
  }
  if (p.rageTimer > 0){
    p.rageTimer -= dt;
    if (p.rageTimer <= 0){ p.speedBuff = 0; p.speedBuffTimer = 0; }
  }
  if (p.speedBuffTimer > 0){
    p.speedBuffTimer -= dt;
    if (p.speedBuffTimer <= 0) p.speedBuff = 0;
  }
  if ((p.slowT || 0) > 0){ p.slowT -= dt; if (Math.random() < 0.3) particles.push({ x:p.x + rand(-10,10), y:p.y + rand(-10,10), vx:0, vy:-20, life:0.4, max:0.4, size:3, color:'#8ad8ff', glow:true }); }
  if (p.parryTime > 0) p.parryTime = Math.max(0, p.parryTime - dt);
  if (p.ghostTimer > 0){
    p.ghostTimer -= dt;
    if (p.ghostTimer <= 0) p.ghostBuff = false;
  }

  updateChain(dt);

  const shield = getShieldStats();
  const wmR = getWeaponMultForHand('R');
  const wmL = getWeaponMultForHand('L');
  const canBlock = !!(wmR.isShield || wmL.isShield || shield);
  p.blockActive = input.block.down && canBlock && p.blockCd <= 0 && p.altTime <= 0;

  if (p.altTime > 0){
    p.attackTime = Math.max(0, p.attackTime - dt);
    p.dashCd = Math.max(0, p.dashCd - dt);
    p.invuln = Math.max(0, p.invuln - dt);
    p.hurtFlash = Math.max(0, p.hurtFlash - dt);
    return;
  }
  let ix = 0, iy = 0;
  if (input.joy.active){ ix = input.joy.dx; iy = input.joy.dy; }
  if (keys['a'] || keys['arrowleft'])  ix -= 1;
  if (keys['d'] || keys['arrowright']) ix += 1;
  if (keys['w'] || keys['arrowup'])    iy -= 1;
  if (keys['s'] || keys['arrowdown'])  iy += 1;
  let mag = Math.hypot(ix, iy);
  if (mag > 1){ ix /= mag; iy /= mag; mag = 1; }
  const moving = mag > 0.2;
  if (moving && p.attackTime <= 0 && p.dashTime <= 0 && !p.blockActive) p.facing = Math.atan2(iy, ix);

  let speedMult = 1;
  if (wmR.isShield && wmR.shieldBlock) speedMult *= 0.85;
  if (wmL.isShield && wmL.shieldBlock) speedMult *= 0.85;
  if (shield) speedMult *= (1 - shield.slow);
  if (p.blockActive) speedMult *= 0.5;
  if (playerInventory.equipment.boots && playerInventory.equipment.boots.templateKey === 'boots_swift') speedMult *= 1.15;

  if (p.dashTime > 0){
    p.dashTime -= dt;
    const nx = p.x + p.dashVX * dt;
    const ny = p.y + p.dashVY * dt;
    if (canMove(nx, p.y)) p.x = nx;
    if (canMove(p.x, ny)) p.y = ny;
    if (Math.random() < 0.75){
      particles.push({ x:p.x, y:p.y, vx:0, vy:0, life:0.22, max:0.22, size:13, color: getWeaponMult().glow, glow:true, ghost:true });
    }
  } else {
    const sp = p.speed * (p.attackTime > 0 ? 0.3 : 1) * speedMult * (1 + (p.speedBuff || 0) + (p.relicSpeed || 0)) * ((p.slowT || 0) > 0 ? 0.55 : 1);
    const nx = p.x + ix * sp * dt;
    const ny = p.y + iy * sp * dt;
    if (canMove(nx, p.y)) p.x = nx;
    if (canMove(p.x, ny)) p.y = ny;
  }
  p.attackTime = Math.max(0, p.attackTime - dt);
  p.comboTimer = Math.max(0, p.comboTimer - dt);
  if (p.comboTimer <= 0) p.atkCombo = 0;
  if (moving && p.dashTime <= 0){ p._stepT = (p._stepT || 0) + dt; if (p._stepT > 0.34){ p._stepT = 0; sfx(gameState === 'lobby' ? 'stepStone' : 'step'); } } else p._stepT = 0.2;
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.invuln = Math.max(0, p.invuln - dt);
  p.hurtFlash = Math.max(0, p.hurtFlash - dt);

  if (p.attackTime > 0){
    const activeHand = p.currentHand || 'R';
    const wm = getWeaponMultForHand(activeHand);
    if (wm.isShield) return;
    const weaponType = getActiveWeaponType(activeHand);
    const baseCfg = getWeaponStageConfig(weaponType, p.atkCombo);
    const cfg = {
      dmg: baseCfg.dmg * wm.dmgMult * (1 + p.dmgBuff + (p.relicDmg || 0)),
      range: baseCfg.range * wm.rangeMult,
      arc: baseCfg.arc, knock: baseCfg.knock,
      stun: baseCfg.stun, lock: baseCfg.lock
    };
    const prog = 1 - p.attackTime / p.attackDur;
    if (prog > 0.12 && prog < 0.74){
      const attackMult = p.nextAttackMult || 1;
      let anyHit = false;
      for (const e of enemies){
        if (e.hp <= 0 || e.spawnTime > 0 || p.hitSet.has(e)) continue;
        const dx = e.x - p.x, dy = e.y - p.y;
        const d = Math.hypot(dx, dy) || 1;
        if (d > cfg.range + e.r) continue;
        const a = Math.atan2(dy, dx);
        if (Math.abs(angleDiff(a, p.facing)) > cfg.arc/2) continue;
        p.hitSet.add(e);
        hitEnemy(e, Math.round(cfg.dmg * BASE_STATS.damageMult * attackMult), a, cfg.knock, false, cfg.stun, cfg.lock);
        anyHit = true;
      }
      if (anyHit && p.nextAttackMult > 1) p.nextAttackMult = 1;
      if (gameState === 'lobby' && !p.hitSet.has(lobby.dummy)){
        const d = lobby.dummy;
        const dx = d.x - p.x, dy = d.y - p.y;
        const dist = Math.hypot(dx, dy) || 1;
        if (dist < cfg.range + d.r){
          const a = Math.atan2(dy, dx);
          if (Math.abs(angleDiff(a, p.facing)) <= cfg.arc/2){
            p.hitSet.add(lobby.dummy);
            hitDummy(Math.round(cfg.dmg * BASE_STATS.damageMult * attackMult), a, cfg.knock);
            if (p.nextAttackMult > 1) p.nextAttackMult = 1;
          }
        }
      }
    }
  }
}

/* ==================== НОВЫЕ ВРАГИ: УРОДЕЦ, ПРИЗЫВАТЕЛЬ, СКЕЛЕТЫ, ДВОЙНИК ==================== */
function invHex(c){
  if (!c || typeof c !== 'string' || c[0] !== '#') return c;
  let h = c.slice(1);
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if (h.length !== 6) return c;
  const n = parseInt(h, 16);
  const v = ((255 - ((n >> 16) & 255)) << 16) | ((255 - ((n >> 8) & 255)) << 8) | (255 - (n & 255));
  return '#' + v.toString(16).padStart(6, '0');
}
/* Руки человечка (игрок и Двойник). Левая рука остаётся со своей стороны и не уходит за линию плеч. */
function drawHumanArms(ox, oy, fa, swordAngle, swing, twoH, cloakCol, skinCol, outCol){
  const fc = Math.cos(fa), fs = Math.sin(fa);
  const shR = [ox - fs*10.5 + fc, oy + fc*10.5 + fs];
  const shL = [ox + fs*10.5 + fc, oy - fc*10.5 + fs];
  const handR = [ox + Math.cos(swordAngle)*15, oy + Math.sin(swordAngle)*15];
  let handL;
  if (twoH){
    const a = swordAngle - 0.3;
    handL = [ox + Math.cos(a)*15, oy + Math.sin(a)*15];
  } else {
    const a = fa - 1.05 + clamp(swing, -1, 1) * 0.22;
    handL = [ox + Math.cos(a)*13, oy + Math.sin(a)*13];
  }
  const elbowOf = (sh, hn) => {
    const dx = hn[0]-sh[0], dy = hn[1]-sh[1];
    const mx = (sh[0]+hn[0])/2, my = (sh[1]+hn[1])/2;
    let px = -dy, py = dx;
    const LL = Math.hypot(px,py) || 1;
    px/=LL; py/=LL;
    if (px*(mx-ox)+py*(my-oy) < 0){ px=-px; py=-py; }
    return [mx+px*7, my+py*7];
  };
  const drawArm = (sh, hn) => {
    const el = elbowOf(sh, hn);
    ctx.lineCap = 'round';
    ctx.strokeStyle = outCol; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(sh[0],sh[1]); ctx.lineTo(el[0],el[1]); ctx.lineTo(hn[0],hn[1]); ctx.stroke();
    ctx.strokeStyle = cloakCol; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(sh[0],sh[1]); ctx.lineTo(el[0],el[1]); ctx.stroke();
    ctx.strokeStyle = skinCol; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(el[0],el[1]); ctx.lineTo(hn[0],hn[1]); ctx.stroke();
    ctx.fillStyle = skinCol;
    ctx.beginPath(); ctx.arc(hn[0],hn[1],3.6,0,TAU); ctx.fill();
    ctx.strokeStyle = outCol; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(hn[0],hn[1],3.6,0,TAU); ctx.stroke();
  };
  drawArm(shR, handR);
  drawArm(shL, handL);
  return { handR, handL, shL };
}

/* ----- Призыватель: неуязвим, пока на арене есть кто-то кроме него и его слуг ----- */
function necroShielded(e){
  if (!e.homeRoom) return false;
  for (const m of enemies){
    if (m === e || m.hp <= 0 || m.owner === e || m.homeRoom !== e.homeRoom) continue;
    return true;
  }

}
function necroRaisePlan(e){

    e.raiseSpots.push([e.x + Math.cos(a) * dd, e.y + Math.sin(a) * dd]);

/* ----- Двойник: секретный босс (зеркальный негатив игрока) ----- */
function spawnDoppel(room){
  const mult = getFloorMult();
  const hp = 640 * mult.hp;
  const e = {
    type: 'doppel', secret: true, isBoss: true, bossName: 'ДВОЙНИК',
    x: room.rect.x + room.rect.w/2, y: room.rect.y + room.rect.h * 0.3,
    vx:0, vy:0, r: player.r || 16, hp, maxHp: hp,
    speed: 165 * mult.speed, dmg: Math.round(20 * mult.dmg),
    atkCd: 0.9, attackCd: 1.3, score: Math.round(4000 * mult.score),
    color: '#d8f0ff', glow: '#9ffcff',
    hurtFlash:0, stun:0, attackLock: 0, spawnTime: 1.0, wobble: 0, animPhase: 0, homeRoom: room,
    face: Math.PI/2, guard: 0, leg: 0, walkT: 0
  };
  enemies.push(e);
  currentBoss = e;
  showToast('ДВОЙНИК — он дерётся так же, как ты'); sfx('bossIntro');
}
function doppelTick(e, dt){
  if (e.guard > 0) e.guard = Math.max(0, e.guard - dt);
  if (e.slashT > 0) e.slashT = Math.max(0, e.slashT - dt);
  if (e._lx === undefined){ e._lx = e.x; e._ly = e.y; }
  const moved = Math.hypot(e.x - e._lx, e.y - e._ly);
  e._lx = e.x; e._ly = e.y;
  e.walkT += moved * 0.13;
  e.leg = moved > 0.4 ? Math.sin(e.walkT) : 0;
  let tgt;
  if (e.state === 'dash') tgt = e.dashAng;
  else if (e.state === 'windup') tgt = e.aimAng;
  else tgt = Math.atan2(player.y - e.y, player.x - e.x);
  e.face += angleDiff(tgt, e.face) * Math.min(1, dt * (e.state === 'idle' ? 12 : 30));
  if (e.riposte){
    e.riposte = false;
    if (e.state !== 'dash'){
      e.guard = 0; e.chain = 0; e.counter = true; e.after = null;
      startWindup(e, 'dslash', 0.16);
    }
  }
}
function doppelIdle(e, ph, d, dx, dy, spd, dt){
  const p = player;
  const ang = Math.atan2(dy, dx);
  const want = e.r + p.r + 38;
  if (e.guard > 0){
    const perp = ang + (Math.sin(e.wobble + elapsed * 1.7) > 0 ? 1 : -1) * Math.PI/2;
    e.x += Math.cos(perp) * spd * 0.3 * dt; e.y += Math.sin(perp) * spd * 0.3 * dt;
    return;
  }
  if (d > want + 8){ e.x += Math.cos(ang) * spd * dt; e.y += Math.sin(ang) * spd * dt; }
  else if (d < want - 14){ e.x -= Math.cos(ang) * spd * 0.6 * dt; e.y -= Math.sin(ang) * spd * 0.6 * dt; }
  else {
    const perp = ang + Math.PI/2, dir = Math.sin(e.wobble + elapsed * 1.3) > 0 ? 1 : -1;
    e.x += Math.cos(perp) * spd * 0.45 * dt * dir; e.y += Math.sin(perp) * spd * 0.45 * dt * dir;
  }
  if (e.attackCd <= 0 && (e.attackLock || 0) <= 0 && p.hp > 0){
    const r = Math.random();
    if (d < 125){
      if (r < 0.45){ e.chain = ph >= 2 ? 2 : 1; e.counter = false; startWindup(e, 'dslash', 0.34); }
      else if (r < 0.72){ startWindup(e, 'whirl', 0.6); }
      else { e.guard = 1.0; e.attackCd = 0.7; }
    } else if (d < 340 && r < 0.7){
      e.after = ph >= 3 ? 'whirl' : null;
      startWindup(e, 'dstrike', 0.5);
    }
  }
}
function doppelResolve(e, ph, d){
  const p = player;
  if (e.tele === 'dslash'){
    sfx('doppelSlash');
    const toP = Math.atan2(p.y - e.y, p.x - e.x);
    if (d < e.r + p.r + 66 && Math.abs(angleDiff(e.aimAng, toP)) < 0.75) enemyAttackHit(e, Math.round(e.dmg * (e.counter ? 1.4 : 1)));
    e.slashT = 0.18; e.slashK = 'arc';
    e.vx += Math.cos(e.aimAng) * 260; e.vy += Math.sin(e.aimAng) * 260;
    if ((e.chain || 0) > 0){
      e.chain--; e.state = 'windup'; e.stateT = 0; e.windDur = 0.26; e.tele = 'dslash';
      telegraphAngles(e); sfx('telegraph');
    } else { e.counter = false; endAtk(e, 0.45, e.atkCd); }
    return true;
  }
  if (e.tele === 'dstrike'){
    sfx('charge'); e.dashAng = e.aimAng; e.dashT = 0.45; e.hitDone = false; e.state = 'dash';
    return true;
  }
  if (e.tele === 'whirl'){
    sfx('doppelWhirl'); shake = Math.max(shake, 12);
    for (let k = 0; k < 22; k++){
      const a = k / 22 * TAU;
      particles.push({ x: e.x + Math.cos(a)*30, y: e.y + Math.sin(a)*30, vx: Math.cos(a)*rand(180, 340), vy: Math.sin(a)*rand(180, 340), life: rand(0.25, 0.5), max: 0.5, size: rand(3, 6), color: '#9ffcff', glow: true });
    }
    if (d < 118 + p.r) enemyAttackHit(e, Math.round(e.dmg * 1.15));
    e.slashT = 0.25; e.slashK = 'ring';
    endAtk(e, 0.55, e.atkCd);
    return true;
  }
  return false;
}
