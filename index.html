    const row = Math.floor(i / L.cols);
    const cx = L.startX + col * (L.cardW + L.gap);
    const cy = L.startY + row * (L.cardH + L.gap);
    const selected = currentAbility === key;
    ctx.fillStyle = selected ? 'rgba(90,58,138,0.65)' : 'rgba(20,10,25,0.85)';
    rr(cx, cy, L.cardW, L.cardH, 8); ctx.fill();

    ctx.lineWidth = selected ? 3 : 1.5;

    if (selected){
      ctx.fillStyle = '#b04bff';
      ctx.font = 'bold 18px system-ui';

    for (let pi = 0; pi < ABILITY_MAX_LV; pi++){
      ctx.fillStyle = pi < lv ? '#ffd166' : 'rgba(255,255,255,0.15)';

  const cb = { x: W/2 - 80, y: H - 50, w: 160, h: 36 };

  rr(cb.x, cb.y, cb.w, cb.h, 8); ctx.fill();

  ctx.font = 'bold 14px system-ui';

function handleAbilitySelectTap(x, y){
  const cb = { x: W/2 - 80, y: H - 50, w: 160, h: 36 };
  if (x >= cb.x && x <= cb.x + cb.w && y >= cb.y && y <= cb.y + cb.h){
    abilitySelectOpen = false;
    saveProgress();
    resetInput();
    return;
  }
  const L = getAbilitySelectLayout();
  for (let i = 0; i < L.keys.length; i++){
    const key = L.keys[i];
    const col = i % L.cols;
    const row = Math.floor(i / L.cols);
    const cx = L.startX + col * (L.cardW + L.gap);
    const cy = L.startY + row * (L.cardH + L.gap);
    if (x >= cx && x <= cx + L.cardW && y >= cy && y <= cy + L.cardH){
      const ub = abilityUpgradeBtn(cx, cy, L.cardW, L.cardH);
      if (x >= ub.x - 8 && x <= ub.x + ub.w + 8 && y >= ub.y - 8 && y <= ub.y + ub.h + 8){
        const lv = abilityLevels[key] || 0;
        if (lv >= ABILITY_MAX_LV){ showToast('МАКСИМАЛЬНЫЙ УРОВЕНЬ'); return; }
        const cost = abilityUpCost(lv);
        if (playerSouls < cost){ showToast('НУЖНО ДУШ: ' + cost + ' (есть ' + playerSouls + ')'); return; }
        playerSouls -= cost;
        abilityLevels[key] = lv + 1;
        sfx('levelup');
        showToast(ABILITY_TYPES[key].name + ' → УР. ' + (lv + 1));
        saveProgress();
        return;
      }
      currentAbility = key;
      abilityCd = 0;
      showToast('СПОСОБНОСТЬ: ' + ABILITY_TYPES[key].name);
      saveProgress();
      return;
    }
  }
}

function drawToastUI(){
  /* Без чёрной плашки: тихий текст с тонкой обводкой, плавно появляется и гаснет */
  const age = 1.6 - toast.t;
  const al = clamp(Math.min(toast.t * 2.5, age * 5), 0, 1) * 0.85;
  if (al <= 0) return;
  ctx.save();
  ctx.globalAlpha = al;
  let fs = 13;
  ctx.font = `600 ${fs}px system-ui`;
  const tw = ctx.measureText(toast.text).width;
  if (tw > W - 24){ fs = Math.max(9, Math.floor(fs * (W - 24) / tw)); ctx.font = `600 ${fs}px system-ui`; }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  const y = H * 0.27 - (1 - al) * 6;
  ctx.strokeStyle = 'rgba(8,4,14,0.9)'; ctx.lineWidth = 3.5;
  ctx.strokeText(toast.text, W/2, y);
  ctx.fillStyle = '#e8d9b0';
  ctx.fillText(toast.text, W/2, y);
  ctx.restore();
}

function handleLobbyTap(x, y, e){

  if(mpConnected&&Math.hypot(x-(W-64),y-128)<27){mpTryRevive();return;}
  const pb = getPauseBtn();
  if (inCircle(x, y, pb)){ paused = true; resetInput(); return; }
  const ib = getInventoryBtn();
  if (inCircle(x, y, ib)){ inventoryOpen = true; playerInventory.selectedSlot = null; resetInput(); return; }
  if (tryQuickSlotHUDTap(x, y)) return;
  const b = getButtons();
  if (inCircle(x, y, b.attack)){
    if (b.attack.disabled) return;
    if (b.attack.isShield){ input.block.down = true; input.block.id = e.pointerId; }
    else { input.attack.down = true; input.attack.id = e.pointerId; handleAttackPress(); }
    return;
  }
  if (inCircle(x, y, b.ability)){
    activateAbility();
    return;
  }
  if (inCircle(x, y, b.alt)){
    if (b.alt.disabled) return;
    if (b.alt.isShield){ input.block.down = true; input.block.id = e.pointerId; }
    else { input.alt.down = true; input.alt.id = e.pointerId; doAltAttack(); }
    return;
  }
  if (!input.joy.active) startJoy(x, y, e);
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (!isLandscape()) return;
  if (gameState === 'loading') return;
  const x = e.clientX, y = e.clientY;
  if (gameState === 'hudedit'){ handleHudEditDown(e); return; }
  if (gameState === 'settings'){ handleSettingsTap(x, y, e); return; }
  if (chronicleOpen){ chronicleOpen = false; resetInput(); return; }
  if (abilitySelectOpen){ handleAbilitySelectTap(x, y); return; }
  if (shopOpen){ shopDrag = { id: e.pointerId, startY: y, startScroll: shopScrollY, moved: false }; try { canvas.setPointerCapture(e.pointerId); } catch(_){} return; }
  if (forgeOpen){ handleForgeTap(x, y); return; }
  if (altarOpen){ handleAltarTap(x, y); return; }
  if (wardrobeOpen){ wardrobeDrag = { id: e.pointerId, startY: y, startScroll: wardrobeScroll, moved: false }; try { canvas.setPointerCapture(e.pointerId); } catch(_){} return; }
  if (inventoryOpen){ handleInventoryTap(x, y); return; }
  if (paused){ handlePauseTap(x, y); return; }
  if (gameState === 'menu' || gameState === 'multiplayer'){ handleMenuTap(x, y); return; }
  if (gameState === 'combos'){
    const cb = { x: W/2 - 75, y: H - 40, w: 150, h: 32 };
    if (inRect(x, y, cb)){
      if (combosReturnState === 'menu' || !player) gameState = 'menu';
      else gameState = combosReturnState;
    }
    return;
  }
  if (gameState === 'downed'){ if(mpConnected&&Math.hypot(x-(W-64),y-128)<27)mpTryRevive(); else if(mpConnected&&Math.hypot(x-(W-64),y-72)<27)mpTradeStart(); return; }
  if (gameState === 'gameover'){ if (gameOverTimer > 0.8) enterLobby(); return; }
  if(!IS_ANDROID&&e.pointerType==='mouse'&&(gameState==='lobby'||gameState==='dungeon')){if(e.button===0){input.attack.down=true;input.attack.id=e.pointerId;handleAttackPress();}else if(e.button===2){input.alt.down=true;input.alt.id=e.pointerId;doAltAttack();}else handleDungeonTap(x,y,e);}
  else if (gameState === 'lobby') handleLobbyTap(x, y, e);
  else if (gameState === 'dungeon') handleDungeonTap(x, y, e);
  try { canvas.setPointerCapture(e.pointerId); } catch (_){}
}, { passive: false });
canvas.addEventListener('pointermove', (e) => {
  if (gameState === 'hudedit'){ if (handleHudEditMove(e)) e.preventDefault(); return; }
  if (settingsDrag && settingsDrag.id === e.pointerId){ settingsSliderSet(settingsDrag.which, e.clientX); e.preventDefault(); return; }
  if (wardrobeOpen && wardrobeDrag && wardrobeDrag.id === e.pointerId){
    const dy = e.clientY - wardrobeDrag.startY;
    if (Math.abs(dy) > 8) wardrobeDrag.moved = true;
    if (wardrobeDrag.moved) wardrobeScroll = clamp(wardrobeDrag.startScroll - dy, 0, wardrobeMaxScroll);
    e.preventDefault();
    return;
  }
  if (shopOpen && shopDrag && shopDrag.id === e.pointerId){
    const dy = e.clientY - shopDrag.startY;
    if (Math.abs(dy) > 8) shopDrag.moved = true;
    if (shopDrag.moved) shopScrollY = clamp(shopDrag.startScroll - dy, 0, shopMaxScroll);
    e.preventDefault();
    return;
  }
  const j = input.joy;
  if (j.active && j.id === e.pointerId){
    const dx = e.clientX - j.ox, dy = e.clientY - j.oy;
    const d = Math.hypot(dx, dy) || 1;
    const maxR = 64 * (j.k || 1);
    const k = Math.min(d, maxR) / maxR;
    j.dx = (dx/d) * k; j.dy = (dy/d) * k;
    e.preventDefault();
  }
}, { passive: false });
function releasePointer(e){
  handleHudEditUp(e);
  if (settingsDrag && settingsDrag.id === e.pointerId){ const w = settingsDrag.which; settingsDrag = null; saveProgress(); if (w === 'sfx') sfx('coin'); }
  if (shopDrag && shopDrag.id === e.pointerId){
    const d = shopDrag; shopDrag = null;
    if (!d.moved && e.type === 'pointerup' && shopOpen) handleShopTap(e.clientX, e.clientY);
  }
  if (wardrobeDrag && wardrobeDrag.id === e.pointerId){
    const d = wardrobeDrag; wardrobeDrag = null;
    if (!d.moved && e.type === 'pointerup' && wardrobeOpen) handleWardrobeTap(e.clientX, e.clientY);
  }
  const j = input.joy;
  if (j.active && j.id === e.pointerId){ j.active = false; j.id = null; j.dx = 0; j.dy = 0; }
  if (input.attack.id === e.pointerId){ input.attack.down = false; input.attack.id = null; }
  if (input.alt.id === e.pointerId){ input.alt.down = false; input.alt.id = null; }
  if (input.block.id === e.pointerId){ input.block.down = false; input.block.id = null; }
}

  }
  if (abilitySelectOpen){
    if (k === 'escape'){ abilitySelectOpen = false; saveProgress(); resetInput(); e.preventDefault(); }
    return;
  }
  if (shopOpen){
    if (k === 'escape'){ shopOpen = false; resetInput(); e.preventDefault(); }
    return;
  }
  if (chronicleOpen){
    if (k === 'escape' || k === 'enter' || k === ' '){ chronicleOpen = false; resetInput(); e.preventDefault(); }
    return;
  }
  if (forgeOpen){
    if (k === 'escape'){ forgeOpen = false; resetInput(); e.preventDefault(); }
    return;
  }
  if (altarOpen){
    if (k === 'escape'){ altarOpen = false; resetInput(); e.preventDefault(); }
    return;
  }
  if (wardrobeOpen){
    if (k === 'escape'){ wardrobeOpen = false; saveProgress(); resetInput(); e.preventDefault(); }
    return;
  }
  if (inventoryOpen){
    if (k === 'i' || k === 'escape'){ inventoryOpen = false; playerInventory.selectedSlot = null; resetInput(); e.preventDefault(); }
    return;
  }
  if (paused){
    if (k === 'escape'){ paused = false; resetInput(); e.preventDefault(); }
    return;
  }
  if (gameState === 'menu'){
    if (k === 'enter' || k === ' '){ enterLobby(); e.preventDefault(); }
    return;
  }
  if (gameState === 'multiplayer'){ if (/^[0-9]$/.test(k) && mpScreen==='join' && mpCode.length<4) mpCode+=k; if(k==='backspace'&&mpScreen==='join')mpCode=mpCode.slice(0,-1); if(k==='escape'){gameState='menu';mpScreen='home';} e.preventDefault(); return; }
  if (gameState === 'gameover'){ if (k === 'r' || k === 'enter'){ enterLobby(); e.preventDefault(); } return; }
  if (gameState === 'lobby' || gameState === 'dungeon'){
    if (k === 'i'){ inventoryOpen = true; playerInventory.selectedSlot = null; resetInput(); e.preventDefault(); return; }
    if (k === 'escape'){ paused = true; resetInput(); e.preventDefault(); return; }
    if ((k === ' ' || k === 'j') && !e.repeat){ handleAttackPress(); e.preventDefault(); }
    if(k==='f'&&!e.repeat){doAltAttack();e.preventDefault();}
    if ((k === 'e' || k === 'l') && !e.repeat){ doAltAttack(); e.preventDefault(); }
    if (k === 'q' && !e.repeat){ activateAbility(); e.preventDefault(); }
    if (k === 'k' && !e.repeat){ doDodge(); e.preventDefault(); }
    if (k === 'shift' && !input.block.down){
      if (getShieldStats()){ input.block.down = true; }
    }
    if (k === '1' && !e.repeat) useQuickSlot(0);
    if (k === '2' && !e.repeat) useQuickSlot(1);
    if (k === '3' && !e.repeat) useQuickSlot(2);
    if (k === '4' && !e.repeat) useQuickSlot(3);
  }
});
window.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  keys[k] = false;
  if (k === 'shift'){ input.block.down = false; input.block.id = null; }
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

/* ==================== MAIN LOOP ==================== */
let last = performance.now();
let _uiPrev = 0;
function loop(now){
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  if (gameState === 'dungeon' && floor > bestFloor) bumpBestFloor();
  frameEMA = frameEMA * 0.95 + dt * 1000 * 0.05;
  if (now - lastDprChange > 3000){
    const dprCap = IS_ANDROID ? Math.min(MAX_DPR, 1.25) : MAX_DPR;
    if (frameEMA > 34 && currentDPR > 1){ currentDPR = Math.max(1, currentDPR - 0.25); lastDprChange = now; resize(); }
    else if (frameEMA < 20 && currentDPR < dprCap){ currentDPR = Math.min(dprCap, currentDPR + 0.25); lastDprChange = now; resize(); }
  }
  { const f = (inventoryOpen?1:0) | (shopOpen?2:0) | (wardrobeOpen?4:0) | (forgeOpen?8:0) | (altarOpen?16:0) | (abilitySelectOpen?32:0) | (paused?64:0) | (chronicleOpen?128:0);
    if (f !== _uiPrev){ sfx(f > _uiPrev ? 'open' : 'close'); _uiPrev = f; } }
  updateMusic(dt);
  try {
    if (!isLandscape()){ menuTime += dt; render(); return; }
    if (gameState === 'loading'){ updateLoading(dt); updateAmbient(dt); render(); return; }
    if (gameState === 'settings' || inventoryOpen || paused || shopOpen || wardrobeOpen || abilitySelectOpen || forgeOpen || altarOpen || chronicleOpen){ if (toast.t > 0) toast.t -= dt; }
    else if (gameState === 'lobby' || gameState === 'dungeon'){
      if (hitStop > 0) hitStop -= dt;
      else update(dt);
    } else if(gameState==='downed'){mpUpdate(dt);updateParticles(dt);updateFloaters(dt);updateCamera(dt);
      if (hitStop > 0) hitStop -= dt;
      else update(dt);
    } else {
      updateAmbient(dt);
      if (gameState === 'gameover') gameOverTimer += dt;
    }
    render();
  } catch (err){
    console.error('Игровой цикл:', err);
  }
}

/* ==================== START ==================== */
function initDefaultInventory(){
  playerInventory.items = [
    makeItem('weapon_sword', 'common'),
    makeItem('chest_leather', 'common'),
    makeItem('helm_leather', 'common'),
    makeItem('boots_leather', 'common'),
    makeItem('healPotion', 'common'),
    makeItem('healPotion', 'common')
  ];
  playerInventory.items[4].quantity = 3;
  playerInventory.items[5].quantity = 2;
  playerInventory.equipment.weapon = makeItem('weapon_sword', 'common');
  playerInventory.quickSlots[0] = makeItem('healPotion', 'common');
  playerInventory.quickSlots[0].quantity = 3;
}
loadProgress();
if (playerInventory.items.length === 0 && !playerInventory.equipment.weapon){
  initDefaultInventory();
}
mergeStacks();
resize();
initAuraSprites();
initFloorPattern();
enterMenu();
requestAnimationFrame(loop);

window._dev = {
  setAbility: (name) => { currentAbility = name; },
  getAbility: () => currentAbility,
  activate: (name) => {
    if (name) currentAbility = name;
    activateAbility();
  },
  cd: () => abilityCd,
  resetCd: () => { abilityCd = 0; },
  giveWeapon: (key) => {
    const w = makeItem(key, 'common');
    if (!w) { showToast('НЕТ ТАКОГО ОРУЖИЯ: ' + key); return; }
    playerInventory.items.push(w);
    showToast('+ ' + w.name);
    saveProgress();
  },
  equip: (key, hand) => {
    const w = makeItem(key, 'common');
    if (!w) return;
    equipItemTo(w, hand || 'R');
  }
};

})();
</script>
