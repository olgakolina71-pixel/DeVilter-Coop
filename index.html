<canvas id="game"></canvas>
<script>
(() => {
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const IS_ANDROID = /Android/i.test(navigator.userAgent);
const MAX_DPR = Math.min(window.devicePixelRatio || 1, 2);
let currentDPR = IS_ANDROID ? Math.min(MAX_DPR, 1.25) : MAX_DPR;
let W = 1, H = 1, vignette = null;
let frameEMA = 16, lastDprChange = 0;

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = Math.floor(W * currentDPR);
  canvas.height = Math.floor(H * currentDPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(currentDPR, 0, 0, currentDPR, 0, 0);
  const g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.28, W/2, H/2, Math.max(W,H)*0.85);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.55, 'rgba(8,0,14,0.30)');
  g.addColorStop(1, 'rgba(0,0,0,0.94)');
  vignette = g;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

const TAU = Math.PI * 2;
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
const lerp  = (a,b,t) => a + (b-a) * t;
const rand  = (a,b) => a + Math.random() * (b-a);
function angleDiff(a,b){
  let d = (a - b) % TAU;
  if (d >  Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}
function rr(x,y,w,h,r){
  if (w <= 0.5 || h <= 0.5) return;
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}
function hash2(x, y){
  let h = (x * 73856093) ^ (y * 19349663);
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) & 0x7fffffff) / 0x7fffffff;
}
function isLandscape(){ return W >= H; }
function hexA(hex, a){
  if (typeof hex !== 'string' || hex[0] !== '#' || hex.length < 7) return `rgba(255,60,80,${a})`;
  const h = hex.slice(1, 7);
  const r = parseInt(h.substr(0,2), 16);
  const g = parseInt(h.substr(2,2), 16);
  const b = parseInt(h.substr(4,2), 16);
  if (isNaN(r) || isNaN(g) || isNaN(b)) return `rgba(255,60,80,${a})`;
  return `rgba(${r},${g},${b},${a})`;
}
function makeSeededRandom(seed){
  let s = seed | 0;
  if (s === 0) s = 1;
  return function(){
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    return s / 0x7fffffff;
  };
}

/* ==================== АУДИО: ДВИЖОК, ЗВУКИ, МУЗЫКА ==================== */
let soundOn = true, musicVol = 0.7, sfxVol = 0.9;
let audioCtx = null, masterG = null, musicBus = null, sfxBus = null, revIn = null;
let _noiseBuf = null, _activeVoices = 0;
function makeImpulse(sec, decay){
  const sr = audioCtx.sampleRate, n = Math.floor(sr * sec), b = audioCtx.createBuffer(2, n, sr);
  for (let c = 0; c < 2; c++){ const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, decay); }
  return b;
}
function ensureAudio(){
  if (audioCtx) return true;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    audioCtx = new AC();
    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
    masterG = audioCtx.createGain(); masterG.gain.value = 0.85;
    masterG.connect(comp); comp.connect(audioCtx.destination);
    musicBus = audioCtx.createGain(); sfxBus = audioCtx.createGain();
    musicBus.connect(masterG); sfxBus.connect(masterG);
    const conv = audioCtx.createConvolver(); conv.buffer = makeImpulse(2.4, 2.8);
    revIn = audioCtx.createGain(); const revOut = audioCtx.createGain(); revOut.gain.value = 0.55;
    revIn.connect(conv); conv.connect(revOut); revOut.connect(masterG);
    _noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
    const nd = _noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random()*2-1;
    applyVolumes();
    return true;
  } catch(e){ audioCtx = null; return false; }
}
function applyVolumes(){
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  musicBus.gain.setTargetAtTime(soundOn ? musicVol * 0.6 : 0, t, 0.05);
  sfxBus.gain.setTargetAtTime(soundOn ? sfxVol : 0, t, 0.05);
}
/* один голос: осциллятор(ы) → фильтр → огибающая → шина (+ реверберация) */
function voice(o){
  const ac = audioCtx, t = ac.currentTime + 0.004 + (o.t || 0);
  const dur = o.dur || 0.2, a = o.a || 0.004, vol = o.vol || 0.08;
  const bus = o.bus || sfxBus;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + a);
  if (o.hold) g.gain.setValueAtTime(vol, t + Math.min(o.hold, dur * 0.9));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let head = g;
  if (o.pan && ac.createStereoPanner){ const p = ac.createStereoPanner(); p.pan.value = o.pan; g.connect(p); head = p; }
  head.connect(bus);
  if (o.rev && revIn){ const rg = ac.createGain(); rg.gain.value = o.rev; head.connect(rg); rg.connect(revIn); }
  let into = g;
  if (o.lp || o.hp || o.bp){
    const f = ac.createBiquadFilter();
    f.type = o.bp ? 'bandpass' : (o.hp ? 'highpass' : 'lowpass');
    const f0 = o.bp || o.hp || o.lp, f1 = o.lp2 || o.hp2 || o.bp2 || f0;
    f.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    f.Q.value = o.q || 0.8;
    f.connect(g); into = f;
  }
  const n = o.voices || 1;
  let first = null;
  for (let i = 0; i < n; i++){
    const os = ac.createOscillator();
    os.type = o.type || 'sine';
    const f0 = Math.max(20, o.f || 440);
    os.frequency.setValueAtTime(f0, t);
    if (o.f2) os.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t + (o.slide || dur));
    if (n > 1) os.detune.value = (i - (n-1)/2) * (o.det || 12);
    if (o.vibD){
      const lf = ac.createOscillator(), lg = ac.createGain();
      lf.frequency.value = o.vibR || 6; lg.gain.value = o.vibD;
      lf.connect(lg); lg.connect(os.frequency); lf.start(t); lf.stop(t + dur + 0.05);
    }
    os.connect(into);
    os.start(t); os.stop(t + dur + 0.05);
    if (!first) first = os;
  }
  _activeVoices++;
  first.onended = () => { _activeVoices--; };
}
function noiz(o){
  const ac = audioCtx, t = ac.currentTime + 0.004 + (o.t || 0);
  const dur = o.dur || 0.15, a = o.a || 0.003, vol = o.vol || 0.06;
  const s = ac.createBufferSource(); s.buffer = _noiseBuf; s.loop = true;
  const f = ac.createBiquadFilter(); f.type = o.type || 'bandpass';
  const f0 = o.f || 1000, f1 = o.f2 || f0;
  f.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  f.Q.value = o.q || 1;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g);
  const bus = o.bus || sfxBus;
  g.connect(bus);
  if (o.rev && revIn){ const rg = ac.createGain(); rg.gain.value = o.rev; g.connect(rg); rg.connect(revIn); }
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  _activeVoices++;
  s.onended = () => { _activeVoices--; };
}

      mvoice(m, { t:dt0, type:'sine', f:midiF(d.root + 36 + 6), dur:1.0, vol:P.vol*0.7, rev:0.9 });

  if (d.drums && on(d.drums)){

    if (hit(D.k)){ mvoice(m, { t:dt0, type:'sine', f:150, f2:42, dur:0.16, vol:(D.k[s] === 'X' ? 0.2 : 0.16) }); mnoiz(m, { t:dt0, type:'lowpass', f:200, dur:0.03, vol:0.05 }); }

    if (hit(D.t)){ mvoice(m, { t:dt0, type:'sine', f:110, f2:60, dur:0.3, vol:0.1, rev:0.4 }); }
  }
  /* окружение */
  if (d.amb === 'drip' && Math.random() < 0.05) mvoice(m, { t:dt0, type:'sine', f:rv(1300, 0.4), f2:700, dur:0.12, vol:0.03, rev:0.8 });

const bodyGradCache = {};
const dotCache = {};
function getDotSprite(color){
  if (!dotCache[color]){
    const c = document.createElement('canvas'); c.width = 32; c.height = 32;
    const g = c.getContext('2d');
    g.fillStyle = color;
    g.beginPath(); g.arc(16, 16, 14, 0, TAU); g.fill();
    dotCache[color] = c;
  }
  return dotCache[color];
}

const auraCache = {};
function makeAuraSprite(color, size){
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const cx = c.getContext('2d');
  const g = cx.createRadialGradient(size/2, size/2, 2, size/2, size/2, size/2);
  g.addColorStop(0, hexA(color, 0.5));
  g.addColorStop(0.55, hexA(color, 0.15));
  g.addColorStop(1, hexA(color, 0));
  cx.fillStyle = g;
  cx.fillRect(0, 0, size, size);
  return c;
}
function initAuraSprites(){
  const colors = ['#c8c8d8','#7bff8a','#ffd166','#ff2b45','#b04bff','#ff7b1a','#ff0033','#ffaa00','#ff55ff','#5ad7ff'];
  for (const c of colors){ if (!auraCache[c]) auraCache[c] = makeAuraSprite(c, 128); }
}

  };
  if (key === 'healPotion') drawPotion('#ff2b45', '#8a0020');

  else if (key === 'defPotion') drawPotion('#5ad7ff', '#0055aa');
  else if (key === 'throwKnife') drawKnife('#dce5ee');

function initFloorPattern(){

  cx.fillStyle = '#150815';

  cx.lineWidth = 1;

  cx.moveTo(T/2 + 1.5, 0); cx.lineTo(T/2 + 1.5, T);

  cx.lineWidth = 1.5;
  cx.beginPath();
  cx.moveTo(T * 0.2, T * 0.3);
  cx.lineTo(T * 0.5, T * 0.55);
  cx.lineTo(T * 0.45, T * 0.8);
  cx.stroke();

  cx.lineTo(T * 0.8, T * 0.38);
  cx.lineTo(T * 0.68, T * 0.6);
